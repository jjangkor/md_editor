        }

        function docxMathMLToOmml(el) {
            const kids = () => Array.from(el.children).map(docxMathMLToOmml).join('');
            const arg = i => el.children[i] ? docxMathMLToOmml(el.children[i]) : '';
            const text = (el.textContent || '').replace(/\s+/g, ' ');
            switch (el.localName) {
                case 'annotation': case 'annotation-xml': case 'mphantom':
                    return '';
                case 'mi':
                    return docxMathRun(text, text.length > 1 || el.getAttribute('mathvariant') === 'normal');
                case 'mn': case 'mo':
                    return docxMathRun(text);
                case 'mtext': case 'ms':
                    return docxMathRun(text, true);
                case 'mspace':
                    return docxMathRun(' ');
                case 'msup':
                    return '<m:sSup><m:e>' + arg(0) + '</m:e><m:sup>' + arg(1) + '</m:sup></m:sSup>';
                case 'msub':
                    return '<m:sSub><m:e>' + arg(0) + '</m:e><m:sub>' + arg(1) + '</m:sub></m:sSub>';
                case 'msubsup':
                    return '<m:sSubSup><m:e>' + arg(0) + '</m:e><m:sub>' + arg(1) + '</m:sub><m:sup>' + arg(2) + '</m:sup></m:sSubSup>';
                case 'mfrac': {
                    const noBar = /^0(\.0*)?([a-z]+)?$/.test(el.getAttribute('linethickness') || '');
                    return '<m:f>' + (noBar ? '<m:fPr><m:type m:val="noBar"/></m:fPr>' : '')
                        + '<m:num>' + arg(0) + '</m:num><m:den>' + arg(1) + '</m:den></m:f>';
                }
                case 'msqrt':
                    return '<m:rad><m:radPr><m:degHide m:val="1"/></m:radPr><m:deg/><m:e>' + kids() + '</m:e></m:rad>';
                case 'mroot':
                    return '<m:rad><m:deg>' + arg(1) + '</m:deg><m:e>' + arg(0) + '</m:e></m:rad>';
                case 'mover':
                    if (el.getAttribute('accent') === 'true' && el.children[1]) {
                        return '<m:acc><m:accPr><m:chr m:val="' + docxEscape(el.children[1].textContent.trim()) + '"/></m:accPr><m:e>' + arg(0) + '</m:e></m:acc>';
                    }
                    return '<m:limUpp><m:e>' + arg(0) + '</m:e><m:lim>' + arg(1) + '</m:lim></m:limUpp>';
                case 'munder':
                    return '<m:limLow><m:e>' + arg(0) + '</m:e><m:lim>' + arg(1) + '</m:lim></m:limLow>';
                case 'munderover':
                    return '<m:limUpp><m:e><m:limLow><m:e>' + arg(0) + '</m:e><m:lim>' + arg(1) + '</m:lim></m:limLow></m:e>'
                        + '<m:lim>' + arg(2) + '</m:lim></m:limUpp>';
                case 'mtable':
                    return '<m:m>' + Array.from(el.children).map(row =>
                        '<m:mr>' + Array.from(row.children).map(cell => '<m:e>' + docxMathMLToOmml(cell) + '</m:e>').join('') + '</m:mr>'
                    ).join('') + '</m:m>';
                default:
                    return kids();
            }
        }

        /**
         * KaTeX 요소 → OMML (display는 가운데 수식 문단 oMathPara). MathML이 없으면 null
         */
        function docxKatexToOmml(katexRoot) {
            const math = katexRoot.querySelector('.katex-mathml math, math');
            if (!math) return null;
            const inner = '<m:oMath>' + docxMathMLToOmml(math) + '</m:oMath>';
            return katexRoot.closest('.katex-display') ? '<m:oMathPara>' + inner + '</m:oMathPara>' : inner;
        }

        /**
         * 미리보기의 인라인 노드를 OOXML 런 목록으로 변환
         */
        function docxInlineToRuns(node, fmt, state) {
            if (node.nodeType === Node.TEXT_NODE) {
                if (node.textContent.trim() === '') {
                    // 블록 요소 사이·요소 가장자리의 공백 노드는 무시
                    const isBlock = el => el && el.nodeType === Node.ELEMENT_NODE
                        && /^(UL|OL|P|PRE|TABLE|BLOCKQUOTE|DIV|LI|H[1-6]|TR|TD|TH)$/.test(el.tagName);
                    const prev = node.previousSibling;
                    const next = node.nextSibling;
                    if (!prev || !next || isBlock(prev) || isBlock(next)) return '';
                    return docxMakeRun(' ', fmt);
                }
                return docxMakeRun(node.textContent.replace(/[ \t\r\n]+/g, ' '), fmt);
            }
            if (node.nodeType !== Node.ELEMENT_NODE) return '';

            const tag = node.tagName;
            if (node.classList.contains('katex-display') || node.classList.contains('katex')) {
                const katexRoot = node.classList.contains('katex') ? node : (node.querySelector('.katex') || node);
                const omml = docxKatexToOmml(katexRoot);
                if (omml) return omml;
                return docxMakeRun(docxTexFromKatex(katexRoot), Object.assign({}, fmt, { math: true }));
            }

            if (tag === 'SUP' && node.classList.contains('footnote-ref')) {
                const n = parseInt(node.getAttribute('data-fn'), 10);
                if (!n || state.inFootnote) return '';
                if (!state.footnotes.includes(n)) state.footnotes.push(n);
                return '<w:r><w:rPr><w:rStyle w:val="FootnoteReference"/></w:rPr><w:footnoteReference w:id="' + n + '"/></w:r>';
            }

            switch (tag) {
                case 'BR':
                    return '<w:r>' + docxRunProps(fmt) + '<w:br/></w:r>';
                case 'STRONG': case 'B':
                    fmt = Object.assign({}, fmt, { bold: true }); break;
                case 'EM': case 'I':
                    fmt = Object.assign({}, fmt, { italic: true }); break;
                case 'DEL': case 'S': case 'STRIKE':
                    fmt = Object.assign({}, fmt, { strike: true }); break;
                case 'U':
                    fmt = Object.assign({}, fmt, { underline: true }); break;
                case 'SUP':
                    fmt = Object.assign({}, fmt, { sup: true }); break;
                case 'SUB':
                    fmt = Object.assign({}, fmt, { sub: true }); break;
                case 'CODE':
                    fmt = Object.assign({}, fmt, { code: true }); break;
                case 'IMG':
                    if (state.inFootnote) return docxMakeRun('[이미지: ' + (node.getAttribute('alt') || '') + ']', { italic: true });
                    return docxImageRun(node, state);
                case 'A': {
                    const href = node.getAttribute('href') || '';
                    const linkFmt = Object.assign({}, fmt, { link: true });
                    let inner = '';
                    node.childNodes.forEach(child => { inner += docxInlineToRuns(child, linkFmt, state); });
                    if (inner === '') return '';
                    // 각주 파트는 본문과 관계(rels)가 따로라 링크는 글자만 남긴다
                    if (state.inFootnote) return inner;
                    if (href.startsWith('#')) {
                        return '<w:hyperlink w:anchor="' + docxBookmarkName(href.slice(1)) + '">' + inner + '</w:hyperlink>';
                    }
                    if (/^(https?:|mailto:)/i.test(href)) {
                        const relId = 'rId' + (state.relCounter++);
                        state.rels.push('<Relationship Id="' + relId + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="' + docxEscape(href) + '" TargetMode="External"/>');
                        return '<w:hyperlink r:id="' + relId + '">' + inner + '</w:hyperlink>';
                    }
                    return inner;
                }
            }

            let runs = '';
            node.childNodes.forEach(child => { runs += docxInlineToRuns(child, fmt, state); });
            return runs;
        }

        /**
         * 미리 수집한 이미지 데이터를 인라인 그림 런으로 변환
         */
        function docxImageRun(img, state) {
            const data = state.images.get(img);
            if (!data) {
                const alt = img.getAttribute('alt') || img.getAttribute('src') || '이미지';
                return docxMakeRun('[이미지: ' + alt + ']', { italic: true, color: '808080' });
            }
            const id = ++state.drawingId;
            const name = docxEscape(img.getAttribute('alt') || ('그림 ' + id));
            return '<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">'
                + '<wp:extent cx="' + data.cx + '" cy="' + data.cy + '"/>'
                + '<wp:effectExtent l="0" t="0" r="0" b="0"/>'
                + '<wp:docPr id="' + id + '" name="' + name + '"/>'
                + '<wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr>'
                + '<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">'
                + '<pic:pic><pic:nvPicPr><pic:cNvPr id="' + id + '" name="' + name + '"/><pic:cNvPicPr/></pic:nvPicPr>'
                + '<pic:blipFill><a:blip r:embed="' + data.relId + '"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>'
                + '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + data.cx + '" cy="' + data.cy + '"/></a:xfrm>'
                + '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>'
                + '</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>';
        }

        /**
         * 이미지 바이트 형식 판별 (PNG·JPEG·GIF·BMP)
         */
        function sniffImageType(bytes) {
            if (bytes.length > 8 && bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4E && bytes[3] === 0x47) return 'png';
            if (bytes.length > 3 && bytes[0] === 0xFF && bytes[1] === 0xD8 && bytes[2] === 0xFF) return 'jpg';
            if (bytes.length > 6 && bytes[0] === 0x47 && bytes[1] === 0x49 && bytes[2] === 0x46) return 'gif';
            if (bytes.length > 2 && bytes[0] === 0x42 && bytes[1] === 0x4D) return 'bmp';
            return null;
        }

        /**
         * 내보내기용 이미지 데이터 — { bytes, ext, width, height } 또는 null
         *  1) 원본 바이트를 그대로 쓴다(data:·blob:·같은 출처·CORS 허용) — JPEG 사진을 PNG로
         *     다시 인코딩하면 용량이 몇 배로 커지므로 PNG·JPEG·GIF·BMP는 원본 유지
         *  2) 그 밖의 형식(WebP·SVG 등)은 캔버스로 PNG 재인코딩
         *  아직 로딩 중인 이미지는 최대 5초 기다린다
         */
        async function exportImageData(img) {
            if (!img.complete || !img.naturalWidth) {
                try {
                    await Promise.race([
                        img.decode ? img.decode() : Promise.reject(new Error('decode 미지원')),
                        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 5000))
                    ]);
                } catch (e) { /* 아래에서 크기 확인 */ }
            }
            const width = img.naturalWidth;
            const height = img.naturalHeight;
            if (!width || !height) return null;
            try {
                const response = await fetch(img.currentSrc || img.src);
                if (response.ok) {
                    const bytes = new Uint8Array(await response.arrayBuffer());
                    const ext = sniffImageType(bytes);
                    if (ext) return { bytes, ext, width, height };
                }
            } catch (fetchError) { /* 캔버스로 재시도 */ }
            try {
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0);
                const binary = atob(canvas.toDataURL('image/png').split(',')[1]);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                return { bytes, ext: 'png', width, height };
            } catch (canvasError) {
                return null; // CORS로 막힌 이미지 — 대체 텍스트 사용
            }
        }

        /**
         * 미리보기의 이미지를 문서 미디어로 수집 (실패 시 대체 텍스트 사용)
         */
        async function docxCollectImages(root, state) {
            const imgs = root.querySelectorAll('img');
            for (const img of imgs) {
                const data = await exportImageData(img);
                if (!data) continue;
                const ext = data.ext === 'jpg' ? 'jpeg' : data.ext;
                let cx = Math.round(data.width * 9525);
                let cy = Math.round(data.height * 9525);
                if (cx > DOCX_CONTENT_WIDTH_EMU) {
                    cy = Math.max(1, Math.round(cy * DOCX_CONTENT_WIDTH_EMU / cx));
                    cx = DOCX_CONTENT_WIDTH_EMU;
                }
                const mediaIndex = state.media.length + 1;
                const fileName = 'image' + mediaIndex + '.' + ext;
                const relId = 'rId' + (state.relCounter++);
                state.media.push({ name: 'word/media/' + fileName, data: data.bytes, store: true });
                state.rels.push('<Relationship Id="' + relId + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/' + fileName + '"/>');
                state.images.set(img, { relId, cx: Math.max(1, cx), cy: Math.max(1, cy) });
            }
        }

        /**
         * 코드 블록(pre)을 Source Code 단락들로 변환
         */
        function docxPreToXml(pre, ctx) {
            const text = pre.textContent.replace(/\n$/, '');
            const indent = ctx.listLevel >= 0 ? 720 * (ctx.listLevel + 1) : 0;
            // 견본과 동일하게 코드 블록 전체를 한 단락으로 만들고 줄은 <w:br/>로 구분
            const runs = text.split('\n').map(line => docxMakeRun(line, { code: true }))
                .join('<w:r><w:rPr><w:rStyle w:val="VerbatimChar"/></w:rPr><w:br/></w:r>');
            return '<w:p>' + docxParaProps({ style: 'SourceCode', indLeft: indent }) + runs + '</w:p>';
        }

        /**
         * 표를 병합(colspan·rowspan)을 반영한 격자로 펼친다 (Word·한글 공용)
         * cells: 병합 원점 셀 {el, row, col, rowSpan, colSpan} — 모자란 칸은 el=null 빈 셀로 채움
         * slots[r][c]: 그 칸을 차지한 셀
         */
        function tableGrid(table) {
            const rows = Array.from(table.rows);
            const slots = rows.map(() => []);
            const cells = [];
            rows.forEach((row, r) => {
                let c = 0;
                Array.from(row.cells).forEach(el => {
                    while (slots[r][c]) c++;
                    const colSpan = Math.min(Math.max(parseInt(el.getAttribute('colspan') || '1', 10) || 1, 1), 1000);
                    const rowSpan = Math.min(Math.max(parseInt(el.getAttribute('rowspan') || '1', 10) || 1, 1), rows.length - r);
                    const cell = { el, row: r, col: c, rowSpan, colSpan };
                    for (let dr = 0; dr < rowSpan; dr++) {
                        for (let dc = 0; dc < colSpan; dc++) slots[r + dr][c + dc] = cell;
                    }
                    cells.push(cell);
                    c += colSpan;
                });
            });
            const colCount = Math.max(0, ...slots.map(row => row.length));
            slots.forEach((row, r) => {
                for (let c = 0; c < colCount; c++) {
                    if (!row[c]) {
                        const cell = { el: null, row: r, col: c, rowSpan: 1, colSpan: 1 };
                        row[c] = cell;
                        cells.push(cell);
                    }
                }
            });
            cells.sort((a, b) => a.row - b.row || a.col - b.col);
            // 모든 칸이 th인 행은 머리행
            const headerRows = rows.map(row => row.cells.length > 0
                && Array.from(row.cells).every(cell => cell.tagName === 'TH'));
            return { rows, slots, cells, colCount, rowCount: rows.length, headerRows };
        }

        /**
         * 글자 폭 단위 (한글·전각 1, 그 밖 0.55)
         */
        function textWidthUnits(text) {
            let units = 0;
            for (const ch of String(text)) {
                units += /[ᄀ-ᇿ⺀-鿿가-힯豈-﫿＀-｠]/.test(ch) ? 1 : 0.55;
            }
            return units;
        }

        /**
         * 열 폭 계산 — 미리보기 측정값(병합 없는 행) 우선, 측정 불가 시 내용 비례
         * (가장 긴 어절이 한 줄에 들어갈 폭을 하한으로 두고 긴 설명 열에 더 배분)
         */
        function tableColumnWidths(grid, total, minWidth) {
            const n = grid.colCount;
            let weights = null;
            for (const row of grid.rows) {
                const cells = Array.from(row.cells);
                if (cells.length !== n || cells.some(cell => (cell.colSpan || 1) !== 1)) continue;
                const measured = cells.map(cell => cell.getBoundingClientRect().width);
                if (measured.reduce((sum, w) => sum + w, 0) > 0) { weights = measured; break; }
            }
            if (!weights) {
                weights = new Array(n).fill(0);
                grid.cells.forEach(cell => {
                    if (!cell.el || cell.colSpan !== 1) return;
                    const text = cell.el.textContent.replace(/\s+/g, ' ').trim();
                    const longestWord = Math.max(0, ...text.split(' ').map(textWidthUnits));
                    const need = Math.max(longestWord, Math.min(textWidthUnits(text), 24)) + 1.5;
                    weights[cell.col] = Math.max(weights[cell.col], need);
                });
                weights = weights.map(w => w || 3);
            }
            // 비례 배분 — 하한 미만 열은 하한으로 고정하고 나머지를 다시 배분
            const widths = new Array(n).fill(0);
            let fixed = new Array(n).fill(false);
            for (let pass = 0; pass < n; pass++) {
                const freeWeight = weights.reduce((sum, w, i) => sum + (fixed[i] ? 0 : w), 0);
                const freeTotal = total - fixed.reduce((sum, f) => sum + (f ? minWidth : 0), 0);
                let changed = false;
                for (let i = 0; i < n; i++) {
                    if (fixed[i]) { widths[i] = minWidth; continue; }
                    widths[i] = freeWeight > 0 ? Math.round(weights[i] / freeWeight * freeTotal) : Math.floor(freeTotal / n);
                    if (widths[i] < minWidth) { fixed[i] = true; changed = true; }
                }
                if (!changed) break;
            }
            // 반올림 오차는 가장 넓은 열이 흡수
            const diff = total - widths.reduce((sum, w) => sum + w, 0);
            if (n > 0) widths[widths.indexOf(Math.max(...widths))] += diff;
            return widths;
        }

        /**
         * 표를 견본과 동일한 서식(격자 테두리 + 하늘색 머리행)으로 변환
         */
        function docxTableToXml(table, state) {
            const grid = tableGrid(table);
            if (grid.rowCount === 0 || grid.colCount === 0) return '';
            const widths = tableColumnWidths(grid, DOCX_CONTENT_WIDTH_TWIPS, 240);
            const spanWidth = cell => widths.slice(cell.col, cell.col + cell.colSpan).reduce((sum, w) => sum + w, 0);

            let xml = '<w:tbl><w:tblPr><w:tblStyle w:val="Table"/>'
                + '<w:tblW w:w="' + DOCX_CONTENT_WIDTH_TWIPS + '" w:type="dxa"/>'
                + '<w:tblLayout w:type="fixed"/>'
                + '<w:tblLook w:val="0020" w:firstRow="1" w:lastRow="0" w:firstColumn="0" w:lastColumn="0" w:noHBand="0" w:noVBand="0"/></w:tblPr>'
                + '<w:tblGrid>' + widths.map(w => '<w:gridCol w:w="' + w + '"/>').join('') + '</w:tblGrid>';

            grid.slots.forEach((slotRow, r) => {
                const isHeader = grid.headerRows[r];
                xml += '<w:tr>' + (isHeader ? '<w:trPr><w:tblHeader/></w:trPr>' : '');
                for (let c = 0; c < grid.colCount; c++) {
                    const cell = slotRow[c];
                    if (cell.col !== c) continue; // 가로 병합으로 덮인 칸
                    const headerCell = grid.headerRows[cell.row];
                    // 세로 병합: 원점 행은 restart, 아래 행은 내용 없는 continue 셀
                    const vMerge = cell.rowSpan > 1 ? (cell.row === r ? '<w:vMerge w:val="restart"/>' : '<w:vMerge/>') : '';
                    const cellProps = '<w:tcPr><w:tcW w:w="' + spanWidth(cell) + '" w:type="dxa"/>'
                        + (cell.colSpan > 1 ? '<w:gridSpan w:val="' + cell.colSpan + '"/>' : '')
                        + vMerge
                        + (headerCell ? '<w:shd w:val="clear" w:color="auto" w:fill="D9E2F3"/>' : '')
                        + '</w:tcPr>';
                    let paragraph;
                    if (cell.el && cell.row === r) {
                        const align = (cell.el.getAttribute('align') || '').toLowerCase();
                        const jc = align === 'center' ? 'center' : align === 'right' ? 'right' : (headerCell ? 'center' : '');
                        const fmt = headerCell ? { bold: true, color: '1F4E79' } : {};
                        let runs = '';
                        cell.el.childNodes.forEach(child => { runs += docxInlineToRuns(child, fmt, state); });
                        paragraph = '<w:p>' + docxParaProps({ style: 'Compact', jc: jc || undefined }) + runs + '</w:p>';
                    } else {
                        paragraph = '<w:p>' + docxParaProps({ style: 'Compact' }) + '</w:p>';
                    }
                    xml += '<w:tc>' + cellProps + paragraph + '</w:tc>';
                }
                xml += '</w:tr>';
            });
            return xml + '</w:tbl>';
        }

        /**
         * 목록(ul/ol)을 견본과 동일한 글머리 기호/번호 단락으로 변환
         */
        function docxListToXml(list, level, state, ctx) {
            const ordered = list.tagName === 'OL';
            let numId = 1;
            if (ordered) {
                const start = parseInt(list.getAttribute('start') || '1', 10) || 1;
                state.orderedListStarts.push(start);
                numId = 2 + state.orderedListStarts.length; // numId 1은 글머리 기호 목록
            }
            const ilvl = Math.min(level, 8);
            let xml = '';
            Array.from(list.children).forEach(li => {
                if (li.tagName !== 'LI') return;
                let firstParagraphDone = false;
                let inlineBuffer = '';
                const flushInline = () => {
                    if (inlineBuffer.trim() === '' && firstParagraphDone) { inlineBuffer = ''; return; }
                    xml += '<w:p>' + docxParaProps(firstParagraphDone
                        ? { style: 'Compact', indLeft: 720 * (ilvl + 1) }
                        : { style: 'Compact', numId: numId, ilvl: ilvl })
                        + inlineBuffer + '</w:p>';
                    inlineBuffer = '';
                    firstParagraphDone = true;
                };
                li.childNodes.forEach(child => {
                    const childTag = child.nodeType === Node.ELEMENT_NODE ? child.tagName : null;
                    if (childTag === 'UL' || childTag === 'OL') {
                        flushInline();
                        xml += docxListToXml(child, level + 1, state, ctx);
                    } else if (childTag === 'P') {
                        let runs = '';
                        child.childNodes.forEach(grandchild => { runs += docxInlineToRuns(grandchild, {}, state); });
                        inlineBuffer += runs;
                        flushInline();
                    } else if (childTag === 'PRE') {
                        flushInline();
                        xml += docxPreToXml(child, { listLevel: ilvl });
                    } else if (childTag === 'TABLE') {
                        flushInline();
                        xml += docxTableToXml(child, state);
                    } else if (childTag === 'BLOCKQUOTE') {
                        flushInline();
                        xml += docxBlocksToXml(child, state, { quoteDepth: (ctx.quoteDepth || 0) + 1, listLevel: ilvl });
                    } else {
                        inlineBuffer += docxInlineToRuns(child, {}, state);
                    }
                });
                if (!firstParagraphDone || inlineBuffer.trim() !== '') flushInline();
            });
            return xml;
        }

        /**
         * 미리보기 블록 요소들을 OOXML 본문으로 변환
         */
        function docxBlocksToXml(parent, state, ctx) {
            ctx = ctx || {};
            let xml = '';
            Array.from(parent.childNodes).forEach(node => {
                if (node.nodeType !== Node.ELEMENT_NODE) return;
                const tag = node.tagName;

                // 문서 끝 각주 목록은 Word 각주(footnotes.xml)로 옮긴다
                if (tag === 'SECTION' && node.classList.contains('footnotes')) return;
                if (tag === 'FIGURE' && node.classList.contains('md-chart')) {
                    xml += docxChartPara(node, state);
                    state.afterHeading = false;
                    return;
                }

                if (/^H[1-6]$/.test(tag)) {
                    const headingLevel = tag[1];
                    let bookmark = '';
                    let bookmarkEnd = '';
                    if (node.id) {
                        const bookmarkId = ++state.bookmarkCounter;
                        bookmark = '<w:bookmarkStart w:id="' + bookmarkId + '" w:name="' + docxBookmarkName(node.id) + '"/>';
                        bookmarkEnd = '<w:bookmarkEnd w:id="' + bookmarkId + '"/>';
                    }
                    let runs = '';
                    node.childNodes.forEach(child => { runs += docxInlineToRuns(child, {}, state); });
                    xml += '<w:p>' + docxParaProps({ style: headingLevel }) + bookmark + runs + bookmarkEnd + '</w:p>';
                    state.afterHeading = true;
                    return;
                }

                switch (tag) {
                    case 'P': {
                        // 블록 수식이 문단을 가르며 남긴 빈 <p>는 건너뛴다
                        if (isEmptyParagraph(node)) break;
                        const quoteDepth = ctx.quoteDepth || 0;
                        const style = quoteDepth > 0 ? 'a8' : (state.afterHeading ? 'FirstParagraph' : 'a0');
                        const displayMath = node.querySelector('.katex-display');
                        const paraOpts = { style };
                        if (quoteDepth > 1) paraOpts.indLeft = 480 * quoteDepth;
                        if (displayMath) paraOpts.jc = 'center';
                        let runs = '';
                        node.childNodes.forEach(child => { runs += docxInlineToRuns(child, {}, state); });
                        xml += '<w:p>' + docxParaProps(paraOpts) + runs + '</w:p>';
                        state.afterHeading = false;
                        break;
                    }
                    case 'UL': case 'OL':
                        xml += docxListToXml(node, ctx.listLevel != null && ctx.listLevel >= 0 ? ctx.listLevel : 0, state, ctx);
                        state.afterHeading = false;
                        break;
                    case 'BLOCKQUOTE':
                        xml += docxBlocksToXml(node, state, Object.assign({}, ctx, { quoteDepth: (ctx.quoteDepth || 0) + 1 }));
                        state.afterHeading = false;
                        break;
                    case 'PRE':
                        xml += docxPreToXml(node, { listLevel: ctx.listLevel != null ? ctx.listLevel : -1 });
                        state.afterHeading = false;
                        break;
                    case 'TABLE':
                        xml += docxTableToXml(node, state);
                        state.afterHeading = false;
                        break;
                    case 'HR':
                        xml += '<w:p>' + docxParaProps({ hr: true }) + '</w:p>';
                        state.afterHeading = false;
                        break;
                    default:
                        if (node.querySelector && node.querySelector('p, ul, ol, table, pre, blockquote, h1, h2, h3, h4, h5, h6')) {
                            xml += docxBlocksToXml(node, state, ctx);
                        } else {
                            let runs = '';
                            node.childNodes.forEach(child => { runs += docxInlineToRuns(child, {}, state); });
                            if (node.classList && node.classList.contains('katex')) {
                                runs = docxInlineToRuns(node, {}, state);
                            }
                            if (runs !== '') {
                                const isMathBlock = node.classList
                                    && (node.classList.contains('katex-display') || !!node.querySelector('.katex-display'));
                                xml += '<w:p>' + docxParaProps({ style: 'a0', jc: isMathBlock ? 'center' : undefined }) + runs + '</w:p>';
                                state.afterHeading = false;
                            }
                        }
                }
            });
            return xml;
        }

        /**
         * CRC-32 계산 (ZIP 무결성 검사값)
         */
        const DOCX_CRC_TABLE = (() => {
            const table = new Uint32Array(256);
            for (let n = 0; n < 256; n++) {
                let c = n;
                for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
                table[n] = c >>> 0;
            }
            return table;
        })();

        function docxCrc32(bytes) {
            let crc = 0xFFFFFFFF;
            for (let i = 0; i < bytes.length; i++) {
                crc = DOCX_CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
            }
            return (crc ^ 0xFFFFFFFF) >>> 0;
        }

        /**
         * DEFLATE(raw) 압축 — 브라우저 CompressionStream 사용, 미지원이면 null
         */
        async function zipDeflateRaw(data) {
            if (typeof CompressionStream === 'undefined') return null;
            try {
                const stream = new Blob([data]).stream().pipeThrough(new CompressionStream('deflate-raw'));
                return new Uint8Array(await new Response(stream).arrayBuffer());
            } catch (error) {
                return null;
            }
        }

        /**
         * ZIP 패키지 생성 (Word·한글 공용)
         * - XML 등 텍스트 항목은 DEFLATE로 압축, 압축된 이미지와 store 지정 항목(mimetype)은 무압축
         * - CompressionStream이 없는 브라우저는 전부 무압축(STORE)으로 저장
         */
        async function docxBuildZip(entries) {
            const encoder = new TextEncoder();
            const now = new Date();
            const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2);
            const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
            const localParts = [];
            const centralParts = [];
            let offset = 0;

            for (const entry of entries) {
                const nameBytes = encoder.encode(entry.name);
                const data = typeof entry.data === 'string' ? encoder.encode(entry.data) : entry.data;
                const crc = docxCrc32(data);
                let stored = data;
                let method = 0;
                if (!entry.store && data.length > 128) {
                    const deflated = await zipDeflateRaw(data);
                    if (deflated && deflated.length < data.length) { stored = deflated; method = 8; }
                }
                const header = new DataView(new ArrayBuffer(30));
                header.setUint32(0, 0x04034b50, true);
                header.setUint16(4, 20, true);          // 필요한 최소 버전
                header.setUint16(6, 0x0800, true);      // UTF-8 파일명 플래그
                header.setUint16(8, method, true);      // 0 = STORE, 8 = DEFLATE
                header.setUint16(10, dosTime, true);
                header.setUint16(12, dosDate, true);
                header.setUint32(14, crc, true);
                header.setUint32(18, stored.length, true);
                header.setUint32(22, data.length, true);
                header.setUint16(26, nameBytes.length, true);
                header.setUint16(28, 0, true);
                localParts.push(new Uint8Array(header.buffer), nameBytes, stored);

                const central = new DataView(new ArrayBuffer(46));
                central.setUint32(0, 0x02014b50, true);
                central.setUint16(4, 20, true);
                central.setUint16(6, 20, true);
                central.setUint16(8, 0x0800, true);
                central.setUint16(10, method, true);
                central.setUint16(12, dosTime, true);
                central.setUint16(14, dosDate, true);
                central.setUint32(16, crc, true);
                central.setUint32(20, stored.length, true);
                central.setUint32(24, data.length, true);
                central.setUint16(28, nameBytes.length, true);
                central.setUint32(42, offset, true);
                centralParts.push(new Uint8Array(central.buffer), nameBytes);
                offset += 30 + nameBytes.length + stored.length;
            }

            const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
            const end = new DataView(new ArrayBuffer(22));
            end.setUint32(0, 0x06054b50, true);
            end.setUint16(8, entries.length, true);
            end.setUint16(10, entries.length, true);
            end.setUint32(12, centralSize, true);
            end.setUint32(16, offset, true);

            const allParts = localParts.concat(centralParts, [new Uint8Array(end.buffer)]);
            const total = new Uint8Array(allParts.reduce((sum, part) => sum + part.length, 0));
            let position = 0;
            allParts.forEach(part => { total.set(part, position); position += part.length; });
            return total;
        }

        /**
         * 차트 문단 — word/charts/chartN.xml(chartSpace)을 등록하고 인라인 차트로 참조
         */
        function docxChartPara(figure, state) {
            const chart = parseChartFence(figure.dataset.chart || '');
            if (!chart) return '';
            const index = state.charts.length + 1;
            const relId = 'rId' + (state.relCounter++);
            state.charts.push({ name: 'word/charts/chart' + index + '.xml', xml: chartSpaceXml(chart) });
            state.rels.push('<Relationship Id="' + relId + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/chart" Target="charts/chart' + index + '.xml"/>');
            // HWPUNIT → EMU (1 HWPUNIT = 1/7200 inch, 1 inch = 914400 EMU)
            let cx = Math.round(chart.widthHu * 127);
            let cy = Math.round(chart.heightHu * 127);
            if (cx > DOCX_CONTENT_WIDTH_EMU) { cy = Math.round(cy * DOCX_CONTENT_WIDTH_EMU / cx); cx = DOCX_CONTENT_WIDTH_EMU; }
            const id = ++state.drawingId;
            return '<w:p>' + docxParaProps({ style: 'a0', jc: 'center' }) + '<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">'
                + '<wp:extent cx="' + cx + '" cy="' + cy + '"/><wp:effectExtent l="0" t="0" r="0" b="0"/>'
                + '<wp:docPr id="' + id + '" name="차트 ' + index + '"/><wp:cNvGraphicFramePr/>'
                + '<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/chart">'
                + '<c:chart xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" r:id="' + relId + '"/>'
                + '</a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>';
        }

        /**
         * 각주 파트(footnotes.xml) — 구분선 2종(-1·0) + 본문에서 참조한 각주
         */
        function docxFootnotesXml(root, state) {
            const ns = ' xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"'
                + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"'
                + ' xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math"';
            const separator = (id, type, el) => '<w:footnote w:type="' + type + '" w:id="' + id + '"><w:p><w:pPr>'
                + '<w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr><w:r><w:' + el + '/></w:r></w:p></w:footnote>';
            state.inFootnote = true;
            const notes = state.footnotes.map(n => {
                const li = root.querySelector('section.footnotes li[data-fn="' + n + '"]');
                let runs = '';
                if (li) li.childNodes.forEach(child => {
                    if (child.nodeType === Node.ELEMENT_NODE && child.classList.contains('footnote-back')) return;
                    runs += docxInlineToRuns(child, {}, state);
                });
                return '<w:footnote w:id="' + n + '"><w:p><w:pPr><w:pStyle w:val="FootnoteText"/></w:pPr>'
                    + '<w:r><w:rPr><w:rStyle w:val="FootnoteReference"/></w:rPr><w:footnoteRef/></w:r>'
                    + '<w:r><w:t xml:space="preserve"> </w:t></w:r>' + runs + '</w:p></w:footnote>';
            }).join('');
            state.inFootnote = false;
            return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:footnotes' + ns + '>'
                + separator(-1, 'separator', 'separator') + separator(0, 'continuationSeparator', 'continuationSeparator')
                + notes + '</w:footnotes>';
        }

        /**
         * 내보내기 직전 패키지 자체 검사 — 문제 목록(빈 배열이면 정상)
         * 공통: XML 형식(웰폼드)
         * 한글: mimetype 첫 항목·필수 파일, secCnt와 섹션 수, itemCnt와 실제 항목 수,
         *       content.hpf가 가리키는 파일 실재, 본문의 글자·문단·테두리·스타일·그림 id 참조 무결성
         * Word: 관계(rels) 대상 파일 실재, 본문의 r:id·r:embed 참조 무결성
         */
        function validatePackage(files, kind) {
            const issues = [];
            const byName = new Map(files.map(f => [f.name, f]));
            const decoder = new TextDecoder();
            const text = f => typeof f.data === 'string' ? f.data : decoder.decode(f.data);
            const parser = new DOMParser();
            const docs = new Map();
            files.forEach(f => {
                if (!/\.(xml|hpf|rdf|rels)$/.test(f.name)) return;
                const doc = parser.parseFromString(text(f), 'application/xml');
                const error = doc.getElementsByTagName('parsererror')[0];
                if (error) issues.push(f.name + ': XML 형식 오류 — ' + error.textContent.split('\n')[0]);
                else docs.set(f.name, doc);
            });
            const all = doc => Array.from(doc.getElementsByTagName('*'));
            const local = el => el.localName || el.nodeName.replace(/^.*:/, '');

            if (kind === 'hwpx') {
                if (!files.length || files[0].name !== 'mimetype' || text(files[0]) !== HWPX_MIME) {
                    issues.push('mimetype이 첫 항목이 아니거나 내용이 다름');
                }
                ['version.xml', 'META-INF/container.xml', 'Contents/content.hpf', 'Contents/header.xml', 'Contents/section0.xml']
                    .forEach(req => { if (!byName.has(req)) issues.push('필수 파일 누락: ' + req); });
                const sections = files.filter(f => /^Contents\/section\d+\.xml$/.test(f.name)).map(f => f.name);
                const header = docs.get('Contents/header.xml');
                const ids = { charPr: new Set(), paraPr: new Set(), borderFill: new Set(), style: new Set(), tabPr: new Set(), numbering: new Set() };
                if (header) {
                    const head = header.documentElement;
                    if (String(sections.length) !== head.getAttribute('secCnt')) {
                        issues.push('secCnt=' + head.getAttribute('secCnt') + '인데 섹션 파일은 ' + sections.length + '개');
                    }
                    all(header).forEach(el => {
                        const name = local(el);
                        if (ids[name] && el.hasAttribute('id')) {
                            if (ids[name].has(el.getAttribute('id'))) issues.push('header.xml: ' + name + ' id 중복 ' + el.getAttribute('id'));
                            ids[name].add(el.getAttribute('id'));
                        }
                        if (el.hasAttribute('itemCnt')) {
                            const count = Array.from(el.children).length;
                            if (String(count) !== el.getAttribute('itemCnt')) {
                                issues.push('header.xml: ' + name + ' itemCnt=' + el.getAttribute('itemCnt') + '인데 실제 ' + count + '개');
                            }
                        }
                    });
                    all(header).forEach(el => {
                        const name = local(el);
                        if (name === 'paraPr' && !ids.tabPr.has(el.getAttribute('tabPrIDRef'))) {
                            issues.push('header.xml: paraPr ' + el.getAttribute('id') + '의 tabPrIDRef가 없는 탭 정의를 가리킴');
                        }
                        if ((name === 'paraPr' || name === 'charPr' || name === 'border') && el.hasAttribute('borderFillIDRef')
                            && !ids.borderFill.has(el.getAttribute('borderFillIDRef'))) {
                            issues.push('header.xml: ' + name + '의 borderFillIDRef ' + el.getAttribute('borderFillIDRef') + ' 없음');
                        }
                    });
                }
                const binIds = new Set();
                const hpf = docs.get('Contents/content.hpf');
                if (hpf) {
                    all(hpf).filter(el => local(el) === 'item').forEach(el => {
                        const href = el.getAttribute('href');
                        binIds.add(el.getAttribute('id'));
                        if (!byName.has(href) && !byName.has('Contents/' + href)) issues.push('content.hpf가 없는 파일을 참조: ' + href);
                    });
                }
                const refs = [['charPrIDRef', 'charPr'], ['paraPrIDRef', 'paraPr'], ['borderFillIDRef', 'borderFill'], ['styleIDRef', 'style']];
                sections.forEach(name => {
                    const doc = docs.get(name);
                    if (!doc || !header) return;
                    const seen = new Set();
                    all(doc).forEach(el => {
                        refs.forEach(([attr, kindName]) => {
                            if (!el.hasAttribute(attr)) return;
                            const value = el.getAttribute(attr);
                            if (!ids[kindName].has(value) && !seen.has(attr + value)) {
                                seen.add(attr + value);
                                issues.push(name + ': ' + attr + '=' + value + ' 정의 없음');
                            }
                        });
                        if (el.hasAttribute('binaryItemIDRef') && !binIds.has(el.getAttribute('binaryItemIDRef'))) {
                            issues.push(name + ': 그림 ' + el.getAttribute('binaryItemIDRef') + ' 매니페스트에 없음');
                        }
                        if (local(el) === 'chart' && el.hasAttribute('chartIDRef') && !byName.has(el.getAttribute('chartIDRef'))) {
                            issues.push(name + ': 차트 ' + el.getAttribute('chartIDRef') + ' 파일 없음');
                        }
                    });
                });
            }

            if (kind === 'docx') {
                ['[Content_Types].xml', '_rels/.rels', 'word/document.xml'].forEach(req => {
                    if (!byName.has(req)) issues.push('필수 파일 누락: ' + req);
                });
                files.filter(f => /_rels\/[^/]*\.rels$/.test(f.name)).forEach(f => {
                    const doc = docs.get(f.name);
                    if (!doc) return;
                    const base = f.name.replace(/_rels\/[^/]*\.rels$/, '');
                    const partName = f.name.replace(/_rels\/([^/]*)\.rels$/, '$1');
                    const relIds = new Set();
                    all(doc).filter(el => local(el) === 'Relationship').forEach(rel => {
                        relIds.add(rel.getAttribute('Id'));
                        if (rel.getAttribute('TargetMode') === 'External') return;
                        const target = rel.getAttribute('Target');
                        const resolved = target.startsWith('/') ? target.slice(1) : base + target;
                        if (!byName.has(resolved)) issues.push(f.name + ': 대상 파일 없음 ' + target);
                    });
                    const part = docs.get(partName);
                    if (!part) return;
                    all(part).forEach(el => {
                        ['r:id', 'r:embed'].forEach(attr => {
                            const value = el.getAttribute(attr);
                            if (value && !relIds.has(value)) issues.push(partName + ': 관계 ' + value + ' 없음');
                        });
                    });
                });
            }
            return issues;
        }

        /**
         * 자체 검사를 통과한 패키지만 ZIP으로 묶는다
         */
        async function buildCheckedZip(files, kind) {
            const issues = validatePackage(files, kind);
            if (issues.length) {
                throw new Error('문서 패키지 자체 검사에서 문제가 발견되었습니다:\n- '
                    + issues.slice(0, 8).join('\n- ') + (issues.length > 8 ? '\n… 외 ' + (issues.length - 8) + '건' : ''));
            }
            return docxBuildZip(files);
        }

        /**
         * 미리보기 DOM 전체를 .docx 패키지 바이트로 변환
         */
        async function buildDocxFromPreview(root, docTitle) {
            const state = {
                rels: [],
                media: [],
                images: new Map(),
                orderedListStarts: [],
                relCounter: 100,
                drawingId: 0,
                bookmarkCounter: 0,
                afterHeading: false,
                footnotes: [],
                inFootnote: false,
                charts: []
            };
            await docxCollectImages(root, state);
            const bodyXml = docxBlocksToXml(root, state, {});
            const footnotesXml = state.footnotes.length ? docxFootnotesXml(root, state) : null;
            if (footnotesXml) {
                state.rels.push('<Relationship Id="rId' + (state.relCounter++) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footnotes" Target="footnotes.xml"/>');
            }

            const documentXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<w:document xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006"'
                + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"'
                + ' xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"'
                + ' xmlns:w14="http://schemas.microsoft.com/office/word/2010/wordml"'
                + ' xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"'
                + ' xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"'
                + ' xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"'
                + ' xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math"'
                + ' mc:Ignorable="w14"><w:body>'
                + (bodyXml || '<w:p/>')
                + DOCX_SECTPR_XML + '</w:body></w:document>';

            // 글머리 기호 목록은 numId 1 공유, 번호 목록은 목록마다 번호를 새로 시작
            let numberingXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<w:numbering xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:w14="http://schemas.microsoft.com/office/word/2010/wordml" mc:Ignorable="w14">'
                + DOCX_BULLET_ABSTRACT_XML + DOCX_DECIMAL_ABSTRACT_XML
                + '<w:num w:numId="1"><w:abstractNumId w:val="1"/></w:num>'
                + state.orderedListStarts.map((start, index) =>
                    '<w:num w:numId="' + (3 + index) + '"><w:abstractNumId w:val="2"/>'
                    + '<w:lvlOverride w:ilvl="0"><w:startOverride w:val="' + start + '"/></w:lvlOverride>'
                    + [1, 2, 3, 4, 5, 6, 7, 8].map(lvl => '<w:lvlOverride w:ilvl="' + lvl + '"><w:startOverride w:val="1"/></w:lvlOverride>').join('')
                    + '</w:num>'
                ).join('')
                + '</w:numbering>';

            const documentRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
                + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>'
                + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
                + '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/>'
                + '<Relationship Id="rId7" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>'
                + '<Relationship Id="rId8" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/fontTable" Target="fontTable.xml"/>'
                + '<Relationship Id="rId9" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="theme/theme1.xml"/>'
                + state.rels.join('')
                + '</Relationships>';

            const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
                + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
                + '<Default Extension="xml" ContentType="application/xml"/>'
                + '<Default Extension="png" ContentType="image/png"/>'
                + '<Default Extension="jpeg" ContentType="image/jpeg"/>'
                + '<Default Extension="gif" ContentType="image/gif"/>'
                + '<Default Extension="bmp" ContentType="image/bmp"/>'
                + '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
                + '<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/>'
                + '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>'
                + '<Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/>'
                + '<Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/>'
                + '<Override PartName="/word/fontTable.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.fontTable+xml"/>'
                + '<Override PartName="/word/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/>'
                + '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>'
                + '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>'
                + (footnotesXml ? '<Override PartName="/word/footnotes.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footnotes+xml"/>' : '')
                + state.charts.map(chart => '<Override PartName="/' + chart.name + '" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chart+xml"/>').join('')
                + '</Types>';

            const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
                + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'
                + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>'
                + '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>'
                + '</Relationships>';

            const timestamp = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
            const coreXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:dcmitype="http://purl.org/dc/dcmitype/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">'
                + '<dc:title>' + docxEscape(docTitle) + '</dc:title>'
                + '<dcterms:created xsi:type="dcterms:W3CDTF">' + timestamp + '</dcterms:created>'
                + '<dcterms:modified xsi:type="dcterms:W3CDTF">' + timestamp + '</dcterms:modified>'
                + '</cp:coreProperties>';

            const appXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes">'
                + '<Application>JJANG MD Editor</Application>'
                + '</Properties>';

            const files = [
                { name: '[Content_Types].xml', data: contentTypes },
                { name: '_rels/.rels', data: rootRels },
                { name: 'word/document.xml', data: documentXml },
                { name: 'word/_rels/document.xml.rels', data: documentRels },
                { name: 'word/styles.xml', data: DOCX_STYLES_XML },
                { name: 'word/numbering.xml', data: numberingXml },
                { name: 'word/settings.xml', data: DOCX_SETTINGS_XML },
                { name: 'word/footer1.xml', data: DOCX_FOOTER_XML },
                { name: 'word/fontTable.xml', data: DOCX_FONT_TABLE_XML },
                { name: 'word/theme/theme1.xml', data: DOCX_THEME_XML },
                { name: 'docProps/core.xml', data: coreXml },
                { name: 'docProps/app.xml', data: appXml }
            ].concat(footnotesXml ? [{ name: 'word/footnotes.xml', data: footnotesXml }] : [],
                state.charts.map(chart => ({ name: chart.name, data: chart.xml })), state.media);

            return buildCheckedZip(files, 'docx');
        }

        /**
         * Word(.docx)로 내보내기
         * 견본 문서와 동일한 서식의 .docx 파일 생성
         */
        async function exportToWord() {
            try {
                // 로딩 상태 표시
                exportWordBtn.classList.add('loading');
                exportWordBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span class="ml-2">생성 중...</span>';

                const wordFilename = (currentFilename || 'markdown-document.md').replace(/\.(md|markdown|txt)$/i, '') + '.docx';
                const docTitle = wordFilename.replace(/\.docx$/i, '');
                const docxBytes = await buildDocxFromPreview(preview, docTitle);
                const blob = new Blob([docxBytes], { type: DOCX_MIME });

                // File System Access API 지원 시 저장 경로 선택 대화상자 표시
                if (window.showSaveFilePicker) {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: wordFilename,
                        types: [{
                            description: 'Word 문서 (.docx)',
                            accept: { [DOCX_MIME]: ['.docx'] }
                        }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                } else {
                    // 폴백: 자동 다운로드
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = wordFilename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                }

                console.log('✅ Word 내보내기 완료');

            } catch (error) {
                if (error.name === 'AbortError') return; // 사용자 취소
                console.error('❌ Word 내보내기 오류:', error);
                alert('Word 문서 생성 중 오류가 발생했습니다:\n' + error.message);
            } finally {
                // 로딩 상태 해제
                exportWordBtn.classList.remove('loading');
                exportWordBtn.innerHTML = '<i class="fas fa-file-word"></i><span class="ml-2">Word</span>';
            }
        }

        /* ==========================================================
         * 한글(.hwpx) 내보내기 — 발간물(책자) 서식

         * 외부 라이브러리 없이 브라우저에서 직접 생성한다.
         * ========================================================== */

        // 발간물 서식 팔레트
        const HWPX_COLORS = {

            white: '#FFFFFF'

        // 글자 크기 (HWPUNIT, 1pt = 100)

            body: 1100, chapter: 2200, chip: 1600, section: 1400, badge: 1300,
            h3: 1250, h4: 1150, caption: 1050, source: 950,

        };

        // A4 편집용지 (HWPUNIT = 1/7200 inch): 좌우 20mm·위 20mm·아래 15mm 여백
        const HWPX_PAGE = { width: 59528, height: 84186, left: 5669, right: 5669, top: 5669, bottom: 4252, header: 4252, footer: 3402 };
        const HWPX_CONTENT_WIDTH = HWPX_PAGE.width - HWPX_PAGE.left - HWPX_PAGE.right; // 48190
        const HWPX_MIME = 'application/hwp+zip';
        // id 2 = 서술식(맑은 고딕), id 3·4 = 개조식(휴먼명조 본문, HY헤드라인M 제목)
        const HWPX_FONTS = ['함초롬돋움', '함초롬바탕', '맑은 고딕', '휴먼명조', 'HY헤드라인M'];

        // 개조식(정부 보고서) 서식 상수 — ㅁ / ㅇ / - 3단 계층 + ※·* 보충 규격
        const HWPX_GOV = {
            // title: ㅁ 제목 남색, label: ㅇ 줄머리 (라벨) 청색, emph: ⇨·***강조*** 청색, note: ※·* 보충 회색
            colors: { title: '#1F3864', label: '#2B65B8', emph: '#1F4E79', note: '#404040', thead: '#D6E0F0' },
            // body 15pt 본문, h0 16pt ㅁ 제목, numBox 13pt 번호 박스, paren 13pt 괄호 부연, note 12pt ※·* 보충
            sz: { body: 1500, h0: 1600, numBox: 1300, paren: 1300, title: 1600, subtitle: 1200, note: 1200, table: 1300, attach: 1800, footer: 1000 },
            fonts: { gothic: 2, body: 3, head: 4 },
            step: 700, wFull: 1100, wHalf: 600, wNum: 800,
            // 문단 앞 여백(HWPUNIT, 100 = 1 pt) — 원문 빈 문단 글꼴 ㅁ 5 pt·ㅇ 6 pt·보충 2 pt와 같은 간격
            prevL0: 500, nextL0: 150, prevL1: 600, prevLx: 0, prevNote: 200,
            // 걸어쓰기 마커 -> [수준, 내어쓰기 폭] (기본은 ㅁ U+3141·ㅇ U+3147, □·○ 등은 입력 허용 이형)
            markers: {
                'ㅁ': [0, 1100], '□': [0, 1100], '■': [0, 1100],
                'ㅇ': [1, 1100], '○': [1, 1100], '◯': [1, 1100], '❍': [1, 1100],
                '-': [2, 600], '▸': [2, 1100], '‣': [2, 1100], '▹': [2, 1100],
                '·': [3, 600], '•': [3, 1100], '◦': [3, 1100], '▪': [3, 1100]
            },
            // 수준별 자동 마커 [마커, 내어쓰기 폭] — 목록에 마커가 없을 때 ㅁ / ㅇ / - / · 순으로 부여
            autoMarkers: [['ㅁ', 1100], ['ㅇ', 1100], ['-', 600], ['·', 600]],
            markerRe: /^([ㅁ□■ㅇ○◯❍▸‣▹·•◦▪])\s+/,
            markerStripRe: /^\s*[ㅁ□■ㅇ○◯❍▸‣▹·•◦▪]\s*/,
            // 코드블럭에 그대로 붙여 넣은 개조식 평문 줄(들여쓰기 + 마커)
            lineRe: /^[ \t]*(ㅁ|□|■|ㅇ|○|◯|❍|▸|‣|▹|-|·|•|◦|▪|※|\*\*|\*|⇨|⇒|➡|▶|►|→)[ \t]+/,
            // 여백 지정 줄 — (5)·(6)·(2)는 그 pt 크기의 빈 문단이 되고 글자는 남지 않음
            spacerRe: /^\((\d{1,2})\)$/,
            // 줄머리 (라벨) — ㅇ 줄은 청색 굵게, - 줄은 검정 굵게
            labelRe: /^\(([^()]{1,24})\)[ \t]*/,
            // 본문 안 괄호 부연 (부산 기장군)·(SPC)·(100MWe) — 작은 글자
            parenRe: /\([^()]+\)/g,
            // 범위 물결 '~' -> '∼'(U+223C). 앞이 공백인 「약」 용법(~100 MWe)은 그대로 둔다
            rangeTildeRe: /([0-9’')])[ \t]*~[ \t]*(?=[0-9’'])/g,
            rangeTildeOpenRe: /\([ \t]*~[ \t]*(?=[0-9’'])/g,
            rangeTildeEndRe: /([0-9’'])[ \t]*~(?=[)\s,]|$)/g,
            arrowRe: /^([⇨⇒➡▶►→])\s+/,
            attachRe: /^(붙임|참고|별첨|별지)\s*(\d*)\s+(.+)$/,
            attachBracketRe: /^\[(붙임|참고|별첨|별지)\s*(\d*)\]\s+(.+)$/
        };
        const HWPX_NS = 'xmlns:ha="http://www.hancom.co.kr/hwpml/2011/app"'
            + ' xmlns:hp="http://www.hancom.co.kr/hwpml/2011/paragraph"'
            + ' xmlns:hp10="http://www.hancom.co.kr/hwpml/2016/paragraph"'
            + ' xmlns:hs="http://www.hancom.co.kr/hwpml/2011/section"'
            + ' xmlns:hc="http://www.hancom.co.kr/hwpml/2011/core"'
            + ' xmlns:hh="http://www.hancom.co.kr/hwpml/2011/head"'
            + ' xmlns:hhs="http://www.hancom.co.kr/hwpml/2011/history"'
            + ' xmlns:hm="http://www.hancom.co.kr/hwpml/2011/master-page"'
            + ' xmlns:hpf="http://www.hancom.co.kr/schema/2011/hpf"'
            + ' xmlns:dc="http://purl.org/dc/elements/1.1/"'
            + ' xmlns:opf="http://www.idpf.org/2007/opf/"'
            + ' xmlns:ooxmlchart="http://www.hancom.co.kr/hwpml/2016/ooxmlchart"'
            + ' xmlns:hwpunitchar="http://www.hancom.co.kr/hwpml/2016/HwpUnitChar"'
            + ' xmlns:epub="http://www.idpf.org/2007/ops"'
            + ' xmlns:config="urn:oasis:names:tc:opendocument:xmlns:config:1.0"';
        const hwpxEscape = docxEscape;

        /**
         * 7개 언어축 공통 속성 문자열 생성 (fontRef/ratio/spacing/relSz/offset용)
         */
        function hwpxAxes(value) {
            return ['hangul', 'latin', 'hanja', 'japanese', 'other', 'symbol', 'user']
                .map(axis => axis + '="' + value + '"').join(' ');
        }

        /**
         * 문단 모양(paraPr) XML 생성 — 한/글 기본 템플릿과 동일한 구조
         * (legacyDouble: 한/글 호환용 기본 문단들은 구형 분기 여백이 2배)
         */
        function hwpxParaPrXml(id, o) {
            const margin = mult => '<hh:margin>'
                + '<hc:intent value="' + (o.intent || 0) * mult + '" unit="HWPUNIT"/>'
                + '<hc:left value="' + (o.left || 0) * mult + '" unit="HWPUNIT"/>'
                + '<hc:right value="0" unit="HWPUNIT"/>'
                + '<hc:prev value="' + (o.prev || 0) * mult + '" unit="HWPUNIT"/>'
                + '<hc:next value="' + (o.next || 0) * mult + '" unit="HWPUNIT"/>'
                + '</hh:margin><hh:lineSpacing type="PERCENT" value="' + (o.ls || 160) + '" unit="HWPUNIT"/>';
            const heading = o.headingSwitch != null
                ? '<hp:switch><hp:case hp:required-namespace="http://www.hancom.co.kr/hwpml/2011/paragraph">'
                    + '<hh:heading type="OUTLINE" idRef="0" level="' + o.headingSwitch + '"/></hp:case>'
                    + '<hp:default><hh:heading type="NONE" idRef="0" level="0"/></hp:default></hp:switch>'
                : '<hh:heading type="' + (o.headingLevel != null ? 'OUTLINE' : 'NONE') + '" idRef="0" level="' + (o.headingLevel || 0) + '"/>';
            const off = o.borderOff || [0, 0, 0, 0];
            return '<hh:paraPr id="' + id + '" tabPrIDRef="' + (o.tab || 0) + '" condense="' + (o.condense || 0) + '"'
                + ' fontLineHeight="0" snapToGrid="1" suppressLineNumbers="0" checked="0" textDir="LTR">'
                + '<hh:align horizontal="' + (o.align || 'JUSTIFY') + '" vertical="BASELINE"/>'
                + heading
                + '<hh:breakSetting breakLatinWord="KEEP_WORD" breakNonLatinWord="' + (o.breakNL || 'BREAK_WORD') + '"'
                + ' widowOrphan="0" keepWithNext="' + (o.keepWithNext ? 1 : 0) + '" keepLines="0"'
                + ' pageBreakBefore="' + (o.pageBreakBefore ? 1 : 0) + '" lineWrap="BREAK"/>'
                + '<hh:autoSpacing eAsianEng="0" eAsianNum="0"/>'
                + '<hp:switch><hp:case hp:required-namespace="http://www.hancom.co.kr/hwpml/2016/HwpUnitChar">'
                + margin(1) + '</hp:case><hp:default>' + margin(o.legacyDouble ? 2 : 1) + '</hp:default></hp:switch>'
                + '<hh:border borderFillIDRef="' + (o.borderBf || 2) + '" offsetLeft="' + off[0] + '" offsetRight="' + off[1] + '"'
                + ' offsetTop="' + off[2] + '" offsetBottom="' + off[3] + '" connect="' + (o.connect ? 1 : 0) + '" ignoreMargin="0"/>'
                + '</hh:paraPr>';
        }

        /**
         * 글자 모양(charPr) XML 생성
         */
        function hwpxCharPrXml(id, o) {
            const underline = o.underline
                ? '<hh:underline type="BOTTOM" shape="SOLID" color="' + (o.color || '#000000') + '"/>'
                : '<hh:underline type="NONE" shape="SOLID" color="#000000"/>';
            return '<hh:charPr id="' + id + '" height="' + o.size + '" textColor="' + (o.color || '#000000') + '"'
                + ' shadeColor="none" useFontSpace="0" useKerning="0" symMark="NONE" borderFillIDRef="' + (o.shadeBf || 2) + '">'
                + '<hh:fontRef ' + hwpxAxes(o.font != null ? o.font : 2) + '/>'
                + '<hh:ratio ' + hwpxAxes(100) + '/>'
                + '<hh:spacing ' + hwpxAxes(o.spacing || 0) + '/>'
                + '<hh:relSz ' + hwpxAxes(o.relSz || 100) + '/>'
                + '<hh:offset ' + hwpxAxes(o.offset || 0) + '/>'
                + (o.bold ? '<hh:bold/>' : '')
                + (o.italic ? '<hh:italic/>' : '')
                + underline
                + '<hh:strikeout shape="' + (o.strike ? 'SOLID' : 'NONE') + '" color="#000000"/>'
                + '<hh:outline type="NONE"/>'
                + '<hh:shadow type="NONE" color="#C0C0C0" offsetX="10" offsetY="10"/>'
                + '</hh:charPr>';
        }

        /**
         * 테두리/배경(borderFill) XML 생성 — 변: null(없음) 또는 {width, color}
         */
        function hwpxBorderFillXml(id, o) {
            const side = (tag, s) => '<hh:' + tag + ' type="' + (s ? 'SOLID' : 'NONE') + '"'
                + ' width="' + (s ? s.width : '0.1 mm') + '" color="' + (s ? s.color : '#000000') + '"/>';
            return '<hh:borderFill id="' + id + '" threeD="0" shadow="0" centerLine="NONE" breakCellSeparateLine="0">'
                + '<hh:slash type="NONE" Crooked="0" isCounter="0"/>'
                + '<hh:backSlash type="NONE" Crooked="0" isCounter="0"/>'
                + side('leftBorder', o.left) + side('rightBorder', o.right)
                + side('topBorder', o.top) + side('bottomBorder', o.bottom)
                + '<hh:diagonal type="NONE" width="0.1 mm" color="#000000"/>'
                + (o.fill ? '<hc:fillBrush><hc:winBrush faceColor="' + o.fill + '" hatchColor="#000000" alpha="0"/></hc:fillBrush>' : '')
                + '</hh:borderFill>';
        }

        /**
         * 스타일 레지스트리 — 필요한 paraPr/charPr/borderFill을 캐시하며 등록
         * (id 0~19 문단·0~6 글자·1~2 테두리는 한/글 기본 템플릿 몫으로 예약)
         */
        function hwpxCreateStyles() {
            const custom = { paraPr: [], charPr: [], borderFill: [] };
            const cache = { paraPr: new Map(), charPr: new Map(), borderFill: new Map() };
            const register = (kind, base, builder, opts) => {
                const key = JSON.stringify(opts);
                if (cache[kind].has(key)) return cache[kind].get(key);
                const id = base + custom[kind].length;
                custom[kind].push(builder(id, opts));
                cache[kind].set(key, id);
                return id;
            };
            const styles = {
                custom,
                paraPr: opts => register('paraPr', 20, hwpxParaPrXml, opts),
                charPr: opts => register('charPr', 7, hwpxCharPrXml, opts),
                borderFill: opts => register('borderFill', 3, hwpxBorderFillXml, opts)
            };
            const hairline = { width: '0.12 mm', color: HWPX_COLORS.line };
            styles.bfNone = styles.borderFill({});
            styles.bfCover = styles.borderFill({ fill: HWPX_COLORS.cream });
            styles.bfAccent = styles.borderFill({ fill: HWPX_COLORS.accent });
            styles.bfBadge = styles.borderFill({ fill: HWPX_COLORS.accent, bottom: hairline });
            styles.bfRule = styles.borderFill({ bottom: hairline });
            styles.bfTableHead = styles.borderFill({
                fill: HWPX_COLORS.accent,
                left: { width: '0.1 mm', color: HWPX_COLORS.accent },
                right: { width: '0.1 mm', color: HWPX_COLORS.accent },
                top: { width: '0.1 mm', color: HWPX_COLORS.accent },
                bottom: { width: '0.1 mm', color: HWPX_COLORS.accent }
            });
            styles.bfTableBody = styles.borderFill({ top: hairline, bottom: hairline });
            styles.bfCode = styles.borderFill({ fill: HWPX_COLORS.codeBg });
            styles.bfQuote = styles.borderFill({ left: { width: '0.4 mm', color: HWPX_COLORS.accent } });
            // 개조식(정부 보고서) 테두리: 검정 격자 표, 제목 상하 괘선, 붙임 배너
            const govLine = { width: '0.12 mm', color: '#000000' };
            const govGrid = { left: govLine, right: govLine, top: govLine, bottom: govLine };
            styles.bfGovCell = styles.borderFill(Object.assign({}, govGrid));
            styles.bfGovHead = styles.borderFill(Object.assign({ fill: HWPX_GOV.colors.thead }, govGrid));
            styles.bfGovTitleRule = styles.borderFill({
                top: { width: '0.5 mm', color: HWPX_GOV.colors.title },
                bottom: { width: '0.5 mm', color: HWPX_GOV.colors.title }
            });
            styles.bfGovAttachLabel = styles.borderFill(Object.assign({ fill: HWPX_GOV.colors.title }, govGrid));
            styles.bfGovAttachTitle = styles.borderFill({ bottom: { width: '0.4 mm', color: HWPX_GOV.colors.title } });
            // ㅁ 제목 번호 박스(글자 테두리)
            styles.bfGovNumBox = styles.borderFill(Object.assign({}, govGrid));
            return styles;
        }

        /**
         * 서식 상태(fmt)를 charPr id로 변환
         * (fmt.gov: 개조식 — 링크는 평문, ***굵은기울임***은 청색 강조, 기본색 검정)
         */
        function hwpxCharIdFor(styles, fmt) {
            let color = fmt.color;
            let bold = !!fmt.bold;
            let italic = !!(fmt.italic || fmt.math);
            let underline = !!fmt.underline;
            if (fmt.gov) {
                if (bold && fmt.italic && !fmt.math) { color = color || HWPX_GOV.colors.emph; italic = false; }
                if (!color) color = '#000000';
            } else {
                if (!color) color = fmt.link ? HWPX_COLORS.accent : HWPX_COLORS.body;
                if (fmt.link) underline = true;
            }
            const opts = {
                size: fmt.size || (fmt.code ? HWPX_SZ.code : HWPX_SZ.body),
                color, bold, italic, underline,
                strike: !!fmt.strike
            };
            if (fmt.font != null) opts.font = fmt.font;
            if (fmt.sup) { opts.offset = 30; opts.relSz = 65; }
            else if (fmt.sub) { opts.offset = -25; opts.relSz = 65; }
            if (fmt.shadeBf) opts.shadeBf = fmt.shadeBf;
            return styles.charPr(opts);
        }

        // 탭 요소 — 한/글 저장본처럼 <hp:t> 안에 둔다 (폭은 한/글이 조판 때 다시 계산)
        const HWPX_TAB = '<hp:tab width="4000" leader="0" type="1"/>';

        /**
         * <hp:t> 본문 이스케이프 — 탭은 <hp:tab/>, 묶음 빈칸(U+00A0)은 <hp:nbSpace/>
         */
        function hwpxTextXml(text) {
            return String(text).split('\t')
                .map(seg => hwpxEscape(seg).replace(/\u00A0/g, '<hp:nbSpace/>'))
                .join(HWPX_TAB);
        }

        /**
         * 텍스트 런 생성
         */
        function hwpxTextRun(text, charPrId) {
            if (text === '') return '';
            return '<hp:run charPrIDRef="' + charPrId + '"><hp:t>' + hwpxTextXml(text) + '</hp:t></hp:run>';
        }

        /**
         * 문단 생성
         */
        function hwpxParagraph(state, ppId, runsXml) {
            return '<hp:p id="' + (++state.paraId) + '" paraPrIDRef="' + ppId + '" styleIDRef="0"'
                + ' pageBreak="0" columnBreak="0" merged="0">'
                + (runsXml || '<hp:run charPrIDRef="1"><hp:t/></hp:run>')
                + '</hp:p>';
        }

        /* ----------------------------------------------------------
         * LaTeX → 한/글 수식 편집기(EqEdit) 스크립트
         * (kordoc equation-generate.ts의 변환 규칙을 이식 — MIT, © chrisryugj)
         * ---------------------------------------------------------- */
        const HWPX_EQ_COMMANDS = {
            alpha: 'alpha', beta: 'beta', gamma: 'gamma', delta: 'delta', epsilon: 'epsilon', varepsilon: 'epsilon',
            zeta: 'zeta', eta: 'eta', theta: 'theta', vartheta: 'theta', iota: 'iota', kappa: 'kappa', lambda: 'lambda',
            mu: 'mu', nu: 'nu', xi: 'xi', omicron: 'omicron', pi: 'pi', varpi: 'pi', rho: 'rho', varrho: 'rho',
            sigma: 'sigma', varsigma: 'sigma', tau: 'tau', upsilon: 'upsilon', phi: 'phi', varphi: 'phi',
            chi: 'chi', psi: 'psi', omega: 'omega',
            Gamma: 'GAMMA', Delta: 'DELTA', Theta: 'THETA', Lambda: 'LAMBDA', Xi: 'XI', Pi: 'PI', Sigma: 'SIGMA',
            Upsilon: 'UPSILON', Phi: 'PHI', Psi: 'PSI', Omega: 'OMEGA',
            le: 'LEQ', leq: 'LEQ', ge: 'GEQ', geq: 'GEQ', ne: '!=', neq: '!=', ll: '<<', gg: '>>',
            pm: '+-', mp: '-+', times: 'TIMES', div: '÷', cdot: 'cdot', ast: 'AST', star: 'STAR',
            circ: 'CIRC', bullet: 'BULLET', oplus: 'OPLUS', ominus: 'OMINUS', otimes: 'OTIMES', odot: 'ODOT',
            in: 'IN', ni: 'OWNS', owns: 'OWNS', notin: 'NOTIN', subset: 'SUBSET', subseteq: 'SUBSETEQ',
            supset: 'SUPERSET', supseteq: 'SUPSETEQ', cup: 'CUP', cap: 'SMALLINTER', emptyset: 'EMPTYSET',
            varnothing: 'EMPTYSET', forall: 'FORALL', exists: 'EXIST', land: 'LAND', wedge: 'LAND', lor: 'LOR', vee: 'LOR',
            infty: 'INF', infinity: 'INF', partial: 'Partial', nabla: 'NABLA', prime: 'prime',
            int: 'int', iint: 'dint', iiint: 'tint', oint: 'oint', sum: 'sum', prod: 'prod', coprod: 'coprod',
            bigcup: 'union', bigcap: 'inter', lim: 'lim',
            to: '->', rightarrow: '->', leftarrow: 'larrow', gets: 'larrow', leftrightarrow: '<->',
            Rightarrow: 'RARROW', Leftarrow: 'LARROW', Leftrightarrow: 'LRARROW', implies: 'RARROW', iff: 'LRARROW',
            uparrow: 'uparrow', downarrow: 'downarrow', Uparrow: 'UPARROW', Downarrow: 'DOWNARROW', mapsto: 'MAPSTO',
            cdots: 'CDOTS', ldots: 'LDOTS', dots: 'LDOTS', vdots: 'VDOTS', ddots: 'DDOTS',
            sim: 'SIM', approx: 'APPROX', simeq: 'SIMEQ', cong: 'CONG', equiv: '==', propto: 'PROPTO',
            therefore: 'THEREFORE', because: 'BECAUSE', angle: 'ANGLE', triangle: 'TRIANGLE', perp: 'BOT', bot: 'BOT',
            top: 'TOP', dagger: 'DAGGER', ddagger: 'DDAGGER', vdash: 'VDASH', models: 'MODELS', diamond: 'DIAMOND',
            prec: 'PREC', succ: 'SUCC', lceil: '⌈', rceil: '⌉', lfloor: '⌊', rfloor: '⌋',
            degree: 'DEG', quad: '~~', qquad: '~~~~'
        };
        const HWPX_EQ_ACCENTS = {
            bar: 'bar', overline: 'bar', vec: 'vec', overrightarrow: 'vec', hat: 'hat', widehat: 'hat',
            tilde: 'tilde', widetilde: 'tilde', dot: 'dot', ddot: 'ddot', underline: 'under'
        };
        const HWPX_EQ_FUNCTIONS = new Set(['sin', 'cos', 'tan', 'cot', 'sec', 'csc', 'arcsin', 'arccos', 'arctan',
            'sinh', 'cosh', 'tanh', 'coth', 'log', 'ln', 'lg', 'exp', 'det', 'gcd', 'mod', 'max', 'min', 'arg', 'deg',
            'hom', 'ker', 'Pr', 'sup', 'inf', 'dim']);
        const HWPX_EQ_ENVS = {
            matrix: 'matrix', pmatrix: 'pmatrix', bmatrix: 'bmatrix', vmatrix: 'dmatrix', cases: 'cases',
            align: 'eqalign', 'align*': 'eqalign', aligned: 'eqalign', gathered: 'eqalign', split: 'eqalign'
        };
        // 수식 편집기가 명령으로 읽는 어휘 — 첨자 안 리터럴 낱말이 겹치면 따옴표로 보호
        const HWPX_EQ_RESERVED = new Set(Object.values(HWPX_EQ_COMMANDS)
            .concat(['over', 'root', 'of', 'sqrt', 'matrix', 'cases', 'left', 'right', 'LEFT', 'RIGHT', 'rm', 'it', 'bold'])
            .filter(w => /^[A-Za-z]+$/.test(w)));

        function hwpxLatexToEqEdit(input) {
            let src = String(input).trim();
            if (src.length > 10000) return src.replace(/\s+/g, ' ');
            const MAX_DEPTH = 64;
            const norm = text => text.replace(/\s+/g, ' ').trim();
            const skip = i => { while (i < src.length && /\s/.test(src[i])) i++; return i; };
            const balanced = (i, open, close) => {
                let depth = 1, k = i + 1;
                while (k < src.length) {
                    const ch = src[k];
                    if (ch === '\\') { k += 2; continue; }
                    if (ch === open) depth++;
                    else if (ch === close) depth--;
                    if (depth === 0) return { value: src.slice(i + 1, k), next: k + 1 };
                    k++;
                }
                return { value: src.slice(i + 1), next: src.length };
            };
            const cmdName = i => {
                if (src[i + 1] === '\\') return { value: '\\', next: i + 2 };
                const m = /^[A-Za-z]+\*?/.exec(src.slice(i + 1));
                if (m) return { value: m[0], next: i + 1 + m[0].length };
                return { value: src[i + 1] || '', next: Math.min(i + 2, src.length) };
            };
            // 부분 문자열 변환: 원 문자열(src) 안의 [from, to) 구간을 변환
            function convertRange(from, to, depth) {
                if (depth > MAX_DEPTH) return norm(src.slice(from, to));
                let out = '';
                let i = from;
                while (i < to) {
                    const ch = src[i];
                    if (ch === '\\') { const c = command(i, depth + 1); out += ' ' + c.value + ' '; i = c.next; continue; }
                    if (ch === '{') {
                        const g = balanced(i, '{', '}');
                        out += '{' + convertRange(i + 1, g.next - 1, depth + 1) + '}';
                        i = g.next; continue;
                    }
                    if (ch === '_' || ch === '^') {
                        const t = groupOrToken(i + 1, depth, true);
                        out += ' ' + ch + '{' + t.value + '}';
                        i = t.next; continue;
                    }
                    if (ch === '&') { out += ' & '; i++; continue; }
                    out += ch;
                    i++;
                }
                return norm(out);
            }
            function groupOrToken(i, depth, script) {
                const start = skip(i);
                if (depth > MAX_DEPTH) return { value: src.slice(start), next: src.length };
                if (src[start] === '{') {
                    const g = balanced(start, '{', '}');
                    let value = convertRange(start + 1, g.next - 1, depth + 1);
                    if (script && /^[A-Za-z]+$/.test(g.value.trim()) && HWPX_EQ_RESERVED.has(g.value.trim())) value = '"' + g.value.trim() + '"';
                    return { value, next: g.next };
                }
                if (src[start] === '\\') return command(start, depth + 1);
                return { value: src[start] || '', next: Math.min(start + 1, src.length) };
            }
            function command(i, depth) {
                const name = cmdName(i);
                const c = name.value;
                if (c === '\\') return { value: '#', next: name.next };
                if (c === 'frac' || c === 'dfrac' || c === 'tfrac') {
                    const num = groupOrToken(name.next, depth);
                    const den = groupOrToken(num.next, depth);
                    return { value: '{' + num.value + '} over {' + den.value + '}', next: den.next };
                }
                if (c === 'binom') {
                    const n = groupOrToken(name.next, depth);
                    const k = groupOrToken(n.next, depth);
                    return { value: 'LEFT ( {' + n.value + '} atop {' + k.value + '} RIGHT )', next: k.next };
                }
                if (c === 'sqrt') {
                    let k = skip(name.next);
                    let root = null;
                    if (src[k] === '[') {
                        const opt = balanced(k, '[', ']');
                        root = convertRange(k + 1, opt.next - 1, depth + 1);
                        k = opt.next;
                    }
