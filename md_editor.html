<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJANG's MD Editor</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Marked.js for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>

    <!-- DOMPurify for sanitizing rendered Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"
            integrity="sha384-JEyTNhjM6R1ElGoJns4U2Ln4ofPcqzSsynQkmEc/KGy6336qAZl70tDLufbkla+3"
            crossorigin="anonymous"></script>

    <!-- html2pdf.js for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"
            integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
          integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV"
          crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
            integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8"
            crossorigin="anonymous"></script>

    <style>
        /* 전체 레이아웃을 위한 기본 스타일 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        /* 표기·문체 검사 목록 */
        .lint-list {
            max-height: 28vh;
            overflow-y: auto;
            margin-top: 6px;
            font-size: 13px;
        }
        .lint-list li {
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            line-height: 1.5;
        }
        .lint-list li:hover { background: #fde68a; }
        .lint-list .lint-line { color: #6b7280; font-family: monospace; margin-right: 6px; }
        .lint-list .lint-error { color: #b91c1c; font-weight: 600; margin-right: 6px; }
        .lint-list .lint-warning { color: #b45309; font-weight: 600; margin-right: 6px; }
        .lint-list .lint-suggest { color: #047857; margin-left: 6px; }

        /* 에디터 textarea 스타일 */
        #editor {
            resize: none;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            overflow-y: auto;
        }

        #editor:focus {
            outline: none;
        }

        /* 프리뷰 영역 스크롤 */
        #preview {
            overflow-y: auto;
        }

        /* Tailwind Typography 플러그인 스타일을 CDN으로 불러오기 위한 대체 */
        .prose {
            max-width: 100%;
            color: #374151;
        }

        .prose h1 {
            font-size: 2.25em;
            margin-top: 0;
            margin-bottom: 0.8888889em;
            line-height: 1.1111111;
            font-weight: 800;
        }

        .prose h2 {
            font-size: 1.5em;
            margin-top: 2em;
            margin-bottom: 1em;
            line-height: 1.3333333;
            font-weight: 700;
        }

        .prose h3 {
            font-size: 1.25em;
            margin-top: 1.6em;
            margin-bottom: 0.6em;
            line-height: 1.6;
            font-weight: 600;
        }

        .prose p {
            margin-top: 1.25em;
            margin-bottom: 1.25em;
        }

        .prose ul, .prose ol {
            margin-top: 1.25em;
            margin-bottom: 1.25em;
            padding-left: 1.625em;
        }

        /* 불릿 리스트 스타일: 1단계 □, 2단계 ○, 3단계 ● */
        .prose ul {
            list-style-type: square;
        }

        .prose ul > li {
            display: list-item;
            margin-top: 0.5em;
            margin-bottom: 0.5em;
        }

        .prose ul ul {
            list-style-type: circle;
            margin-top: 0.5em;
            margin-bottom: 0.5em;
        }

        .prose ul ul ul {
            list-style-type: disc;
        }

        /* 순서 리스트: 계층적 번호 (1, 1.1, 1.1.1) */
        .prose ol {
            counter-reset: item;
            list-style-type: none;
            padding-left: 0;
        }

        .prose ol > li {
            counter-increment: item;
            margin-top: 0.5em;
            margin-bottom: 0.5em;
            padding-left: 2.5em;
            position: relative;
        }

        .prose ol > li::before {
            content: counters(item, ".") ". ";
            position: absolute;
            left: 0;
            width: 2.5em;
            text-align: left;
            font-weight: 500;
        }

        .prose ol ol {
            margin-top: 0.5em;
            margin-bottom: 0.5em;
            padding-left: 0;
        }

        .prose code {
            background-color: #f3f4f6;
            padding: 0.2em 0.4em;
            border-radius: 0.25rem;
            font-size: 0.875em;
            font-family: 'Courier New', monospace;
        }

        .prose pre {
            background-color: #1f2937;
            color: #f9fafb;
            overflow-x: auto;
            padding: 1em;
            border-radius: 0.375rem;
            margin-top: 1.7142857em;
            margin-bottom: 1.7142857em;
        }

        .prose pre code {
            background-color: transparent;
            padding: 0;
            color: inherit;
            font-size: inherit;
        }

        .prose blockquote {
            font-weight: 500;
            font-style: italic;
            color: #111827;
            border-left-width: 0.25rem;
            border-left-color: #e5e7eb;
            quotes: "\201C""\201D""\2018""\2019";
            margin-top: 1.6em;
            margin-bottom: 1.6em;
            padding-left: 1em;
        }

        .prose strong {
            font-weight: 600;
        }

        .prose em {
            font-style: italic;
        }

        .prose del,
        .prose s {
            text-decoration: line-through;
        }

        /* 버튼 호버 효과 */
        .btn-toolbar:hover {
            background-color: #e5e7eb;
        }

        .btn-toolbar:active {
            background-color: #d1d5db;
        }

        /* 로딩 인디케이터 */
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        /* 리사이저 스타일 */
        .resizer,
        .toc-resizer {
            width: 5px;
            background-color: #d1d5db;
            cursor: col-resize;
            position: relative;
            flex-shrink: 0;
            touch-action: none;
        }

        .resizer:hover,
        .toc-resizer:hover {
            background-color: #9ca3af;
        }

        .resizer:active,
        .toc-resizer:active {
            background-color: #6b7280;
        }

        .toc-resizer {
            display: none;
        }

        /* 비활성화된 버튼 스타일 */
        .btn-toolbar:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-toolbar:disabled:hover {
            background-color: transparent;
        }

        /* 드래그 앤 드롭 스타일 */
        .drag-over {
            background-color: #e0f2fe !important;
            border: 2px dashed #0284c7 !important;
        }

        /* 파일 입력 숨김 */
        #fileInput {
            display: none;
        }

        /* 파일명 표시 */
        .filename-display {
            font-size: 0.875rem;
            color: #d1d5db;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 각주 */
        .footnote-ref a { text-decoration: none; }
        section.footnotes {
            margin-top: 2em;
            padding-top: 0.5em;
            border-top: 1px solid #d1d5db;
            font-size: 0.875em;
            color: #4b5563;
        }
        section.footnotes ol { padding-left: 1.5em; list-style: decimal; }
        .footnote-back { margin-left: 0.3em; text-decoration: none; }

        /* 차트 */
        figure.md-chart {
            margin: 1em auto;
            text-align: center;
            page-break-inside: avoid;
            break-inside: avoid;
        }
        figure.md-chart svg { max-width: 100%; height: auto; }

        /* 수식 스타일 */
        .math-block {
            margin: 1em 0;
            overflow-x: auto;
            text-align: center;
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .math-inline {
            display: inline;
        }

        /* 테이블 스타일 (PDF 호환) */
        .prose table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
        }

        .prose th, .prose td {
            border: 1px solid #d1d5db;
            padding: 0.5em 1em;
            text-align: left;
        }

        .prose th {
            background-color: #f3f4f6;
            font-weight: 600;
        }

        /* 코드 블록 페이지 분할 방지 */
        .prose pre {
            page-break-inside: avoid;
            break-inside: avoid;
        }

        /* PDF 페이지 나누기 방지 - 텍스트 요소 */
        .prose p,
        .prose li,
        .prose h1,
        .prose h2,
        .prose h3,
        .prose h4,
        .prose h5,
        .prose h6,
        .prose blockquote,
        .prose table {
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .prose ul,
        .prose ol {
            page-break-inside: auto;
        }

        #editorPanel,
        #previewPanel {
            min-width: 0;
            min-height: 0;
        }

        @media (max-width: 767px) {
            .editor-workspace {
                flex-direction: column;
            }

            #editorPanel,
            #previewPanel {
                flex: 1 1 50% !important;
                width: 100%;
            }

            .resizer,
            .toc-resizer {
                width: 100%;
                height: 6px;
                cursor: row-resize;
            }

            #tocPanel {
                width: 100% !important;
                max-height: 50%;
                border-left: 0;
                border-top: 1px solid #d1d5db;
            }
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- 전체 컨테이너: 100vh 고정 레이아웃 -->
    <div class="h-screen flex flex-col">

        <!-- 헤더 -->
        <header class="bg-gray-800 text-white px-3 py-2 md:px-6 md:py-4 flex flex-wrap items-center gap-3 justify-between shadow-lg">
            <div class="flex items-center space-x-4">
                <i class="fas fa-markdown text-3xl"></i>
                <div>
                    <h1 class="text-lg md:text-2xl font-bold">JJANG's MD Editor</h1>
                    <div id="filenameDisplay" class="filename-display">untitled.md</div>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-2 md:gap-3">
                <input type="file" id="fileInput" accept=".md,.markdown,.txt,.hwpx,.docx" />
                <button id="openFileBtn"
                        class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg font-semibold transition-colors flex items-center space-x-2"
                        title="파일 열기 — 마크다운(.md), 한글(.hwpx), Word(.docx)">
                    <i class="fas fa-folder-open"></i>
                    <span>파일 열기</span>
                </button>
                <button id="saveMarkdownBtn"
                        class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg font-semibold transition-colors flex items-center space-x-2"
                        title="마크다운 파일로 저장">
                    <i class="fas fa-save"></i>
                    <span>MD 저장</span>
                </button>
                <button id="exportPdfBtn"
                        class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg font-semibold transition-colors flex items-center space-x-2"
                        title="PDF로 내보내기">
                    <i class="fas fa-file-pdf"></i>
                    <span>PDF</span>
                </button>
                <button id="exportWordBtn"
                        class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg font-semibold transition-colors flex items-center space-x-2"
                        title="Word(.docx)로 내보내기">
                    <i class="fas fa-file-word"></i>
                    <span>Word</span>
                </button>
                <button id="exportHwpxBtn"
                        class="bg-orange-600 hover:bg-orange-700 px-4 py-2 rounded-lg font-semibold transition-colors flex items-center space-x-2"
                        title="한글(.hwpx)로 내보내기 — 서술식 발간물(책자) 서식">
                    <i class="fas fa-file-lines"></i>
                    <span>한글(서술)</span>
                </button>
                <button id="exportHwpxGovBtn"
                        class="bg-indigo-700 hover:bg-indigo-800 px-4 py-2 rounded-lg font-semibold transition-colors flex items-center space-x-2"
                        title="한글(.hwpx)로 내보내기 — 개조식 정부 보고서 서식">
                    <i class="fas fa-file-pen"></i>
                    <span>한글(개조)</span>
                </button>
            </div>
        </header>

        <!-- 툴바 -->
        <div class="bg-gray-200 px-3 md:px-6 py-2 md:py-3 flex items-center space-x-2 border-b border-gray-300 overflow-x-auto flex-shrink-0">
            <button id="undoBtn" class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    title="되돌리기 (Ctrl+Z)"
                    disabled>
                <i class="fas fa-undo"></i>
            </button>
            <button id="redoBtn" class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    title="다시실행 (Ctrl+Y)"
                    disabled>
                <i class="fas fa-redo"></i>
            </button>
            <div class="w-px h-6 bg-gray-400"></div>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="bold"
                    title="굵게 (Ctrl+B)">
                <i class="fas fa-bold"></i>
            </button>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="italic"
                    title="기울임 (Ctrl+I)">
                <i class="fas fa-italic"></i>
            </button>
            <div class="w-px h-6 bg-gray-400"></div>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="h1"
                    title="제목 1">
                <i class="fas fa-heading"></i><span class="text-xs ml-1">1</span>
            </button>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="h2"
                    title="제목 2">
                <i class="fas fa-heading"></i><span class="text-xs ml-1">2</span>
            </button>
            <div class="w-px h-6 bg-gray-400"></div>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="ul"
                    title="순서 없는 목록">
                <i class="fas fa-list-ul"></i>
            </button>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="ol"
                    title="순서 있는 목록">
                <i class="fas fa-list-ol"></i>
            </button>
            <div class="w-px h-6 bg-gray-400"></div>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="code"
                    title="코드 블록">
                <i class="fas fa-code"></i>
            </button>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="quote"
                    title="인용구">
                <i class="fas fa-quote-left"></i>
            </button>
            <div class="w-px h-6 bg-gray-400"></div>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="toc"
                    title="목차 삽입">
                <i class="fas fa-list-alt"></i>
            </button>
            <div class="w-px h-6 bg-gray-400"></div>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="math"
                    title="수식 삽입">
                <i class="fas fa-square-root-alt"></i>
            </button>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="footnote"
                    title="각주 삽입 ([^1] 참조 + 문서 끝 정의)">
                <i class="fas fa-asterisk"></i>
            </button>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="chart"
                    title="차트 삽입 (```chart 블록 — 한글·Word 네이티브 차트로 내보냄)">
                <i class="fas fa-chart-column"></i>
            </button>
            <div class="w-px h-6 bg-gray-400"></div>
            <button id="findBtn" class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    title="찾기 (Ctrl+F)">
                <i class="fas fa-search"></i>
            </button>
            <button id="replaceBtn" class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    title="찾아 바꾸기 (Ctrl+H)">
                <i class="fas fa-exchange-alt"></i>
            </button>
            <button id="lintBtn" class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    title="표기법·개조식 문체 검사">
                <i class="fas fa-spell-check"></i>
                <span class="ml-1 text-xs">검사</span>
            </button>
            <div class="w-px h-6 bg-gray-400"></div>
            <button id="toggleTocBtn" class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    title="목차 패널 표시/숨김">
                <i class="fas fa-bars"></i>
                <span class="ml-1 text-xs">TOC</span>
            </button>
            <button id="toggleSyncBtn" class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors bg-green-100"
                    title="스크롤 동기화 ON/OFF">
                <i class="fas fa-link"></i>
                <span class="ml-1 text-xs">Sync</span>
            </button>
        </div>

        <!-- 찾기/바꾸기 패널 -->
        <div id="findReplacePanel" class="bg-gray-100 border-b border-gray-300 px-6 py-3" style="display: none;">
            <div class="flex flex-col space-y-2">
                <!-- 찾기 행 -->
                <div class="flex items-center space-x-2">
                    <label class="text-sm text-gray-700 w-16">찾기:</label>
                    <input type="text" id="findInput"
                           class="flex-1 px-3 py-1.5 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="검색어 입력">
                    <button id="findPrevBtn" class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 rounded transition-colors"
                            title="이전 찾기">
                        <i class="fas fa-chevron-up"></i>
                    </button>
                    <button id="findNextBtn" class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 rounded transition-colors"
                            title="다음 찾기">
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <span id="findCount" class="text-sm text-gray-600 min-w-[80px]">0개 찾음</span>
                    <button id="closeFindBtn" class="px-2 py-1.5 text-gray-500 hover:text-gray-700 transition-colors"
                            title="닫기">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <!-- 바꾸기 행 -->
                <div id="replaceRow" class="flex items-center space-x-2" style="display: none;">
                    <label class="text-sm text-gray-700 w-16">바꾸기:</label>
                    <input type="text" id="replaceInput"
                           class="flex-1 px-3 py-1.5 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="바꿀 내용 입력">
                    <button id="replaceOneBtn" class="px-3 py-1.5 bg-blue-500 hover:bg-blue-600 text-white rounded transition-colors"
                            title="바꾸기">
                        바꾸기
                    </button>
                    <button id="replaceAllBtn" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded transition-colors"
                            title="모두 바꾸기">
                        모두 바꾸기
                    </button>
                    <div class="min-w-[80px]"></div>
                    <div class="px-2 py-1.5"></div>
                </div>
            </div>
        </div>

        <!-- 표기·문체 검사 패널 -->
        <div id="lintPanel" class="bg-amber-50 border-b border-gray-300 px-3 md:px-6 py-2 flex-shrink-0" style="display: none;">
            <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-sm">
                <strong class="text-gray-800"><i class="fas fa-spell-check mr-1"></i>표기·문체 검사</strong>
                <label class="flex items-center gap-1"><input type="checkbox" id="lintNotation" checked> 표기법(편람)</label>
                <label class="flex items-center gap-1"><input type="checkbox" id="lintMunche" checked> 개조식 문체</label>

        /**
         * 히스토리에 현재 상태 저장
         */
        function saveToHistory() {
            if (isRestoringState) return;

            const currentState = {
                text: editor.value,
                selectionStart: editor.selectionStart,
                selectionEnd: editor.selectionEnd
            };

            // 현재 인덱스 이후의 히스토리 제거
            history = history.slice(0, historyIndex + 1);

            // 새로운 상태 추가
            history.push(currentState);
            historyIndex++;

            // 히스토리 크기 제한 (최대 100개)
            if (history.length > 100) {
                history.shift();
                historyIndex--;
            }

            updateUndoRedoButtons();
        }

        /**
         * Undo/Redo 버튼 상태 업데이트

        function updateUndoRedoButtons() {
            undoBtn.disabled = historyIndex <= 0;
            redoBtn.disabled = historyIndex >= history.length - 1;
        }

        /**
         * 되돌리기 (Undo)
         */
        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                restoreState(history[historyIndex]);
            }
        }

        /**
         * 다시실행 (Redo)
         */
        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                restoreState(history[historyIndex]);
            }
        }

        /**
         * 상태 복원
         */
        function restoreState(state) {
            isRestoringState = true;
            editor.value = state.text;
            editor.selectionStart = state.selectionStart;
            editor.selectionEnd = state.selectionEnd;
            updatePreview();
            updateUndoRedoButtons();
            isRestoringState = false;
        }

        /* ----------------------------------------------------------
         * 각주 — [^이름] 참조와 [^이름]: 내용 정의 (marked 확장)
         * 번호는 본문에 처음 나온 순서대로 1, 2, 3…을 매기고 문서 끝에 각주 목록을 붙인다
         * ---------------------------------------------------------- */
        const footnoteState = {
            defs: new Map(), order: [], refCount: new Map(),
            reset() { this.defs = new Map(); this.order = []; this.refCount = new Map(); }
        };
        const footnoteEscape = text => String(text).replace(/[&<>"']/g, ch =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        const footnoteSlug = id => String(id).replace(/[^\w가-힣-]/g, '_');
        const FOOTNOTE_EXTENSIONS = [
            {
                name: 'footnoteDef',
                level: 'block',
                start(src) { const m = /^\[\^[^\]\s]+\]:/m.exec(src); return m ? m.index : undefined; },
                tokenizer(src) {
                    const m = /^\[\^([^\]\s]+)\]:[ \t]*([^\n]*(?:\n(?:[ \t]{2,}|\t)[^\n]*)*)(?:\n+|$)/.exec(src);
                    if (!m) return undefined;
                    if (!footnoteState.defs.has(m[1])) footnoteState.defs.set(m[1], m[2].replace(/\n[ \t]+/g, ' ').trim());
                    return { type: 'footnoteDef', raw: m[0], id: m[1] };
                },
                renderer() { return ''; }
            },
            {
                name: 'footnoteRef',
                level: 'inline',
                start(src) { const i = src.indexOf('[^'); return i >= 0 ? i : undefined; },
                tokenizer(src) {
                    const m = /^\[\^([^\]\s]+)\](?!:)/.exec(src);
                    if (!m) return undefined;
                    return { type: 'footnoteRef', raw: m[0], id: m[1] };
                },
                renderer(token) {
                    if (!footnoteState.defs.has(token.id)) return footnoteEscape(token.raw);
                    let n = footnoteState.order.indexOf(token.id) + 1;
                    if (n === 0) { footnoteState.order.push(token.id); n = footnoteState.order.length; }
                    const k = (footnoteState.refCount.get(token.id) || 0) + 1;
                    footnoteState.refCount.set(token.id, k);
                    return '<sup class="footnote-ref" data-fn="' + n + '"><a href="#fn-' + n + '" id="fnref-' + n + '-' + k + '">' + n + '</a></sup>';
                }
            }
        ];

        /**
         * 본문에서 참조된 각주 목록 HTML (문서 끝에 붙임)
         */
        function footnotesHtml() {
            if (footnoteState.order.length === 0) return '';
            const items = [];
            // 각주 안의 참조가 새 번호를 만들 수 있으므로 길이를 매번 다시 확인
            for (let i = 0; i < footnoteState.order.length; i++) {
                const id = footnoteState.order[i];
                const n = i + 1;
                items.push('<li id="fn-' + n + '" data-fn="' + n + '">' + marked.parseInline(footnoteState.defs.get(id) || '')
                    + ' <a href="#fnref-' + n + '-1" class="footnote-back" title="본문으로">↩</a></li>');
            }
            return '<section class="footnotes"><ol>' + items.join('') + '</ol></section>';
        }

        /* ----------------------------------------------------------
         * 차트 — ```chart 코드블록 (kordoc chart-gen.ts 규약·chartSpace 조립 이식, MIT)
         *   type: column | column_stacked | bar | bar_stacked | line | area | area_stacked
         *         | pie | doughnut | radar | scatter   (생략 시 column)
         *   cat: 1분기, 2분기, 3분기
         *   size: 120x70          (mm, 선택)
         *   colors: #304D68, accent2
         *   예산: 10, 20, 30      (그 밖의 "이름: 숫자들" 줄 = 데이터 계열)
         * 미리보기는 SVG, Word·한글은 편집 가능한 네이티브 차트(OOXML chartSpace)로 내보낸다
         * ---------------------------------------------------------- */
        const CHART_TYPES = {
            column: { el: 'barChart', dir: 'col', grp: 'clustered' },
            column_stacked: { el: 'barChart', dir: 'col', grp: 'stacked', overlap: 100 },
            line: { el: 'lineChart', grp: 'standard', marker: true },
            bar: { el: 'barChart', dir: 'bar', grp: 'clustered' },
            bar_stacked: { el: 'barChart', dir: 'bar', grp: 'stacked', overlap: 100 },
            scatter: { el: 'scatterChart', scatter: true },
            pie: { el: 'pieChart', pie: true },
            doughnut: { el: 'doughnutChart', pie: true, hole: 50 },
            area: { el: 'areaChart', grp: 'standard' },
            area_stacked: { el: 'areaChart', grp: 'stacked' },
            radar: { el: 'radarChart', radar: true }
        };
        const CHART_ALIAS = {
            col: 'column', 세로막대: 'column', 막대: 'column', 세로막대_누적: 'column_stacked', 누적: 'column_stacked',
            선: 'line', 꺾은선: 'line', 가로막대: 'bar', 가로막대_누적: 'bar_stacked', 분산: 'scatter',
            원: 'pie', 파이: 'pie', donut: 'doughnut', 도넛: 'doughnut', 영역: 'area', 방사형: 'radar'
        };
        // 계열 기본 색 (Office·한컴 기본 팔레트 accent1∼6)
        const CHART_PALETTE = ['#4472C4', '#ED7D31', '#A5A5A5', '#FFC000', '#5B9BD5', '#70AD47'];
        const CHART_HU_PER_MM = 7200 / 25.4;

        function chartColor(color, index) {
            const c = String(color || '').trim();
            const accent = /^accent([1-6])$/i.exec(c);
            if (accent) return CHART_PALETTE[parseInt(accent[1], 10) - 1];
            if (/^#?[0-9A-Fa-f]{6}$/.test(c)) return '#' + c.replace(/^#/, '').toUpperCase();
            return CHART_PALETTE[index % CHART_PALETTE.length];
        }

        /**
         * 차트 펜스 본문 해석 — 계열이 없거나 숫자가 아닌 값이 있으면 null(코드블록 그대로)
         */
        function parseChartFence(text) {
            let type = 'column';
            let cat = null, colors = null;
            let widthMm = 113.8, heightMm = 66.1;
            const series = [];
            for (const rawLine of String(text).split('\n')) {
                const line = rawLine.trim();
                if (!line || line.startsWith('#')) continue;
                const colon = line.search(/[:：]/);
                if (colon <= 0) continue;
                const key = line.slice(0, colon).trim();
                const value = line.slice(colon + 1).trim();
                const lower = key.toLowerCase();
                if (lower === 'type') {
                    const t = value.toLowerCase().replace(/[\s-]+/g, '_');
                    type = CHART_TYPES[t] ? t : (CHART_ALIAS[t] || CHART_ALIAS[value] || 'column');
                } else if (lower === 'cat') {
                    cat = value.split(',').map(v => v.trim()).filter(Boolean);
                } else if (lower === 'size') {
                    const m = /^(\d+(?:\.\d+)?)\s*[x×]\s*(\d+(?:\.\d+)?)$/i.exec(value);
                    if (m) {
                        const clamp = n => Math.min(170, Math.max(20, n));
                        widthMm = clamp(Number(m[1]));
                        heightMm = clamp(Number(m[2]));
                    }
                } else if (lower === 'colors') {
                    colors = value.split(',').map(v => v.trim()).filter(Boolean);
                } else if (lower === 'title' || lower === 'point_colors') {
                    // 차트 제목은 본문 캡션(<그림 N>)으로 적는다
                } else {
                    const segs = value.replace(/(\d),(?=\d{3}(?:\D|$))/g, '$1').split(',').map(v => v.trim()).filter(Boolean);
                    if (segs.length === 0) continue;
                    const nums = segs.map(Number);
                    if (!nums.every(n => Number.isFinite(n))) return null;
                    series.push({ name: key, values: nums });
                }
            }
            if (series.length === 0) return null;
            const spec = CHART_TYPES[type];
            let finalSeries = spec.pie ? [series[0]] : series;
            const points = Math.max(cat ? cat.length : 0, ...finalSeries.map(sr => sr.values.length));
            const categories = Array.from({ length: points }, (_, i) => (cat && cat[i]) || ('항목 ' + (i + 1)));
            finalSeries = finalSeries.map((sr, i) => ({
                name: sr.name,
                values: spec.scatter ? sr.values : categories.map((_, k) => sr.values[k] != null ? sr.values[k] : 0),
                color: chartColor(colors && !spec.pie ? colors[i % colors.length] : null, i)
            }));
            const pointColors = spec.pie ? categories.map((_, i) => chartColor(colors ? colors[i % colors.length] : null, i)) : null;
            return {
                type, spec, cat: categories, series: finalSeries, pointColors,
                widthHu: Math.round(widthMm * CHART_HU_PER_MM), heightHu: Math.round(heightMm * CHART_HU_PER_MM)
            };
        }

        /**
         * 차트 SVG (미리보기·PDF용) — DOM API로 만들어 사용자 입력을 HTML로 해석하지 않는다
         */
        function chartSvg(chart) {
            const NS = 'http://www.w3.org/2000/svg';
            const W = 640, H = Math.round(640 * chart.heightHu / chart.widthHu);
            const svg = document.createElementNS(NS, 'svg');
            svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
            svg.setAttribute('width', W);
            svg.setAttribute('height', H);
            svg.setAttribute('role', 'img');
            const el = (name, attrs, text) => {
                const node = document.createElementNS(NS, name);
                Object.keys(attrs).forEach(k => node.setAttribute(k, attrs[k]));
                if (text != null) node.textContent = text;
                svg.appendChild(node);
                return node;
            };
            const font = { 'font-family': 'Malgun Gothic, sans-serif', 'font-size': 12, fill: '#404040' };
            el('rect', { x: 0, y: 0, width: W, height: H, fill: '#FFFFFF' });
            const spec = chart.spec;
            // 범례 (오른쪽)
            const legendItems = spec.pie ? chart.cat.map((c, i) => [c, chart.pointColors[i]]) : chart.series.map(sr => [sr.name, sr.color]);
            const legendW = Math.min(170, 30 + Math.max(...legendItems.map(item => textWidthUnits(item[0]))) * 12);
            legendItems.forEach((item, i) => {
                const y = H / 2 - legendItems.length * 10 + i * 20;
                el('rect', { x: W - legendW + 6, y: y - 9, width: 12, height: 12, fill: item[1] });
                el('text', Object.assign({ x: W - legendW + 24, y: y + 2 }, font), item[0]);
            });
            const plot = { x: 50, y: 20, w: W - legendW - 70, h: H - 60 };
            if (spec.pie) {
                const values = chart.series[0].values.map(v => Math.max(0, v));
                const total = values.reduce((a, b) => a + b, 0) || 1;
                const cx = plot.x + plot.w / 2, cy = plot.y + plot.h / 2 + 10, r = Math.min(plot.w, plot.h + 20) / 2 - 4;
                let angle = -Math.PI / 2;
                values.forEach((v, i) => {
                    const sweep = v / total * Math.PI * 2;
                    if (sweep <= 0) return;
                    const a2 = angle + sweep;
                    const large = sweep > Math.PI ? 1 : 0;
                    const p = (a, rad) => (cx + rad * Math.cos(a)).toFixed(1) + ' ' + (cy + rad * Math.sin(a)).toFixed(1);
                    const d = sweep >= Math.PI * 2 - 1e-6
                        ? 'M ' + p(0, r) + ' A ' + r + ' ' + r + ' 0 1 1 ' + p(Math.PI, r) + ' A ' + r + ' ' + r + ' 0 1 1 ' + p(0, r) + ' Z'
                        : 'M ' + cx + ' ' + cy + ' L ' + p(angle, r) + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + p(a2, r) + ' Z';
                    el('path', { d, fill: chart.pointColors[i], stroke: '#FFFFFF', 'stroke-width': 1.5 });
                    angle = a2;
                });
                if (spec.hole) el('circle', { cx, cy, r: r * spec.hole / 100, fill: '#FFFFFF' });
                return svg;
            }
            const n = chart.cat.length;
            const stacked = spec.grp === 'stacked';
            const sums = chart.cat.map((_, k) => chart.series.reduce((a, sr) => a + Math.max(0, sr.values[k] || 0), 0));
            const all = stacked ? sums.concat([0]) : chart.series.flatMap(sr => sr.values).concat([0]);
            let max = Math.max(...all), min = Math.min(...all);
            if (max === min) max = min + 1;
            // 눈금 간격을 1·2·5×10ⁿ으로 맞춤
            const rawStep = (max - min) / 5;
            const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
            const step = [1, 2, 5, 10].map(m => m * mag).find(v => v >= rawStep);
            max = Math.ceil(max / step) * step;
            min = Math.floor(min / step) * step;
            const horiz = spec.dir === 'bar';
            const valueToPx = v => horiz
                ? plot.x + (v - min) / (max - min) * plot.w
                : plot.y + plot.h - (v - min) / (max - min) * plot.h;
            for (let v = min; v <= max + step / 2; v += step) {
                const label = Math.abs(v) >= 1000 ? Math.round(v).toLocaleString('en-US') : String(+v.toFixed(6));
                if (horiz) {
                    el('line', { x1: valueToPx(v), y1: plot.y, x2: valueToPx(v), y2: plot.y + plot.h, stroke: '#E0E0E0' });
                    el('text', Object.assign({ x: valueToPx(v), y: plot.y + plot.h + 16, 'text-anchor': 'middle' }, font), label);
                } else {
                    el('line', { x1: plot.x, y1: valueToPx(v), x2: plot.x + plot.w, y2: valueToPx(v), stroke: '#E0E0E0' });
                    el('text', Object.assign({ x: plot.x - 6, y: valueToPx(v) + 4, 'text-anchor': 'end' }, font), label);
                }
            }
            const band = (horiz ? plot.h : plot.w) / n;
            chart.cat.forEach((c, k) => {
                if (horiz) el('text', Object.assign({ x: plot.x - 6, y: plot.y + band * (k + 0.5) + 4, 'text-anchor': 'end' }, font), c);
                else el('text', Object.assign({ x: plot.x + band * (k + 0.5), y: plot.y + plot.h + 16, 'text-anchor': 'middle' }, font), c);
            });
            if (spec.el === 'barChart') {
                const groups = stacked ? 1 : chart.series.length;
                const barW = band * 0.7 / groups;
                const base = chart.cat.map(() => 0);
                chart.series.forEach((sr, i) => {
                    sr.values.forEach((v, k) => {
                        const from = stacked ? base[k] : 0;
                        const to = from + (stacked ? Math.max(0, v) : v);
                        if (stacked) base[k] = to;
                        const offset = band * 0.15 + (stacked ? 0 : barW * i);
                        const a = valueToPx(Math.min(from, to)), b = valueToPx(Math.max(from, to));
                        if (horiz) el('rect', { x: a, y: plot.y + band * k + offset, width: Math.max(0, b - a), height: barW, fill: sr.color });
                        else el('rect', { x: plot.x + band * k + offset, y: b, width: barW, height: Math.max(0, a - b), fill: sr.color });
                    });
                });
            } else {
                const base = chart.cat.map(() => 0);
                chart.series.forEach(sr => {
                    const pts = sr.values.map((v, k) => {
                        const y = stacked ? (base[k] += Math.max(0, v)) : v;
                        return [plot.x + band * (k + 0.5), valueToPx(y)];
                    });
                    const d = pts.map((pt, k) => (k ? 'L ' : 'M ') + pt[0].toFixed(1) + ' ' + pt[1].toFixed(1)).join(' ');
                    if (spec.el === 'areaChart') {
                        el('path', { d: d + ' L ' + pts[pts.length - 1][0].toFixed(1) + ' ' + valueToPx(0) + ' L ' + pts[0][0].toFixed(1) + ' ' + valueToPx(0) + ' Z', fill: sr.color, 'fill-opacity': 0.55 });
                    } else if (!spec.scatter) {
                        el('path', { d, fill: 'none', stroke: sr.color, 'stroke-width': 2.5 });
                    }
                    if (spec.marker || spec.scatter || spec.radar) pts.forEach(pt => el('circle', { cx: pt[0], cy: pt[1], r: 3.5, fill: sr.color }));
                });
            }
            el('line', { x1: plot.x, y1: plot.y + plot.h, x2: plot.x + plot.w, y2: plot.y + plot.h, stroke: '#808080' });
            el('line', { x1: plot.x, y1: plot.y, x2: plot.x, y2: plot.y + plot.h, stroke: '#808080' });
            return svg;
        }

        /**
         * 미리보기의 ```chart 코드블록을 차트 그림으로 교체 (원문은 data-chart에 보관)
         */
        function renderChartBlocks(root) {
            root.querySelectorAll('pre > code.language-chart').forEach(code => {
                const source = code.textContent;
                const chart = parseChartFence(source);
                if (!chart) return;
                const figure = document.createElement('figure');
                figure.className = 'md-chart';
                figure.dataset.chart = source;
                figure.appendChild(chartSvg(chart));
                code.parentElement.replaceWith(figure);
            });
        }

        /**
         * chartSpace(OOXML DrawingML 차트) XML — 한글 Chart/chartN.xml·Word word/charts/chartN.xml 공용
         */
        function chartSpaceXml(chart) {
            const esc = docxEscape;
            const spec = chart.spec;
            const col = i => String.fromCharCode(66 + i);
            const strPts = vals => '<c:ptCount val="' + vals.length + '"/>' + vals.map((v, i) => '<c:pt idx="' + i + '"><c:v>' + esc(v) + '</c:v></c:pt>').join('');
            const numPts = vals => '<c:formatCode>General</c:formatCode><c:ptCount val="' + vals.length + '"/>' + vals.map((v, i) => '<c:pt idx="' + i + '"><c:v>' + (Number(v) || 0) + '</c:v></c:pt>').join('');
            const fill = color => '<a:solidFill><a:srgbClr val="' + color.replace('#', '') + '"/></a:solidFill>';
            const stroke = spec.el === 'lineChart' || spec.el === 'radarChart';
            const spPr = color => stroke
                ? '<c:spPr><a:ln w="28575" cap="flat" cmpd="sng" algn="ctr">' + fill(color) + '<a:prstDash val="solid"/><a:round/></a:ln></c:spPr>'
                : '<c:spPr>' + fill(color) + '</c:spPr>';
            const tx = (i, name) => '<c:tx><c:strRef><c:f>Sheet1!$' + col(i) + '$1</c:f><c:strCache><c:ptCount val="1"/><c:pt idx="0"><c:v>' + esc(name) + '</c:v></c:pt></c:strCache></c:strRef></c:tx>';
            const catRef = '<c:cat><c:strRef><c:f>Sheet1!$A$2:$A$' + (chart.cat.length + 1) + '</c:f><c:strCache>' + strPts(chart.cat) + '</c:strCache></c:strRef></c:cat>';
            const valRef = (i, vals) => '<c:val><c:numRef><c:f>Sheet1!$' + col(i) + '$2:$' + col(i) + '$' + (vals.length + 1) + '</c:f><c:numCache>' + numPts(vals) + '</c:numCache></c:numRef></c:val>';
            const catAx = (id, pos, cross) => '<c:catAx><c:axId val="' + id + '"/><c:scaling><c:orientation val="minMax"/></c:scaling><c:delete val="0"/><c:axPos val="' + pos + '"/><c:numFmt formatCode="General" sourceLinked="1"/><c:majorTickMark val="out"/><c:minorTickMark val="none"/><c:tickLblPos val="nextTo"/><c:crossAx val="' + cross + '"/><c:crosses val="autoZero"/><c:auto val="1"/><c:lblAlgn val="ctr"/><c:lblOffset val="100"/><c:noMultiLvlLbl val="0"/></c:catAx>';
            const valAx = (id, pos, cross) => '<c:valAx><c:axId val="' + id + '"/><c:scaling><c:orientation val="minMax"/></c:scaling><c:delete val="0"/><c:axPos val="' + pos + '"/><c:majorGridlines/><c:numFmt formatCode="General" sourceLinked="1"/><c:majorTickMark val="out"/><c:minorTickMark val="none"/><c:tickLblPos val="nextTo"/><c:crossAx val="' + cross + '"/><c:crosses val="autoZero"/><c:crossBetween val="between"/></c:valAx>';
            const ax1 = '111111111', ax2 = '222222222';
            let plot;
            if (spec.scatter) {
                const n = Math.max(0, ...chart.series.map(sr => sr.values.length));
                const xs = Array.from({ length: n }, (_, i) => { const v = Number(chart.cat[i]); return chart.cat[i] !== undefined && Number.isFinite(v) ? v : i + 1; });
                const sers = chart.series.map((sr, i) => '<c:ser><c:idx val="' + i + '"/><c:order val="' + i + '"/>' + tx(i, sr.name)
                    + '<c:spPr><a:ln w="28575"><a:noFill/></a:ln></c:spPr><c:marker><c:symbol val="circle"/><c:size val="7"/>' + '<c:spPr>' + fill(sr.color) + '</c:spPr></c:marker>'
                    + '<c:xVal><c:numRef><c:f>Sheet1!$A$2:$A$' + (xs.length + 1) + '</c:f><c:numCache>' + numPts(xs) + '</c:numCache></c:numRef></c:xVal>'
                    + '<c:yVal><c:numRef><c:f>Sheet1!$' + col(i) + '$2:$' + col(i) + '$' + (sr.values.length + 1) + '</c:f><c:numCache>' + numPts(sr.values) + '</c:numCache></c:numRef></c:yVal>'
                    + '<c:smooth val="0"/></c:ser>').join('');
                plot = '<c:scatterChart><c:scatterStyle val="lineMarker"/><c:varyColors val="0"/>' + sers + '<c:axId val="' + ax1 + '"/><c:axId val="' + ax2 + '"/></c:scatterChart>'
                    + valAx(ax1, 'b', ax2) + valAx(ax2, 'l', ax1);
            } else if (spec.pie) {
                const sr = chart.series[0];
                const dPts = chart.pointColors.map((c, i) => '<c:dPt><c:idx val="' + i + '"/><c:bubble3D val="0"/><c:spPr>' + fill(c) + '</c:spPr></c:dPt>').join('');
                plot = '<c:' + spec.el + '><c:varyColors val="1"/><c:ser><c:idx val="0"/><c:order val="0"/>' + tx(0, sr.name)
                    + dPts + catRef + valRef(0, sr.values) + '</c:ser><c:firstSliceAng val="0"/>'
                    + (spec.hole ? '<c:holeSize val="' + spec.hole + '"/>' : '') + '</c:' + spec.el + '>';
            } else {
                const sers = chart.series.map((sr, i) => '<c:ser><c:idx val="' + i + '"/><c:order val="' + i + '"/>' + tx(i, sr.name) + spPr(sr.color)
                    + (spec.el === 'barChart' ? '<c:invertIfNegative val="0"/>' : '')
                    + (spec.marker ? '<c:marker><c:symbol val="circle"/><c:size val="5"/></c:marker>' : '')
                    + catRef + valRef(i, sr.values) + (spec.el === 'lineChart' ? '<c:smooth val="0"/>' : '') + '</c:ser>').join('');
                const horiz = spec.dir === 'bar';
                let inner = '';
                if (spec.dir) inner += '<c:barDir val="' + spec.dir + '"/>';
                if (spec.radar) inner += '<c:radarStyle val="marker"/>';
                else if (spec.grp) inner += '<c:grouping val="' + spec.grp + '"/>';
                inner += '<c:varyColors val="0"/>' + sers;
                if (spec.el === 'barChart') inner += '<c:gapWidth val="150"/>' + (spec.overlap ? '<c:overlap val="' + spec.overlap + '"/>' : '');
                if (spec.marker) inner += '<c:marker val="1"/>';
                inner += '<c:axId val="' + ax1 + '"/><c:axId val="' + ax2 + '"/>';
                plot = '<c:' + spec.el + '>' + inner + '</c:' + spec.el + '>' + catAx(ax1, horiz ? 'l' : 'b', ax2) + valAx(ax2, horiz ? 'b' : 'l', ax1);
            }
            return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<c:chartSpace xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart"'
                + ' xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"'
                + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
                + '<c:date1904 val="0"/><c:roundedCorners val="0"/>'
                + '<c:chart><c:autoTitleDeleted val="1"/><c:plotArea><c:layout/>' + plot + '</c:plotArea>'
                + '<c:legend><c:legendPos val="r"/><c:overlay val="0"/></c:legend>'
                + '<c:plotVisOnly val="1"/><c:dispBlanksAs val="gap"/></c:chart></c:chartSpace>';
        }

        /**
         * 초기화 함수        /**
         * 초기화 함수
         * CDN 라이브러리 로드 확인 및 에러 처리
         */
        function initialize() {
            try {
                // Marked.js 로드 확인
                if (typeof marked === 'undefined') {
                    throw new Error('Marked.js 라이브러리를 로드할 수 없습니다.');
                }

                // DOMPurify 로드 확인
                if (typeof DOMPurify === 'undefined') {
                    throw new Error('DOMPurify 라이브러리를 로드할 수 없습니다.');
                }

                // html2pdf.js 로드 확인
                if (typeof html2pdf === 'undefined') {
                    throw new Error('html2pdf.js 라이브러리를 로드할 수 없습니다.');
                }

                // Marked.js 옵션 설정
                // (headerIds·mangle·smartLists는 marked v8에서 제거된 옵션이라 두지 않는다)
                marked.setOptions({
                    breaks: true,  // 줄바꿈을 <br>로 변환
                    gfm: true      // GitHub Flavored Markdown 활성화
                });
                marked.use({ extensions: FOOTNOTE_EXTENSIONS });

                // 초기 텍스트 설정 및 렌더링
                editor.value = initialText;
                updatePreview();

                // 초기 상태를 히스토리에 저장
                saveToHistory();

                // 드래그 앤 드롭 설정
                setupDragAndDrop();

                console.log('✅ Markdown Editor 초기화 완료');

            } catch (error) {
                console.error('❌ 초기화 오류:', error);
                alert('에디터 초기화 중 오류가 발생했습니다:\n' + error.message);
            }
        }

        /**
         * 마크다운의 제목 목록을 미리보기 렌더링 순서대로 수집 ({ level, text })
         */
        function collectMarkdownHeadings(markdownText) {
            const headings = [];
            const htmlHeadingRe = /<h([1-6])\b[^>]*>([\s\S]*?)<\/h\1\s*>/gi;
            const walk = tokens => (tokens || []).forEach(token => {
                if (token.type === 'heading') {
                    headings.push({ level: token.depth, text: token.text.replace(/\s+/g, ' ').trim() });
                } else if (token.type === 'html') {
                    let m;
                    htmlHeadingRe.lastIndex = 0;
                    while ((m = htmlHeadingRe.exec(token.text)) !== null) {
                        headings.push({ level: parseInt(m[1], 10), text: m[2].replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim() });
                    }
                } else if (token.type === 'blockquote') {
                    walk(token.tokens);
                } else if (token.type === 'list') {
                    token.items.forEach(item => walk(item.tokens));
                }
            });
            try {
                walk(marked.lexer(markdownText));
            } catch (error) {
                console.error('❌ 제목 수집 오류:', error);
            }
            return headings;
        }

        /**
         * 목차(TOC) 생성
         * 코드 블록 내부의 TOC 주석과 헤딩은 무시
         */
        function generateTOC(markdownText) {
            // 코드 블록을 먼저 플레이스홀더로 치환
            const codeBlocks = [];
            let codeBlockIndex = 0;
            let textWithoutCode = markdownText;

            // 펜스 코드 블록 추출 (```...``` · ~~~...~~~)
            textWithoutCode = textWithoutCode.replace(/```[\s\S]*?```|~~~[\s\S]*?~~~/g, (match) => {
                const placeholder = `___TOC_CODE_BLOCK_${codeBlockIndex}___`;
                codeBlocks.push({ placeholder, content: match });
                codeBlockIndex++;
                return placeholder;
            });

            // 인라인 코드 추출 (`...`)
            textWithoutCode = textWithoutCode.replace(/`[^`\n]+?`/g, (match) => {
                const placeholder = `___TOC_INLINE_CODE_${codeBlockIndex}___`;
                codeBlocks.push({ placeholder, content: match });
                codeBlockIndex++;
                return placeholder;
            });

            // 코드 블록이 제거된 텍스트에서 TOC 주석 찾기
            const tocRegex = /<!--\s*TOC\s*-->([\s\S]*?)<!--\s*\/TOC\s*-->/i;

            // TOC 주석이 없으면 코드 블록 복원 후 반환
            if (!tocRegex.test(textWithoutCode)) {
                // 코드 블록 복원
                codeBlocks.forEach(({ placeholder, content }) => {
                    textWithoutCode = textWithoutCode.replace(placeholder, content);
                });
                return textWithoutCode;
            }

            // 헤딩 추출 — 미리보기와 같은 marked 렉서로 세어야 heading-N 번호가 어긋나지 않는다
            // (```·~~~ 펜스, 들여쓴 코드, setext(===) 제목, 인용·목록 안 제목, HTML <hN> 모두 반영)
            const headings = collectMarkdownHeadings(markdownText)
                .map((heading, index) => Object.assign(heading, { id: `heading-${index}` }));

            // TOC HTML 생성
            let tocHtml = '\n';
            headings.forEach(heading => {
                const indent = '  '.repeat(heading.level - 1);
                tocHtml += `${indent}- [${heading.text}](#${heading.id})\n`;
            });

            // TOC 주석 사이에 목차 삽입 (코드 블록이 제거된 텍스트에서)
            let result = textWithoutCode.replace(tocRegex, `<!-- TOC -->${tocHtml}<!-- /TOC -->`);

            // 코드 블록 복원
            codeBlocks.forEach(({ placeholder, content }) => {
                result = result.replace(placeholder, content);
            });

            return result;
        }

        /**
         * 수식 렌더링 (KaTeX)
         * 플레이스홀더 방식으로 처리
         */
        function processMath(markdownText) {
            if (typeof katex === 'undefined') {
                console.warn('⚠️ KaTeX 라이브러리가 로드되지 않았습니다.');
                return { text: markdownText, mathBlocks: [] };
            }

            const originalText = markdownText;
            const mathBlocks = [];
            const codeSegments = [];
            let index = 0;

            try {
                // 코드 블록과 인라인 코드는 수식 처리에서 제외
                markdownText = markdownText.replace(
                    /```[\s\S]*?```|~~~[\s\S]*?~~~|`[^`\n]*`/g,
                    (match) => {
                        const placeholder = `\uE000CODE_SEGMENT_${codeSegments.length}\uE001`;
                        codeSegments.push({ placeholder, content: match });
                        return placeholder;
                    }
                );

                // 블록 수식 추출 및 플레이스홀더로 치환 ($$...$$)
                // 여러 줄 지원
                markdownText = markdownText.replace(/\$\$([\s\S]+?)\$\$/g, (match, math) => {
                    try {
                        const rendered = katex.renderToString(math.trim(), {
                            displayMode: true,
                            throwOnError: false
                        });
                        const placeholder = `<span class="math-placeholder-block" data-math-id="${index}"></span>`;
                        mathBlocks.push({ placeholder, html: rendered, type: 'block', id: index });
                        index++;
                        return placeholder;
                    } catch (e) {
                        console.error('❌ 블록 수식 렌더링 오류:', e);
                        return match;
                    }
                });

                // 인라인 수식 추출 및 플레이스홀더로 치환 (\(...\))
                // 단일 $는 통화 기호로 보존하고 인라인 수식은 명시적 구분자만 허용
                markdownText = markdownText.replace(/\\\(([^\n]+?)\\\)/g, (match, math) => {
                    try {
                        const rendered = katex.renderToString(math.trim(), {
                            displayMode: false,
                            throwOnError: false
                        });
                        const placeholder = `<span class="math-placeholder-inline" data-math-id="${index}"></span>`;
                        mathBlocks.push({ placeholder, html: rendered, type: 'inline', id: index });
                        index++;
                        return placeholder;
                    } catch (e) {
                        console.error('❌ 인라인 수식 렌더링 오류:', e);
                        return match;
                    }
                });

                // 보호했던 코드 영역 복원
                codeSegments.forEach(({ placeholder, content }) => {
                    markdownText = markdownText.split(placeholder).join(content);
                });

                return { text: markdownText, mathBlocks };
            } catch (error) {
                console.error('❌ 수식 렌더링 오류:', error);
                return { text: originalText, mathBlocks: [] };
            }
        }

        /**
         * 플레이스홀더를 실제 렌더링된 수식으로 교체
         */
        function replaceMathPlaceholders(html, mathBlocks) {
            mathBlocks.forEach(({ id, html: mathHtml, type }) => {
                const wrappedHtml = type === 'block'
                    ? `<div class="math-block">${mathHtml}</div>`
                    : `<span class="math-inline">${mathHtml}</span>`;

                // span 플레이스홀더를 찾아서 교체
                const placeholderClass = type === 'block' ? 'math-placeholder-block' : 'math-placeholder-inline';
                const regex = new RegExp(
                    `<span class="${placeholderClass}" data-math-id="${id}"><\\/span>`,
                    'g'
                );
                html = html.replace(regex, wrappedHtml);
            });
            return html;
        }

        /**
         * 실시간 미리보기 업데이트
         */
        function updatePreview() {
            try {
                let markdownText = editor.value;

                // TOC 자동 생성
                markdownText = generateTOC(markdownText);

                // 수식을 플레이스홀더로 치환
                const { text, mathBlocks } = processMath(markdownText);

                // 마크다운 파싱(각주 목록은 문서 끝에 붙임) 후 신뢰할 수 없는 HTML과 URL 속성 제거
                footnoteState.reset();
                const parsed = marked.parse(text);
                let htmlContent = DOMPurify.sanitize(parsed + footnotesHtml(), {
                    FORBID_TAGS: ['form', 'input', 'button', 'textarea', 'select', 'option', 'style'],
                    FORBID_ATTR: ['style', 'srcdoc']
                });

                // 플레이스홀더를 렌더링된 수식으로 교체
                htmlContent = replaceMathPlaceholders(htmlContent, mathBlocks);

                preview.innerHTML = htmlContent;

                // 새 창 링크의 opener 접근 차단
                preview.querySelectorAll('a[target="_blank"]').forEach(link => {
                    link.rel = 'noopener noreferrer';
                });

                // ```chart 코드블록을 차트(SVG)로 교체
                renderChartBlocks(preview);

                // 목차 업데이트
                updateTOC();

            } catch (error) {
                console.error('❌ 마크다운 파싱 오류:', error);
                preview.innerHTML = '<p class="text-red-600">마크다운 렌더링 중 오류가 발생했습니다.</p>';
            }
        }

        /**
         * 목차(TOC) 업데이트
         */
        function updateTOC() {
            try {
                // 프리뷰에서 모든 헤딩 추출
                const headings = preview.querySelectorAll('h1, h2, h3, h4, h5, h6');
                tocContent.replaceChildren();

                if (headings.length === 0) {
                    const emptyMessage = document.createElement('p');
                    emptyMessage.className = 'text-gray-500 text-xs';
                    emptyMessage.textContent = '헤딩이 있는 문서를 작성하면 목차가 자동으로 생성됩니다.';
                    tocContent.appendChild(emptyMessage);
                    return;
                }

                // 사용자 입력을 HTML 문자열로 재해석하지 않도록 DOM API로 목차 생성
                const tocList = document.createElement('ul');
                tocList.className = 'space-y-1';

                headings.forEach((heading, index) => {
                    const level = parseInt(heading.tagName[1]); // H1 -> 1, H2 -> 2, ...
                    const text = heading.textContent;
                    const id = `heading-${index}`;

                    // 헤딩에 ID 추가 (스크롤 이동용)
                    heading.id = id;

                    // 들여쓰기 레벨
                    const indent = (level - 1) * 12;

                    const listItem = document.createElement('li');
                    listItem.style.marginLeft = `${indent}px`;

                    const link = document.createElement('a');
                    link.href = `#${id}`;
                    link.className = 'toc-link text-gray-700 hover:text-blue-600 hover:underline block py-1';
                    link.dataset.headingId = id;
                    link.textContent = text;

                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const headingId = link.dataset.headingId;
                        const headingElement = document.getElementById(headingId);
                        if (headingElement) {
                            // 스크롤 동기화 임시 해제
                            const wasSyncEnabled = isSyncEnabled;
                            isSyncEnabled = false;

                            // 헤딩 위치로 스크롤
                            headingElement.scrollIntoView({ behavior: 'smooth', block: 'start' });

                            // 1초 후 동기화 복원
                            setTimeout(() => {
                                isSyncEnabled = wasSyncEnabled;
                            }, 1000);
                        }
                    });

                    listItem.appendChild(link);
                    tocList.appendChild(listItem);
                });

                tocContent.appendChild(tocList);
            } catch (error) {
                console.error('❌ 목차 업데이트 오류:', error);
            }
        }

        /**
         * 에디터에 마크다운 문법 삽입
         * @param {string} action - 수행할 액션 (bold, italic, h1, h2, ul, ol, code, quote)
         */
        function insertMarkdown(action) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const selectedText = editor.value.substring(start, end);
            const beforeText = editor.value.substring(0, start);
            const afterText = editor.value.substring(end);

            let newText = '';
            let cursorOffset = 0;

            switch(action) {
                case 'bold':
                    newText = `**${selectedText || '굵은 텍스트'}**`;
                    cursorOffset = selectedText ? newText.length : 2;
                    break;

                case 'italic':
                    newText = `*${selectedText || '기울임 텍스트'}*`;
                    cursorOffset = selectedText ? newText.length : 1;
                    break;

                case 'h1':
                    newText = `# ${selectedText || '제목 1'}`;
                    cursorOffset = newText.length;
                    break;

                case 'h2':
                    newText = `## ${selectedText || '제목 2'}`;
                    cursorOffset = newText.length;
                    break;

                case 'ul':
                    if (selectedText) {
                        const lines = selectedText.split('\n');
                        newText = lines.map(line => `- ${line}`).join('\n');
                    } else {
                        newText = '- 목록 항목';
                    }
                    cursorOffset = newText.length;
                    break;

                case 'ol':
                    if (selectedText) {
                        const lines = selectedText.split('\n');
                        newText = lines.map((line, index) => `${index + 1}. ${line}`).join('\n');
                    } else {
                        newText = '1. 목록 항목';
                    }
                    cursorOffset = newText.length;
                    break;

                case 'code':
                    if (selectedText.includes('\n')) {
                        newText = `\`\`\`\n${selectedText}\n\`\`\``;
                        cursorOffset = newText.length - 4;
                    } else {
                        newText = `\`${selectedText || '코드'}\``;
                        cursorOffset = selectedText ? newText.length : 1;
                    }
                    break;

                case 'quote':
                    if (selectedText) {
                        const lines = selectedText.split('\n');
                        newText = lines.map(line => `> ${line}`).join('\n');
                    } else {
                        newText = '> 인용구';
                    }
                    cursorOffset = newText.length;
                    break;

                case 'toc':
                    newText = '<!-- TOC -->\n자동으로 생성될 위치\n<!-- /TOC -->';
                    cursorOffset = newText.length;
                    break;

                case 'math':
                    if (selectedText) {
                        // 여러 줄이면 블록 수식, 한 줄이면 인라인 수식
                        if (selectedText.includes('\n')) {
                            newText = `$$\n${selectedText}\n$$`;
                        } else {
                            newText = `\\(${selectedText}\\)`;
                        }
                    } else {
                        newText = '\\(E = mc^2\\)';
                    }
                    cursorOffset = selectedText ? newText.length : 1;
                    break;

                case 'footnote': {
                    // 다음 각주 번호로 참조를 넣고 정의 줄은 문서 끝에 붙인다
                    const used = Array.from(editor.value.matchAll(/\[\^(\d+)\]/g)).map(m => parseInt(m[1], 10));
                    const n = used.length ? Math.max(...used) + 1 : 1;
                    newText = '[^' + n + ']';
                    cursorOffset = newText.length;
                    const definition = '[^' + n + ']: ' + (selectedText || '각주 내용');
                    editor.value = beforeText + newText + afterText.replace(/\s*$/, '') + '\n\n' + definition + '\n';
                    editor.focus();
                    editor.setSelectionRange(start + cursorOffset, start + cursorOffset);
                    updatePreview();
                    saveToHistory();
                    return;
                }

                case 'chart':
                    newText = '```chart\ntype: column\ncat: 1분기, 2분기, 3분기, 4분기\n예산: 120, 150, 170, 200\n집행: 100, 140, 160, 190\n```';
                    cursorOffset = newText.length;
                    break;

                default:
                    return;
            }

            // 텍스트 업데이트
            editor.value = beforeText + newText + afterText;

            // 커서 위치 설정
            if (selectedText) {
                editor.selectionStart = editor.selectionEnd = start + cursorOffset;
            } else {
                editor.selectionStart = start + cursorOffset;
                editor.selectionEnd = start + cursorOffset;
            }

            // 포커스 및 미리보기 업데이트
            editor.focus();
            updatePreview();

            // 히스토리에 저장
            saveToHistory();
        }

        /**
         * PDF로 내보내기
         */
        async function exportToPDF() {
            // 원본 스타일 백업
            const originalOverflow = preview.style.overflow;
            const originalHeight = preview.style.height;
            const originalMaxHeight = preview.style.maxHeight;

            try {
                // 로딩 상태 표시
                exportPdfBtn.classList.add('loading');
                exportPdfBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span class="ml-2">생성 중...</span>';

                console.log('📄 PDF 생성 시작...');
                console.log('Preview 내용:', preview.innerHTML.substring(0, 100));

                // preview 요소의 overflow 임시 제거 (전체 콘텐츠 표시)
                preview.style.overflow = 'visible';
                preview.style.height = 'auto';
                preview.style.maxHeight = 'none';

                // DOM 업데이트 대기
                await new Promise(resolve => setTimeout(resolve, 500));

                console.log('Preview 크기:', preview.scrollWidth, 'x', preview.scrollHeight);

                // PDF 생성 옵션
                const opt = {
                    margin: [10, 10, 10, 10],
                    filename: currentFilename.replace(/\.md$/, '.pdf') || 'document.pdf',
                    image: {
                        type: 'jpeg',
                        quality: 0.95
                    },
                    html2canvas: {
                        scale: 2,
                        useCORS: true,
                        logging: true,
                        backgroundColor: '#ffffff',
                        windowHeight: preview.scrollHeight,
                        height: preview.scrollHeight
                    },
                    jsPDF: {
                        unit: 'mm',
                        format: 'a4',
                        orientation: 'portrait'
                    }
                };

                // PDF 생성
                console.log('html2pdf 시작...');
                const pdfBlob = await html2pdf().from(preview).set(opt).outputPdf('blob');

                // File System Access API 지원 시 저장 경로 선택 대화상자 표시
                if (window.showSaveFilePicker) {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: opt.filename,
                        types: [{
                            description: 'PDF Files',
                            accept: { 'application/pdf': ['.pdf'] }
                        }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(pdfBlob);
                    await writable.close();
                } else {
                    // 폴백: 자동 다운로드
                    const url = URL.createObjectURL(pdfBlob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = opt.filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                }

                console.log('✅ PDF 내보내기 완료');

            } catch (error) {
                if (error.name === 'AbortError') return; // 사용자 취소
                console.error('❌ PDF 내보내기 오류:', error);
                console.error('에러 상세:', error.stack);
                alert('PDF 생성 중 오류가 발생했습니다:\n' + error.message);
            } finally {
                // 원본 스타일 복원
                preview.style.overflow = originalOverflow;
                preview.style.height = originalHeight;
                preview.style.maxHeight = originalMaxHeight;

                // 로딩 상태 해제
                exportPdfBtn.classList.remove('loading');
                exportPdfBtn.innerHTML = '<i class="fas fa-file-pdf"></i><span class="ml-2">PDF</span>';
            }
        }

        /**
         * XML 특수문자 이스케이프 (제어문자 제거 포함)
         */
        function docxEscape(text) {
            return String(text)
                .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F\uFFFE\uFFFF]/g, '')
                // 짝 없는 서로게이트는 XML 문자가 아니다

                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

            if (!/^[A-Za-z_]/.test(safe)) safe = 'bm_' + safe;
            return safe;
        }

        /**
         * 런 문자 서식(rPr) 생성 — OOXML 스키마의 자식 순서 준수
         */
        function docxRunProps(fmt) {
            let props = '';
            if (fmt.link) props += '<w:rStyle w:val="ac"/>';
            else if (fmt.code) props += '<w:rStyle w:val="VerbatimChar"/>';
            if (fmt.math) props += '<w:rFonts w:ascii="Cambria Math" w:eastAsia="Cambria Math" w:hAnsi="Cambria Math"/>';
            if (fmt.bold) props += '<w:b/><w:bCs/>';
            if (fmt.italic || fmt.math) props += '<w:i/><w:iCs/>';
            if (fmt.strike) props += '<w:strike/>';
            if (fmt.color) props += '<w:color w:val="' + fmt.color + '"/>';
            if (fmt.underline) props += '<w:u w:val="single"/>';
            if (fmt.sup) props += '<w:vertAlign w:val="superscript"/>';
            else if (fmt.sub) props += '<w:vertAlign w:val="subscript"/>';
            return props ? '<w:rPr>' + props + '</w:rPr>' : '';
        }

        /**
         * 텍스트 런 생성 (탭 문자는 <w:tab/>으로 변환)
         */
        function docxMakeRun(text, fmt) {
            if (text === '') return '';
            const props = docxRunProps(fmt || {});
            const parts = String(text).split('\t').map(seg =>
                seg === '' ? '' : '<w:t xml:space="preserve">' + docxEscape(seg) + '</w:t>'
            );
            return '<w:r>' + props + parts.join('<w:tab/>') + '</w:r>';
        }

            let props = '';
            if (opts.style) props += '<w:pStyle w:val="' + opts.style + '"/>';
            if (opts.numId) props += '<w:numPr><w:ilvl w:val="' + opts.ilvl + '"/><w:numId w:val="' + opts.numId + '"/></w:numPr>';
            if (opts.hr) props += '<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="999999"/></w:pBdr>';
            if (opts.indLeft || opts.indRight) {
                props += '<w:ind';
                if (opts.indLeft) props += ' w:left="' + opts.indLeft + '"';
                if (opts.indRight) props += ' w:right="' + opts.indRight + '"';
                props += '/>';
            }
            if (opts.jc) props += '<w:jc w:val="' + opts.jc + '"/>';
            return props ? '<w:pPr>' + props + '</w:pPr>' : '';
