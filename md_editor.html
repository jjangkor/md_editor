                    const body = groupOrToken(k, depth);
                    return { value: root ? 'root {' + root + '} of {' + body.value + '}' : 'sqrt{' + body.value + '}', next: body.next };
                }
                if (c === 'begin') {
                    const env = balanced(skip(name.next), '{', '}');
                    const endTag = '\\end{' + env.value + '}';
                    const endIdx = src.indexOf(endTag, env.next);
                    if (endIdx === -1) return { value: '', next: env.next };
                    const body = convertRange(env.next, endIdx, depth + 1);
                    const tok = HWPX_EQ_ENVS[env.value];
                    const next = endIdx + endTag.length;
                    if (tok) return { value: '{' + tok + '{' + body + '}}', next };
                    if (env.value === 'Bmatrix') return { value: 'LEFT { {matrix{' + body + '}} RIGHT }', next };
                    return { value: body, next };
                }
                if (c === 'end') return { value: '', next: balanced(skip(name.next), '{', '}').next };
                if (c === 'left' || c === 'right' || c === 'bigl' || c === 'bigr' || c === 'Bigl' || c === 'Bigr') {
                    const kw = /^(left|bigl|Bigl)$/.test(c) ? 'LEFT' : 'RIGHT';
                    const k = skip(name.next);
                    let delim = src[k] || '';
                    let next = delim ? k + 1 : k;
                    if (delim === '\\') {
                        const esc = cmdName(k);
                        delim = esc.value === '\\' ? '\\' : (HWPX_EQ_COMMANDS[esc.value] || (esc.value === 'lbrace' ? '{' : esc.value === 'rbrace' ? '}' : esc.value === 'vert' ? '|' : esc.value));
                        next = esc.next;
                    }
                    if (delim === '.') delim = '';
                    return { value: delim ? kw + ' ' + delim : kw, next };
                }
                if (HWPX_EQ_ACCENTS[c]) {
                    const body = groupOrToken(name.next, depth);
                    return { value: HWPX_EQ_ACCENTS[c] + '{' + body.value + '}', next: body.next };
                }
                if (c === ',' || c === ' ') return { value: '`', next: name.next };
                if (c === ';' || c === ':' || c === '>') return { value: '~', next: name.next };
                if (c === '!') return { value: '', next: name.next };
                if (c === '{' || c === '}' || c === '|' || c === '%' || c === '$' || c === '#' || c === '&' || c === '_') {
                    return { value: c === '|' ? '||' : c, next: name.next };
                }
                if (/^(mathrm|text|textrm|mathbf|textbf|mathit|mathsf|operatorname|mbox)$/.test(c)) {
                    const k = skip(name.next);
                    if (src[k] === '{') {
                        const g = balanced(k, '{', '}');
                        const style = /bf/.test(c) ? 'bold ' : '';
                        return { value: style + '"' + g.value.replace(/"/g, '') + '"', next: g.next };
                    }
                    const t = groupOrToken(k, depth);
                    return { value: '"' + t.value + '"', next: t.next };
                }
                if (/^(displaystyle|textstyle|scriptstyle|limits|nolimits)$/.test(c)) return { value: '', next: name.next };
                if (HWPX_EQ_COMMANDS[c] !== undefined) return { value: HWPX_EQ_COMMANDS[c], next: name.next };
                if (HWPX_EQ_FUNCTIONS.has(c)) return { value: c, next: name.next };
                // 모르는 명령은 따옴표로 보호해 글자가 흩어지지 않게 한다
                if (/^[A-Za-z]{2,}$/.test(c)) return { value: '"' + c + '"', next: name.next };
                return { value: c, next: name.next };
            }
            return convertRange(0, src.length, 0);
        }

        /**
         * 한/글 수식 개체(hp:equation) 런 — 크기는 스크립트로 어림하고 한/글이 열 때 다시 조판한다
         */
        function hwpxEquationRun(tex, state, charPrId, baseUnit) {
            const script = hwpxLatexToEqEdit(tex);
            const plain = script.replace(/[{}\\^_]/g, '').replace(/\s+/g, ' ').trim();
            const unit = baseUnit || 1000;
            const width = Math.min(Math.max(textWidthUnits(plain), 3) * Math.round(unit * 0.62) + Math.round(unit * 1.2), HWPX_CONTENT_WIDTH);
            const rows = (script.match(/#/g) || []).length + 1;
            let height = Math.round(unit * 1.25);
            let baseline = 80;
            if (/\bmatrix\b|\bcases\b|\beqalign\b|#/.test(script)) { height = Math.round(unit * (1.3 * rows + 0.4)); baseline = 60; }
            else if (/\bover\b|\broot\b|\bsqrt\b|\bint\b|\bsum\b|\bprod\b/.test(script)) { height = Math.round(unit * 2.6); baseline = 68; }
            const id = ++state.objectId;
            return '<hp:run charPrIDRef="' + charPrId + '">'
                + '<hp:equation id="' + id + '" zOrder="' + id % 1000 + '" numberingType="EQUATION" textWrap="TOP_AND_BOTTOM"'
                + ' textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" version="Equation Version 60" baseLine="' + baseline + '"'
                + ' textColor="#000000" baseUnit="' + unit + '" lineMode="CHAR" font="HYhwpEQ">'
                + '<hp:sz width="' + width + '" widthRelTo="ABSOLUTE" height="' + height + '" heightRelTo="ABSOLUTE" protect="0"/>'
                + '<hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0"'
                + ' vertRelTo="PARA" horzRelTo="PARA" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/>'
                + '<hp:outMargin left="56" right="56" top="0" bottom="0"/>'
                + '<hp:shapeComment>수식입니다.</hp:shapeComment>'
                + '<hp:script>' + hwpxEscape(script) + '</hp:script>'
                + '</hp:equation></hp:run>';
        }

        /**
         * 각주 개체(hp:footNote) — 본문 참조 위치에 두고, 내용은 문서 끝 각주 목록(li)에서 가져온다
         */
        function hwpxFootnoteRun(sup, fmt, state, styles) {
            const n = sup.getAttribute('data-fn');
            const li = state.root && state.root.querySelector('section.footnotes li[data-fn="' + n + '"]');
            if (!li) return '';
            const noteFmt = fmt.gov
                ? { gov: true, size: HWPX_GOV.sz.note - 100, font: HWPX_GOV.fonts.gothic, color: HWPX_GOV.colors.note }
                : { size: HWPX_SZ.source, color: HWPX_COLORS.body };
            const cp = hwpxCharIdFor(styles, noteFmt);
            let runs = '';
            li.childNodes.forEach(child => {
                if (child.nodeType === Node.ELEMENT_NODE && child.classList.contains('footnote-back')) return;
                runs += hwpxInlineToRuns(child, noteFmt, state, styles);
            });
            const pp = styles.paraPr({ align: 'JUSTIFY', ls: 130 });
            const instId = ++state.objectId - 1000000000;
            return '<hp:run charPrIDRef="' + hwpxCharIdFor(styles, fmt) + '"><hp:ctrl>'
                + '<hp:footNote number="' + n + '" suffixChar="41" instId="' + instId + '">'
                + '<hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="TOP" linkListIDRef="0"'
                + ' linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0">'
                + '<hp:p id="' + (++state.paraId) + '" paraPrIDRef="' + pp + '" styleIDRef="15" pageBreak="0" columnBreak="0" merged="0">'
                + '<hp:run charPrIDRef="' + cp + '"><hp:ctrl><hp:autoNum num="' + n + '" numType="FOOTNOTE">'
                + '<hp:autoNumFormat type="DIGIT" userChar="" prefixChar="" suffixChar=")" supscript="0"/></hp:autoNum></hp:ctrl>'
                + '<hp:t> </hp:t></hp:run>'
                + runs
                + '</hp:p></hp:subList></hp:footNote></hp:ctrl></hp:run>';
        }

        // 한/글 하이퍼링크 필드 공통 fieldid (한/글 저장본 실측값)
        const HWPX_HYPERLINK_FIELDID = 627600491;

        /**
         * 하이퍼링크 필드로 감싼 런 — 한/글에서 Ctrl+클릭으로 열린다
         */
        function hwpxHyperlinkRuns(href, innerRuns, charPrId, state) {
            const fid = ++state.objectId - 1000000000;
            const command = hwpxEscape(href.replace(/:/g, '\\:')) + ';1;0;0';
            return '<hp:run charPrIDRef="' + charPrId + '"><hp:ctrl>'
                + '<hp:fieldBegin id="' + fid + '" type="HYPERLINK" name="" editable="0" dirty="0" zorder="-1" fieldid="' + HWPX_HYPERLINK_FIELDID + '">'
                + '<hp:parameters cnt="6" name=""><hp:integerParam name="Prop">0</hp:integerParam>'
                + '<hp:stringParam name="Command">' + command + '</hp:stringParam>'
                + '<hp:stringParam name="Path">' + hwpxEscape(href) + '</hp:stringParam>'
                + '<hp:stringParam name="Category">HWPHYPERLINK_TYPE_URL</hp:stringParam>'
                + '<hp:stringParam name="TargetType">HWPHYPERLINK_TARGET_BOOKMARK</hp:stringParam>'
                + '<hp:stringParam name="DocOpenType">HWPHYPERLINK_JUMP_CURRENTTAB</hp:stringParam>'
                + '</hp:parameters></hp:fieldBegin></hp:ctrl></hp:run>'
                + innerRuns
                + '<hp:run charPrIDRef="' + charPrId + '"><hp:ctrl><hp:fieldEnd beginIDRef="' + fid + '" fieldid="' + HWPX_HYPERLINK_FIELDID + '"/></hp:ctrl></hp:run>';
        }

        /**
         * 차트 문단 — Chart/chartN.xml(chartSpace)을 등록하고 hp:chart로 참조 (글자처럼 취급)
         */
        function hwpxChartPara(figure, state, styles) {
            const chart = parseChartFence(figure.dataset.chart || '');
            if (!chart) return '';
            const name = 'Chart/chart' + (state.charts.length + 1) + '.xml';
            state.charts.push({ name, xml: chartSpaceXml(chart) });
            const w = Math.min(chart.widthHu, HWPX_CONTENT_WIDTH);
            const h = Math.round(chart.heightHu * w / chart.widthHu);
            const id = ++state.objectId;
            const el = '<hp:chart id="' + id + '" zOrder="' + id % 1000 + '" numberingType="PICTURE" textWrap="TOP_AND_BOTTOM"'
                + ' textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" chartIDRef="' + name + '">'
                + '<hp:sz width="' + w + '" widthRelTo="ABSOLUTE" height="' + h + '" heightRelTo="ABSOLUTE" protect="0"/>'
                + '<hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0"'
                + ' vertRelTo="PARA" horzRelTo="PARA" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/>'
                + '<hp:outMargin left="709" right="709" top="709" bottom="709"/></hp:chart>';
            return hwpxParagraph(state, styles.paraPr({ align: 'CENTER', prev: 200, next: 200, ls: 100 }),
                '<hp:run charPrIDRef="1">' + el + '</hp:run>');
        }

        /**
         * 미리보기의 인라인 노드를 HWPX 런 목록으로 변환
         */
        function hwpxInlineToRuns(node, fmt, state, styles) {
            if (node.nodeType === Node.TEXT_NODE) {
                if (node.textContent.trim() === '') {
                    const isBlock = el => el && el.nodeType === Node.ELEMENT_NODE
                        && /^(UL|OL|P|PRE|TABLE|BLOCKQUOTE|DIV|LI|H[1-6]|TR|TD|TH)$/.test(el.tagName);
                    const prev = node.previousSibling;
                    const next = node.nextSibling;
                    if (!prev || !next || isBlock(prev) || isBlock(next)) return '';
                    return hwpxTextRun(' ', hwpxCharIdFor(styles, fmt));
                }
                let content = node.textContent;
                // 개조식 마커를 본문 런에서 제거 (마커는 별도 런으로 이미 출력됨)
                if (state.stripPrefixRe) {
                    content = content.replace(state.stripPrefixRe, '');
                    state.stripPrefixRe = null;
                }
                content = content.replace(/[ \t\r\n]+/g, ' ');
                if (!fmt.gov) return hwpxTextRun(fmt.code ? content : hwpxBindSpaces(content), hwpxCharIdFor(styles, fmt));
                // 인라인 코드는 원문 그대로 (물결 통일·괄호 축소 제외)
                if (fmt.code) { state.govLabelFmt = null; return hwpxTextRun(content, hwpxCharIdFor(styles, fmt)); }
                content = hwpxGovNormalize(content);
                // 개조식 ㅇ·- 줄의 첫 텍스트: 줄머리 (라벨)을 굵은 런으로 분리
                let labelRuns = '';
                if (state.govLabelFmt) {
                    const label = hwpxGovSplitLabel(content.replace(/^ /, ''), state.govLabelFmt, styles);
                    if (label.runs) { labelRuns = label.runs; content = label.rest; }
                    state.govLabelFmt = null;
                }
                return labelRuns + hwpxGovParenRuns(content, fmt, styles);
            }
            if (node.nodeType !== Node.ELEMENT_NODE) return '';

            const tag = node.tagName;
            if (node.classList.contains('katex-display') || node.classList.contains('katex')) {
                // KaTeX 수식은 원문 TeX를 한/글 수식 개체로 변환 (수식 편집기로 다시 편집 가능)
                const katexRoot = node.classList.contains('katex') ? node : (node.querySelector('.katex') || node);
                const size = fmt.size || HWPX_SZ.body;
                return hwpxEquationRun(docxTexFromKatex(katexRoot), state, hwpxCharIdFor(styles, fmt), size);
            }

            if (tag === 'SUP' && node.classList.contains('footnote-ref')) return hwpxFootnoteRun(node, fmt, state, styles);

            switch (tag) {
                case 'BR':
                    return '<hp:run charPrIDRef="' + hwpxCharIdFor(styles, fmt) + '"><hp:lineBreak/></hp:run>';
                case 'STRONG': case 'B':
                    fmt = Object.assign({}, fmt, { bold: true }); break;
                case 'EM': case 'I':
                    fmt = Object.assign({}, fmt, { italic: true }); break;
                case 'DEL': case 'S': case 'STRIKE':
                    fmt = Object.assign({}, fmt, { strike: true }); break;
                case 'U':
                    fmt = Object.assign({}, fmt, { underline: true }); break;
                case 'SUP':
                    fmt = Object.assign({}, fmt, { sup: true }); break;
                case 'SUB':
                    fmt = Object.assign({}, fmt, { sub: true }); break;
                case 'CODE':
                    fmt = fmt.gov
                        ? Object.assign({}, fmt, { code: true, size: HWPX_GOV.sz.note, font: HWPX_GOV.fonts.gothic })
                        : Object.assign({}, fmt, { code: true, shadeBf: styles.bfCode });
                    break;
                case 'IMG':
                    return hwpxPicRun(node, state, styles);
                case 'A': {
                    const href = node.getAttribute('href') || '';
                    const linkFmt = Object.assign({}, fmt, { link: true });
                    let inner = '';
                    node.childNodes.forEach(child => { inner += hwpxInlineToRuns(child, linkFmt, state, styles); });
                    if (inner === '') return '';
                    if (!/^(https?:|mailto:)/i.test(href)) return inner;
                    // 외부 링크는 한/글 하이퍼링크 필드로 감싸고, 인쇄물에서도 주소가 보이도록 "텍스트(URL)" 병기
                    let linked = hwpxHyperlinkRuns(href, inner, hwpxCharIdFor(styles, linkFmt), state);
                    if (node.textContent.trim() !== href.replace(/^mailto:/i, '')) {
                        linked += hwpxTextRun('(' + href + ')', hwpxCharIdFor(styles, fmt.gov
                            ? Object.assign({}, fmt, { link: false })
                            : { size: HWPX_SZ.source, color: HWPX_COLORS.muted }));
                    }
                    return linked;
                }
            }

            let runs = '';
            node.childNodes.forEach(child => { runs += hwpxInlineToRuns(child, fmt, state, styles); });
            return runs;
        }

        /**
         * 미리 수집한 이미지를 인라인 그림(hp:pic) 런으로 변환
         */
        function hwpxPicRun(img, state, styles) {
            const data = state.images.get(img);
            if (!data) {
                const alt = img.getAttribute('alt') || img.getAttribute('src') || '이미지';
                return hwpxTextRun('[이미지: ' + alt + ']',
                    hwpxCharIdFor(styles, { italic: true, color: HWPX_COLORS.muted }));
            }
            const id = ++state.objectId;
            const w = data.w;
            const h = data.h;
            return '<hp:run charPrIDRef="1"><hp:pic textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" reverse="0"'
                + ' id="' + id + '" zOrder="' + id % 1000 + '" numberingType="PICTURE" lock="0" dropcapstyle="None"'
                + ' href="" groupLevel="0" instid="' + (id - 1000000000) + '">'
                + '<hp:offset x="0" y="0"/>'
                + '<hp:orgSz width="' + w + '" height="' + h + '"/>'
                + '<hp:curSz width="' + w + '" height="' + h + '"/>'
                + '<hp:flip horizontal="0" vertical="0"/>'
                + '<hp:rotationInfo angle="0" centerX="' + Math.round(w / 2) + '" centerY="' + Math.round(h / 2) + '" rotateimage="1"/>'
                + '<hp:renderingInfo><hc:transMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/>'
                + '<hc:scaMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/>'
                + '<hc:rotMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/></hp:renderingInfo>'
                + '<hp:imgRect><hc:pt0 x="0" y="0"/><hc:pt1 x="' + w + '" y="0"/>'
                + '<hc:pt2 x="' + w + '" y="' + h + '"/><hc:pt3 x="0" y="' + h + '"/></hp:imgRect>'
                + '<hp:imgClip left="0" right="' + w + '" top="0" bottom="' + h + '"/>'
                + '<hp:inMargin left="0" right="0" top="0" bottom="0"/>'
                + '<hp:imgDim dimwidth="' + w + '" dimheight="' + h + '"/>'
                + '<hc:img binaryItemIDRef="' + data.itemId + '" bright="0" contrast="0" effect="REAL_PIC" alpha="0"/>'
                + '<hp:effects/>'
                + '<hp:sz width="' + w + '" height="' + h + '" widthRelTo="ABSOLUTE" heightRelTo="ABSOLUTE" protect="0"/>'
                + '<hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0"'
                + ' vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/>'
                + '<hp:outMargin left="0" right="0" top="0" bottom="0"/>'
                + '<hp:shapeComment/>'
                + '</hp:pic></hp:run>';
        }

        /**
         * 미리보기의 이미지를 BinData로 수집 (실패 시 대체 텍스트 사용)
         */
        async function hwpxCollectImages(root, state) {
            const imgs = root.querySelectorAll('img');
            for (const img of imgs) {
                const data = await exportImageData(img);
                if (!data) continue;
                // px(96dpi) -> HWPUNIT(1/7200 inch): x75, 본문 폭·페이지 높이에 맞게 축소
                let w = Math.round(data.width * 75);
                let h = Math.round(data.height * 75);
                if (w > HWPX_CONTENT_WIDTH) {
                    h = Math.max(1, Math.round(h * HWPX_CONTENT_WIDTH / w));
                    w = HWPX_CONTENT_WIDTH;
                }
                const maxH = 60000;
                if (h > maxH) {
                    w = Math.max(1, Math.round(w * maxH / h));
                    h = maxH;
                }
                hwpxAddBinItem(state, img, data.bytes, data.ext, w, h);
            }
        }

        /**
         * BinData 항목 등록 (content.hpf 매니페스트 + 패키지 파일)
         */
        function hwpxAddBinItem(state, key, bytes, ext, w, h) {
            const itemId = 'image' + (state.binItems.length + 1);
            const href = 'BinData/' + itemId + '.' + ext;
            state.media.push({ name: href, data: bytes, store: true });
            state.binItems.push({ id: itemId, href, type: ext === 'jpg' ? 'image/jpeg' : 'image/' + ext });
            state.images.set(key, { itemId, w: Math.max(1, w), h: Math.max(1, h) });
            return itemId;
        }

        /**
         * 표 셀(tc) XML 생성
         */
        function hwpxTableCell(state, styles, opts) {
            return '<hp:tc name="" header="' + (opts.header ? 1 : 0) + '" hasMargin="0" protect="0"'
                + ' editable="0" dirty="0" borderFillIDRef="' + opts.bf + '">'
                + '<hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="CENTER"'
                + ' linkListIDRef="0" linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0">'
                + opts.paragraphs
                + '</hp:subList>'
                + '<hp:cellAddr colAddr="' + opts.col + '" rowAddr="' + opts.row + '"/>'
                + '<hp:cellSpan colSpan="' + (opts.colSpan || 1) + '" rowSpan="' + (opts.rowSpan || 1) + '"/>'
                + '<hp:cellSz width="' + opts.width + '" height="' + opts.height + '"/>'
                + '<hp:cellMargin left="' + opts.margin[0] + '" right="' + opts.margin[1] + '" top="' + opts.margin[2] + '" bottom="' + opts.margin[3] + '"/>'
                + '</hp:tc>';
        }

        /**
         * 표(tbl) XML 골격 생성
         */
        function hwpxTableShell(state, styles, opts) {
            return '<hp:tbl id="' + (++state.objectId) + '" zOrder="' + state.objectId % 1000 + '" numberingType="TABLE"'
                + ' textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" pageBreak="CELL"'
                + ' repeatHeader="' + (opts.repeatHeader ? 1 : 0) + '" rowCnt="' + opts.rowCnt + '" colCnt="' + opts.colCnt + '"'
                + ' cellSpacing="0" borderFillIDRef="' + (opts.tableBf || styles.bfNone) + '" noAdjust="0">'
                + '<hp:sz width="' + HWPX_CONTENT_WIDTH + '" widthRelTo="ABSOLUTE" height="' + opts.height + '" heightRelTo="ABSOLUTE" protect="0"/>'
                // 2행 이상 데이터 표는 글자처럼 취급하지 않는다(treatAsChar=0, 자리차지) —
                // 글자처럼 취급한 표는 pageBreak="CELL"이어도 쪽 경계에서 나뉘지 않아 앞 쪽이 비거나 아래가 잘린다
                + '<hp:pos treatAsChar="' + (opts.float ? 0 : 1) + '" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0"'
                + ' vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/>'
                + '<hp:outMargin left="0" right="0" top="' + opts.outTop + '" bottom="' + opts.outBottom + '"/>'
                + '<hp:inMargin left="510" right="510" top="141" bottom="141"/>'
                + opts.rows
                + '</hp:tbl>';
        }

        /**
         * 챕터 표지 블록 — 크림색 바탕 + 주황 번호 배지 + 청록 제목
         * (# 제목이 "2. 제목" 형태면 번호를 배지로 사용)
         */
        function hwpxChapterCover(h1, state, styles) {
            const text = h1.textContent.trim();
            const numbered = /^(\d{1,3})[.)]?\s+(.+)$/.exec(text);
            let chipNum;
            let titleRuns;
            if (numbered) {
                chipNum = parseInt(numbered[1], 10);
                state.chapterCounter = chipNum;
                titleRuns = hwpxTextRun(numbered[2],
                    hwpxCharIdFor(styles, { size: HWPX_SZ.chapter, color: HWPX_COLORS.title, bold: true }));
            } else {
                chipNum = ++state.chapterCounter;
                titleRuns = hwpxInlineToRuns(h1,
                    { size: HWPX_SZ.chapter, color: HWPX_COLORS.title, bold: true }, state, styles);
            }
            state.sectionCounter = 0;

            const chipCp = hwpxCharIdFor(styles, {
                size: HWPX_SZ.chip, color: HWPX_COLORS.white, bold: true, shadeBf: styles.bfAccent
            });
            const ppBadge = styles.paraPr({ align: 'CENTER', next: 1100, ls: 150 });
            const ppTitle = styles.paraPr({ align: 'CENTER', ls: 150, headingLevel: 0 });
            // 배지 좌우 여백은 줄바꿈·공백 정리에 안전한 NBSP로 채운다
            const inner = hwpxParagraph(state, ppBadge, hwpxTextRun('\u00A0 ' + chipNum + ' \u00A0', chipCp))
                + hwpxParagraph(state, ppTitle, titleRuns);

            const coverHeight = 36000;
            const rows = '<hp:tr>' + hwpxTableCell(state, styles, {
                header: false, bf: styles.bfCover, paragraphs: inner,
                col: 0, row: 0, width: HWPX_CONTENT_WIDTH, height: coverHeight,
                margin: [2000, 2000, 6500, 6500]
            }) + '</hp:tr>';
            const tbl = hwpxTableShell(state, styles, {
                rowCnt: 1, colCnt: 1, height: coverHeight, outTop: 0, outBottom: 1500, rows
            });

            const ppWrap = styles.paraPr({
                align: 'CENTER', ls: 100, pageBreakBefore: state.coverEmitted
            });
            state.coverEmitted = true;
            return hwpxParagraph(state, ppWrap, '<hp:run charPrIDRef="1">' + tbl + '</hp:run>');
        }

        /**
         * 섹션 제목 배너 — 주황 배지(가/나/다) + 남색 제목 + 연회색 밑줄
         * (## 제목이 "가. 제목" 형태면 그 배지를 그대로 사용)
         */
        function hwpxSectionBanner(h2, state, styles) {
            const labels = '가나다라마바사아자차카타파하';
            let text = h2.textContent.trim();
            let label = null;
            const explicit = /^\(?([가-힣])[.)]\s+(.+)$/.exec(text);
            if (explicit && labels.indexOf(explicit[1]) >= 0) {
                label = explicit[1];
                text = explicit[2];
                state.sectionCounter = labels.indexOf(label) + 1;
            } else {
                label = labels[state.sectionCounter % labels.length];
                state.sectionCounter++;
            }
            const titleRuns = explicit
                ? hwpxTextRun(text, hwpxCharIdFor(styles, { size: HWPX_SZ.section, color: HWPX_COLORS.heading, bold: true }))
                : hwpxInlineToRuns(h2, { size: HWPX_SZ.section, color: HWPX_COLORS.heading, bold: true }, state, styles);

            const badgeCp = hwpxCharIdFor(styles, {
                size: HWPX_SZ.badge, color: HWPX_COLORS.white, bold: true
            });
            const ppCell = styles.paraPr({ align: 'CENTER', ls: 130 });
            const ppTitleCell = styles.paraPr({ align: 'LEFT', ls: 130, headingLevel: 1 });
            const badgeWidth = 2400;
            const rowHeight = 2300;
            const rows = '<hp:tr>'
                + hwpxTableCell(state, styles, {
                    header: false, bf: styles.bfBadge,
                    paragraphs: hwpxParagraph(state, ppCell, hwpxTextRun(label, badgeCp)),
                    col: 0, row: 0, width: badgeWidth, height: rowHeight, margin: [80, 80, 120, 200]
                })
                + hwpxTableCell(state, styles, {
                    header: false, bf: styles.bfRule,
                    paragraphs: hwpxParagraph(state, ppTitleCell, titleRuns),
                    col: 1, row: 0, width: HWPX_CONTENT_WIDTH - badgeWidth, height: rowHeight, margin: [400, 100, 120, 200]
                })
                + '</hp:tr>';
            const tbl = hwpxTableShell(state, styles, {
                rowCnt: 1, colCnt: 2, height: rowHeight, outTop: 900, outBottom: 500, rows
            });
            const ppWrap = styles.paraPr({ align: 'LEFT', ls: 100, keepWithNext: true });
            return hwpxParagraph(state, ppWrap, '<hp:run charPrIDRef="1">' + tbl + '</hp:run>');
        }

        /**
         * 표 공통 렌더러 — 테마 스펙(테두리·글자·정렬 규칙)에 따라 변환
         */
        function hwpxRenderTable(table, state, styles, spec) {
            const grid = tableGrid(table);
            if (grid.rowCount === 0 || grid.colCount === 0) return '';
            const widths = tableColumnWidths(grid, HWPX_CONTENT_WIDTH, 1200);

            // 열 정렬: align 속성 우선, 없으면 테마별 규칙(짧은/숫자 열 가운데)
            const centered = [];
            for (let c = 0; c < grid.colCount; c++) {
                const vals = grid.cells
                    .filter(cell => cell.el && cell.col === c && cell.colSpan === 1 && !grid.headerRows[cell.row])
                    .map(cell => cell.el.textContent.trim())
                    .filter(v => v !== '');
                centered.push(vals.length === 0 || spec.centerCol(vals));
            }

            const rowHeight = 1500;
            const ppCellCenter = styles.paraPr({ align: 'CENTER', ls: 150 });
            const ppCellLeft = styles.paraPr({ align: 'LEFT', ls: 150 });
            const ppCellRight = styles.paraPr({ align: 'RIGHT', ls: 150 });
            let rowsXml = '';
            for (let r = 0; r < grid.rowCount; r++) {
                rowsXml += '<hp:tr>';
                grid.cells.filter(cell => cell.row === r).forEach(cell => {
                    const isHeader = grid.headerRows[r];
                    let paragraphs;
                    if (cell.el) {
                        const align = (cell.el.getAttribute('align') || '').toLowerCase();
                        const pp = isHeader ? ppCellCenter
                            : align === 'center' ? ppCellCenter
                            : align === 'right' ? ppCellRight
                            : align === 'left' ? ppCellLeft
                            : (cell.colSpan > 1 || centered[cell.col] ? ppCellCenter : ppCellLeft);
                        const fmt = isHeader ? spec.headFmt : spec.bodyFmt;
                        let runs = '';
                        cell.el.childNodes.forEach(child => { runs += hwpxInlineToRuns(child, fmt, state, styles); });
                        paragraphs = hwpxParagraph(state, pp, runs);
                    } else {
                        paragraphs = hwpxParagraph(state, ppCellCenter, '');
                    }
                    rowsXml += hwpxTableCell(state, styles, {
                        header: isHeader, bf: isHeader ? spec.headBf : spec.bodyBf,
                        paragraphs, col: cell.col, row: cell.row, colSpan: cell.colSpan, rowSpan: cell.rowSpan,
                        width: widths.slice(cell.col, cell.col + cell.colSpan).reduce((sum, w) => sum + w, 0),
                        height: rowHeight * cell.rowSpan,
                        margin: spec.margin
                    });
                });
                rowsXml += '</hp:tr>';
            }
            const float = grid.rowCount >= 2;
            const tbl = hwpxTableShell(state, styles, {
                repeatHeader: true, rowCnt: grid.rowCount, colCnt: grid.colCount, tableBf: spec.tableBf,
                height: rowHeight * grid.rowCount, rows: rowsXml, float,
                // 자리차지 표는 본문이 표 바닥에 붙으므로 아래 여백을 한 줄 피치만큼 둔다
                outTop: 350, outBottom: float ? spec.floatGap : 350
            });
            const ppWrap = styles.paraPr({ align: 'CENTER', ls: 100 });
            return hwpxParagraph(state, ppWrap, '<hp:run charPrIDRef="1">' + tbl + '</hp:run>');
        }

        /**
         * 표를 발간물 서식(주황 머리행 + 가로 연회색 줄)으로 변환
         */
        function hwpxTableToXml(table, state, styles) {
            return hwpxRenderTable(table, state, styles, {
                headBf: styles.bfTableHead,
                bodyBf: styles.bfTableBody,
                headFmt: { size: HWPX_SZ.tableHead, color: HWPX_COLORS.white, bold: true },
                bodyFmt: { size: HWPX_SZ.table, color: HWPX_COLORS.body },
                margin: [300, 300, 160, 160], floatGap: 1700,
                centerCol: vals => vals.every(v => v.length <= 14)
            });
        }

        // 숫자·단위 위주 셀 판정 (개조식 표의 가운데 정렬 규칙)
        const HWPX_NUMERIC_CELL_RE = /^[\s\d,.\-+%~∼()/:·억조만천원년월일pP]*$/;

        /**
         * 표를 개조식 서식(청회색 머리행 + 검정 격자)으로 변환
         */
        function hwpxGovTableToXml(table, state, styles) {
            return hwpxRenderTable(table, state, styles, {
                headBf: styles.bfGovHead,
                bodyBf: styles.bfGovCell,
                tableBf: styles.bfGovCell,
                headFmt: { gov: true, size: HWPX_GOV.sz.table, font: HWPX_GOV.fonts.gothic, bold: true },
                bodyFmt: { gov: true, size: HWPX_GOV.sz.table, font: HWPX_GOV.fonts.gothic },
                margin: [360, 360, 140, 140], floatGap: 2400,
                centerCol: vals => vals.every(v => HWPX_NUMERIC_CELL_RE.test(v) || v.length <= 4)
            });
        }

        /**
         * 목록(ul/ol)을 미리보기와 같은 계층(□→○→●, 1→1.1→1.1.1)으로 변환
         */
        function hwpxListToXml(list, level, state, styles, ctx, olPath) {
            const ordered = list.tagName === 'OL';
            const bullets = ['□', '○', '●'];
            let index = ordered ? (parseInt(list.getAttribute('start') || '1', 10) || 1) : 0;
            let xml = '';
            Array.from(list.children).forEach(li => {
                if (li.tagName !== 'LI') return;
                const marker = ordered
                    ? olPath.concat(index).join('.') + '.'
                    : bullets[Math.min(level, bullets.length - 1)];
                const hang = hwpxMarkerHang(marker, HWPX_SZ.body, HWPX_SZ.body);
                const indent = 600 * level;
                const ppItem = styles.paraPr({
                    align: 'JUSTIFY', left: indent + hang, intent: -hang, next: 150, ls: 170, tab: 1
                });
                const ppCont = styles.paraPr({
                    align: 'JUSTIFY', left: indent + hang, next: 150, ls: 170
                });
                let firstParagraphDone = false;
                let inlineBuffer = '';
                const flushInline = () => {
                    if (inlineBuffer.trim() === '' && firstParagraphDone) { inlineBuffer = ''; return; }
                    if (!firstParagraphDone) {
                        // 부호 뒤 탭 — 자동 탭이 내어쓰기 위치에 서서 둘째 줄과 맞는다
                        const markerRun = hwpxTextRun(marker + '\t',
                            hwpxCharIdFor(styles, { size: HWPX_SZ.body, color: HWPX_COLORS.body }));
                        xml += hwpxParagraph(state, ppItem, markerRun + inlineBuffer);
                    } else {
                        xml += hwpxParagraph(state, ppCont, inlineBuffer);
                    }
                    inlineBuffer = '';
                    firstParagraphDone = true;
                };
                li.childNodes.forEach(child => {
                    const childTag = child.nodeType === Node.ELEMENT_NODE ? child.tagName : null;
                    if (childTag === 'UL' || childTag === 'OL') {
                        flushInline();
                        xml += hwpxListToXml(child, level + 1, state, styles, ctx,
                            childTag === 'OL' ? (ordered ? olPath.concat(index) : olPath) : olPath);
                    } else if (childTag === 'P') {
                        child.childNodes.forEach(grandchild => {
                            inlineBuffer += hwpxInlineToRuns(grandchild, {}, state, styles);
                        });
                        flushInline();
                    } else if (childTag === 'PRE') {
                        flushInline();
                        xml += hwpxPreToXml(child, state, styles, { indent: indent + hang });
                    } else if (childTag === 'TABLE') {
                        flushInline();
                        xml += hwpxTableToXml(child, state, styles);
                    } else if (childTag === 'BLOCKQUOTE') {
                        flushInline();
                        xml += hwpxBlocksToXml(child, state, styles,
                            Object.assign({}, ctx, { quoteDepth: (ctx.quoteDepth || 0) + 1 }));
                    } else {
                        inlineBuffer += hwpxInlineToRuns(child, {}, state, styles);
                    }
                });
                if (!firstParagraphDone || inlineBuffer.trim() !== '') flushInline();
                if (ordered) index++;
            });
            return xml;
        }

        /**
         * 코드 블록(pre)을 연회색 배경 문단들로 변환
         */
        function hwpxPreToXml(pre, state, styles, opts) {
            const cp = hwpxCharIdFor(styles, { size: HWPX_SZ.code, color: '#333333' });
            const pp = styles.paraPr({
                align: 'LEFT', left: (opts && opts.indent) || 0, ls: 140,
                borderBf: styles.bfCode, borderOff: [200, 200, 80, 80], connect: true
            });
            const lines = pre.textContent.replace(/\n$/, '').split('\n');
            return lines.map(line => hwpxParagraph(state, pp, hwpxTextRun(line || ' ', cp))).join('');
        }

        /**
         * 미리보기 블록 요소들을 HWPX 본문으로 변환
         */
        function hwpxBlocksToXml(parent, state, styles, ctx) {
            ctx = ctx || {};
            let xml = '';
            Array.from(parent.childNodes).forEach(node => {
                if (node.nodeType !== Node.ELEMENT_NODE) return;
                const tag = node.tagName;

                // 문서 끝 각주 목록은 본문 각주 개체로 이미 옮겼다
                if (tag === 'SECTION' && node.classList.contains('footnotes')) return;
                if (tag === 'FIGURE' && node.classList.contains('md-chart')) { xml += hwpxChartPara(node, state, styles); return; }
                if (tag === 'H1') { xml += hwpxChapterCover(node, state, styles); return; }
                if (tag === 'H2') { xml += hwpxSectionBanner(node, state, styles); return; }
                if (/^H[3-6]$/.test(tag)) {
                    const size = tag === 'H3' ? HWPX_SZ.h3 : HWPX_SZ.h4;
                    const pp = styles.paraPr({
                        align: 'LEFT', prev: 450, next: 150, ls: 150, keepWithNext: true,
                        headingLevel: parseInt(tag[1], 10) - 1
                    });
                    const runs = hwpxInlineToRuns(node,
                        { size, color: HWPX_COLORS.heading, bold: true }, state, styles);
                    xml += hwpxParagraph(state, pp, runs);
                    return;
                }

                switch (tag) {
                    case 'P': {
                        if (isEmptyParagraph(node)) break;
                        const text = node.textContent.trim();
                        if (text === '' && node.querySelector('img')) {
                            // 이미지 단독 문단: 가운데 정렬
                            const ppImg = styles.paraPr({ align: 'CENTER', prev: 300, next: 300, ls: 100 });
                            node.querySelectorAll('img').forEach(img => {
                                xml += hwpxParagraph(state, ppImg, hwpxPicRun(img, state, styles));
                            });
                            break;
                        }
                        let baseFmt = {};
                        let pp;
                        if (/^[<〈]\s*(그림|표)/.test(text)) {
                            // <그림 N>/<표 N> 캡션: 가운데 남색 굵게
                            baseFmt = { size: HWPX_SZ.caption, color: HWPX_COLORS.heading, bold: true };
                            pp = styles.paraPr({ align: 'CENTER', prev: 250, next: 120, ls: 150, keepWithNext: true });
                        } else if (/^(출처|자료)\s*[:：]/.test(text)) {
                            // 출처 표기: 가운데 회색 작은 글씨
                            baseFmt = { size: HWPX_SZ.source, color: HWPX_COLORS.muted };
                            pp = styles.paraPr({ align: 'CENTER', next: 600, ls: 150 });
                        } else if (ctx.quoteDepth > 0) {
                            baseFmt = { color: '#595959' };
                            pp = styles.paraPr({
                                align: 'JUSTIFY', left: 700 * ctx.quoteDepth, next: 200, ls: 170,
                                borderBf: styles.bfQuote, borderOff: [300, 0, 60, 60], connect: true
                            });
                        } else if (node.querySelector('.katex-display')) {
                            pp = styles.paraPr({ align: 'CENTER', prev: 200, next: 300, ls: 160 });
                        } else {
                            pp = styles.paraPr({ align: 'JUSTIFY', next: 350, ls: 180 });
                        }
                        let runs = '';
                        node.childNodes.forEach(child => { runs += hwpxInlineToRuns(child, baseFmt, state, styles); });
                        xml += hwpxParagraph(state, pp, runs);
                        break;
                    }
                    case 'UL': case 'OL':
                        xml += hwpxListToXml(node, 0, state, styles, ctx, []);
                        break;
                    case 'BLOCKQUOTE':
                        xml += hwpxBlocksToXml(node, state, styles,
                            Object.assign({}, ctx, { quoteDepth: (ctx.quoteDepth || 0) + 1 }));
                        break;
                    case 'PRE':
                        xml += hwpxPreToXml(node, state, styles, {});
                        break;
                    case 'TABLE':
                        xml += hwpxTableToXml(node, state, styles);
                        break;
                    case 'HR': {
                        const pp = styles.paraPr({
                            align: 'CENTER', prev: 250, next: 250, ls: 100,
                            borderBf: styles.bfRule, borderOff: [0, 0, 0, 100]
                        });
                        xml += hwpxParagraph(state, pp, '');
                        break;
                    }
                    default:
                        if (node.querySelector && node.querySelector('p, ul, ol, table, pre, blockquote, h1, h2, h3, h4, h5, h6')) {
                            xml += hwpxBlocksToXml(node, state, styles, ctx);
                        } else {
                            let runs = '';
                            node.childNodes.forEach(child => { runs += hwpxInlineToRuns(child, {}, state, styles); });
                            if (node.classList && node.classList.contains('katex')) {
                                runs = hwpxInlineToRuns(node, {}, state, styles);
                            }
                            if (runs !== '') {
                                const isMathBlock = node.classList
                                    && (node.classList.contains('katex-display') || !!node.querySelector('.katex-display'));
                                const pp = styles.paraPr(isMathBlock
                                    ? { align: 'CENTER', prev: 200, next: 300, ls: 160 }
                                    : { align: 'JUSTIFY', next: 350, ls: 180 });
                                xml += hwpxParagraph(state, pp, runs);
                            }
                        }
                }
            });
            return xml;
        }

        /* ----------------------------------------------------------
         * 개조식(정부 보고서) 변환 — 정부 문서 개조식 규격:
         * HY헤드라인M 제목(상하 0.5mm 남색 괘선) + 우측 부제,
         * ㅁ(0칸) / ㅇ(1칸) / -(2칸) 3단 걸어쓰기 + ※·*·**(4칸) 보충(맑은 고딕 회색),
         * 문단 여백 ㅁ 앞 5 pt·ㅇ 앞 6 pt·보충 앞 2 pt, (5)·(6)·(2) 여백 지정 줄,
         * 코드블럭에 붙여 넣은 개조식 평문 펼치기, 범위 '~' → '∼' 통일,
         * ⇨ 청색 화살표, 붙임 배너, 청회색 머리행 검정 격자 표, 하단 중앙 "- 1 -" 쪽번호
         * ---------------------------------------------------------- */

        /**
         * 부호 내어쓰기 폭 = 부호 글자 폭 + 반 칸 — 부호 뒤 탭(자동 탭 = 내어쓰기 위치)이
         * 이 위치에 서서 첫 줄 내용과 둘째 줄이 같은 x에서 시작한다.
         * 폭은 넉넉히 잡는다(한글·기호 전각 1, 그 밖 0.6) — 부호가 내어쓰기보다 넓으면 탭이 다음 탭 위치로 넘어간다
         */
        function hwpxMarkerHang(marker, markerSize, gapSize, boxed) {
            let units = 0;
            for (const ch of String(marker)) {
                units += /[\u2000-\u2BFF\u2E80-\u9FFF\u3130-\u318F\uAC00-\uD7AF\uFF00-\uFF60]/.test(ch) ? 1 : 0.6;
            }
            return Math.round(units * markerSize + (boxed ? 400 : 0) + gapSize * 0.5);
        }

        // 수준별 표준 부호의 내어쓰기 폭 (ㅁ 번호 박스·ㅇ·-··) — 마커 없는 이어쓰기 줄의 시작선
        function hwpxGovLevelHang(level) {
            if (level <= 0) return hwpxMarkerHang('1', HWPX_GOV.sz.numBox, HWPX_GOV.sz.h0, true);
            const marker = HWPX_GOV.autoMarkers[Math.min(level, HWPX_GOV.autoMarkers.length - 1)][0];
            return hwpxMarkerHang(marker, HWPX_GOV.sz.body, HWPX_GOV.sz.body);
        }

        // ※·*·** 보충 부호의 내어쓰기 폭
        function hwpxGovNoteHang(marker) {
            return hwpxMarkerHang(marker, HWPX_GOV.sz.note, HWPX_GOV.sz.note);
        }

        // 걸어쓰기 문단 모양: 부호 폭만큼 내어쓰기 + 자동 탭(tabPr 1)
        function hwpxGovBulletPp(styles, level, width, prev, next, outline) {
            const opts = {
                align: 'LEFT', left: HWPX_GOV.step * level + width, intent: -width,
                prev: prev || 0, next: next || 0, ls: 160, tab: 1
            };
            if (outline != null) opts.headingLevel = outline;
            return styles.paraPr(opts);
        }

        // 수준별 문단 앞 간격 (ㅁ 앞 5 pt, ㅇ 앞 6 pt, - 줄 사이는 여백 없음)
        function hwpxGovPrev(level) {
            return level === 0 ? HWPX_GOV.prevL0 : (level === 1 ? HWPX_GOV.prevL1 : HWPX_GOV.prevLx);
        }

        // ※·* 보충 줄 문단 모양 — 부모 수준과 무관하게 ㅇ 본문 시작선에 맞춘다
        // (cont: ※ 갈래 둘째 줄처럼 마커 없이 앞 줄 본문에 이어 맞추는 경우)
        function hwpxGovNotePp(styles, width, prev, cont) {
            const x = HWPX_GOV.step + hwpxGovLevelHang(1);
            return styles.paraPr({
                align: 'LEFT', left: x + width, intent: cont ? 0 : -width, prev: prev || 0, ls: 160, tab: 1
            });
        }

        /**
         * 개조식 문서 제목 — 「◈ 제목」 한 줄 (테두리 없음, 왼쪽 정렬, 검정 굵은 고딕)
         */
        function hwpxGovTitle(h1, state, styles) {
            const pp = styles.paraPr({ align: 'LEFT', prev: 200, next: 200, ls: 160, headingLevel: 0 });
            const fmt = { gov: true, size: HWPX_GOV.sz.title, font: HWPX_GOV.fonts.head, bold: true };
            const prefix = /^\s*◈/.test(h1.textContent) ? '' : hwpxTextRun('◈ ', hwpxCharIdFor(styles, fmt));
            const runs = hwpxInlineToRuns(h1, fmt, state, styles);
            return hwpxParagraph(state, pp, prefix + runs);
        }

        /**
         * ㅁ 수준(과제 제목) 마커 — 번호 박스 「1」「2」… + 남색 굵은 고딕 본문
         */
        function hwpxGovLevel0(state, styles) {
            state.govNumber = (state.govNumber || 0) + 1;
            return {
                marker: String(state.govNumber),
                markerFmt: { gov: true, size: HWPX_GOV.sz.numBox, font: HWPX_GOV.fonts.head, bold: true, shadeBf: styles.bfGovNumBox },
                fmt: { gov: true, size: HWPX_GOV.sz.h0, font: HWPX_GOV.fonts.head, bold: true, color: HWPX_GOV.colors.title }
            };
        }

        /**
         * ㅇ·- 줄의 본문 서식 — 괄호 부연은 작은 글자(fmt.paren), 줄머리 (라벨)은 굵게
         */
        function hwpxGovBodyFmt(level) {
            return { gov: true, size: HWPX_GOV.sz.body, font: HWPX_GOV.fonts.body, paren: true };
        }
        function hwpxGovLabelFmt(level) {
            return level <= 1
                ? { gov: true, size: HWPX_GOV.sz.body, font: HWPX_GOV.fonts.head, bold: true, color: HWPX_GOV.colors.label }
                : { gov: true, size: HWPX_GOV.sz.body, font: HWPX_GOV.fonts.body, bold: true };
        }

        /**
         * 본문 문자열을 런으로 — 괄호 부연 (…)은 굵기 없이 작은 글자
         */
        function hwpxGovParenRuns(text, fmt, styles) {
            if (!fmt.paren || fmt.bold) return hwpxTextRun(text, hwpxCharIdFor(styles, fmt));
            const small = hwpxCharIdFor(styles, Object.assign({}, fmt, { size: HWPX_GOV.sz.paren, bold: false }));
            const normal = hwpxCharIdFor(styles, fmt);
            let runs = '', last = 0, m;
            const re = new RegExp(HWPX_GOV.parenRe.source, 'g');
            while ((m = re.exec(text)) !== null) {
                if (m.index > last) runs += hwpxTextRun(text.slice(last, m.index), normal);
                runs += hwpxTextRun(m[0], small);
                last = re.lastIndex;
            }
            if (last < text.length) runs += hwpxTextRun(text.slice(last), normal);
            return runs;
        }

        /**
         * 줄머리 (라벨) 분리 — 라벨 런 + 나머지 문자열
         */
        function hwpxGovSplitLabel(text, labelFmt, styles) {
            const m = HWPX_GOV.labelRe.exec(text);
            if (!m || !labelFmt) return { runs: '', rest: text };
            return { runs: hwpxTextRun('(' + m[1] + ') ', hwpxCharIdFor(styles, labelFmt)), rest: text.slice(m[0].length) };
        }

        /**
         * 붙임/참고 배너 — 남색 라벨 셀 + 하단 괘선 제목 셀
         */
        function hwpxGovAttachBanner(state, styles, label, titleRuns) {
            const labelWidth = 5200;
            const rowHeight = 2800;
            const ppLabel = styles.paraPr({ align: 'CENTER', ls: 130 });
            const ppTitle = styles.paraPr({ align: 'LEFT', left: 400, ls: 130 });
            const rows = '<hp:tr>'
                + hwpxTableCell(state, styles, {
                    header: false, bf: styles.bfGovAttachLabel,
                    paragraphs: hwpxParagraph(state, ppLabel, hwpxTextRun(label, hwpxCharIdFor(styles, {
                        size: HWPX_GOV.sz.body, font: HWPX_GOV.fonts.head, bold: true, color: '#FFFFFF'
                    }))),
                    col: 0, row: 0, width: labelWidth, height: rowHeight, margin: [200, 200, 220, 220]
                })
                + hwpxTableCell(state, styles, {
                    header: false, bf: styles.bfGovAttachTitle,
                    paragraphs: hwpxParagraph(state, ppTitle, titleRuns),
                    col: 1, row: 0, width: HWPX_CONTENT_WIDTH - labelWidth, height: rowHeight, margin: [200, 200, 220, 220]
                })
                + '</hp:tr>';
            const tbl = hwpxTableShell(state, styles, {
                rowCnt: 1, colCnt: 2, height: rowHeight, outTop: 600, outBottom: 300, rows
            });
            state.govLastLevel = 0;
            const ppWrap = styles.paraPr({ align: 'LEFT', ls: 100 });
            return hwpxParagraph(state, ppWrap, '<hp:run charPrIDRef="1">' + tbl + '</hp:run>');
        }

        /**
         * 마커 걸어쓰기 문단 (마커 런 + 본문 런)
         */
        function hwpxGovMarkerPara(state, styles, opts) {
            let pp = opts.pp;
            if (pp == null) {
                const width = opts.marker
                    ? hwpxMarkerHang(opts.marker, opts.markerFmt.size || HWPX_GOV.sz.body,
                        opts.level === 0 ? HWPX_GOV.sz.h0 : HWPX_GOV.sz.body, !!opts.markerFmt.shadeBf)
                    : opts.width;
                pp = hwpxGovBulletPp(styles, opts.level, width, opts.prev, opts.next, opts.outline);
            }
            let markerRun = '';
            if (opts.marker) {
                // 부호 뒤는 공백 대신 탭 — 자동 탭이 내어쓰기 위치에 서서 둘째 줄과 첫 줄 내용이 맞는다
                const tabFmt = Object.assign({}, opts.markerFmt);
                delete tabFmt.shadeBf;
                markerRun = hwpxTextRun(opts.marker, hwpxCharIdFor(styles, opts.markerFmt))
                    + hwpxTextRun('\t', hwpxCharIdFor(styles, tabFmt));
            }
            return hwpxParagraph(state, pp, markerRun + opts.bodyRuns);
        }

        /**
         * 개조식 본문 문자열 정리 — 범위 물결을 '∼'(U+223C)로 통일
         * ('~100 MWe'처럼 앞이 공백인 「약」 용법은 그대로 둔다)
         */
        function hwpxGovNormalize(text) {
            return hwpxBindSpaces(String(text)
                .replace(HWPX_GOV.rangeTildeRe, '$1 ∼ ')
                .replace(HWPX_GOV.rangeTildeOpenRe, '(∼')
                .replace(HWPX_GOV.rangeTildeEndRe, '$1∼'));
        }

        /**
         * 묶음 빈칸 — 날짜(2026. 9. 23.)·연월·월일·시각 범위·금액 단위(3억 원)·범위 물결(’24 ∼ ’26)의
         * 공백을 U+00A0으로 바꾼다. 한/글 묶음 빈칸(<hp:nbSpace/>)으로 저장되어 줄 끝에서
         * "2026. 1. / 22."처럼 갈라지지 않는다 (보이는 간격은 그대로)
         */
        function hwpxBindSpaces(text) {
            const NB = '\u00A0';
            return String(text)
                .replace(/(\d{4}|['’]\d{2})\. (\d{1,2})\. (\d{1,2})\.(?!\d)/g, '$1.' + NB + '$2.' + NB + '$3.')
                .replace(/(\d{4}|['’]\d{2})\. (\d{1,2})\.(?!\d)/g, '$1.' + NB + '$2.')
                .replace(/(^|[^\d.])(\d{1,2})\. (\d{1,2})\.(?!\d)/g, '$1$2.' + NB + '$3.')
                .replace(/(\d{1,2}:\d{2}) ([~∼-]) (\d{1,2}:\d{2})/g, '$1' + NB + '$2' + NB + '$3')
                .replace(/(\d(?:조|억|만|천)?) 원/g, '$1' + NB + '원')
                .replace(/(\S) ∼ (?=\S)/g, '$1' + NB + '∼' + NB);
        }

        /**
         * 여백 지정 줄 「(5)」·「(6)」·「(2)」 — 해당 pt 크기 글꼴의 빈 문단
         */
        function hwpxGovSpacerPara(state, styles, pt) {
            const cp = hwpxCharIdFor(styles, {
                gov: true, size: Math.min(Math.max(pt, 1), 40) * 100, font: HWPX_GOV.fonts.body
            });
            return hwpxParagraph(state, styles.paraPr({ align: 'LEFT', ls: 100 }),
                '<hp:run charPrIDRef="' + cp + '"><hp:t/></hp:run>');
        }

        /**
         * 평문 줄의 **강조**·***청색 강조***를 런으로 변환
         * (코드블럭 안의 개조식은 마크다운 인라인 파싱을 거치지 않으므로 직접 처리)
         */
        function hwpxGovPlainRuns(text, fmt, styles) {
            const re = /\*\*\*(\S(?:[^*]*\S)?)\*\*\*|\*\*(\S(?:[^*]*\S)?)\*\*/g;
            let runs = '', last = 0, m;
            while ((m = re.exec(text)) !== null) {
                if (m.index > last) {
                    runs += hwpxGovParenRuns(hwpxGovNormalize(text.slice(last, m.index)), fmt, styles);
                }
                const emph = m[1] != null;
                runs += hwpxTextRun(hwpxGovNormalize(emph ? m[1] : m[2]), hwpxCharIdFor(styles,
                    Object.assign({}, fmt, emph ? { bold: true, color: HWPX_GOV.colors.emph } : { bold: true })));
                last = re.lastIndex;
            }
            if (last < text.length) {
                runs += hwpxGovParenRuns(hwpxGovNormalize(text.slice(last)), fmt, styles);
            }
            return runs;
        }

        /**
         * 코드블럭 내용이 개조식 평문인지 판정 — 빈 줄·여백 줄을 뺀 줄의 6할 이상이 마커 줄.
         * 들여쓰지 않은 '-' 줄(YAML 목록 등)은 ㅁ/ㅇ 계층 줄이 함께 있을 때만 마커로 센다
         */
        function hwpxGovLooksLikeOutline(lines) {
            let marked = 0, total = 0, hasLevelLine = false, bareDash = 0;
            lines.forEach(line => {
                const t = line.trim();
                if (t === '' || HWPX_GOV.spacerRe.test(t)) return;
                total++;
                const m = HWPX_GOV.lineRe.exec(line);
                if (!m) return;
                if (m[1] === '-' && !/^[ \t]/.test(line)) { bareDash++; return; }
                if (HWPX_GOV.markers[m[1]] && HWPX_GOV.markers[m[1]][0] <= 1) hasLevelLine = true;
                marked++;
            });
            if (hasLevelLine) marked += bareDash;
            return total > 0 && marked * 10 >= total * 6;
        }

        /**
         * 개조식 평문 한 줄 -> 걸어쓰기 문단
         *  ㅁ(0칸)·ㅇ(1칸)·-(2칸)는 계층, ※·*·**(4칸)는 직전 줄의 보충
         *  빈 줄은 문단 앞 여백으로 대신하고 (5)·(6)·(2) 줄은 그 크기의 빈 문단으로 바꾼다
         */
        function hwpxGovTextLineToXml(line, state, styles) {
            const text = line.replace(/\s+$/, '');
            if (text.trim() === '') return '';
            const mSpacer = HWPX_GOV.spacerRe.exec(text.trim());
            if (mSpacer) return hwpxGovSpacerPara(state, styles, parseInt(mSpacer[1], 10));
            const bodyBase = { gov: true, size: HWPX_GOV.sz.body, font: HWPX_GOV.fonts.body };
            const noteBase = { gov: true, size: HWPX_GOV.sz.note, font: HWPX_GOV.fonts.gothic, color: HWPX_GOV.colors.note };
            const m = HWPX_GOV.lineRe.exec(text);
            if (!m) {
                // 마커 없는 줄 — 직전이 ※ 갈래면 그 본문에, 아니면 앞 줄 수준에 이어 쓰는 본문
                if (state.govLastMarker === '※') {
                    return hwpxGovMarkerPara(state, styles, {
                        marker: '', bodyRuns: hwpxGovPlainRuns(text.trim(), noteBase, styles),
                        pp: hwpxGovNotePp(styles, hwpxGovNoteHang('※'), 0, true)
                    });
                }
                const level = Math.max(state.govLastLevel, 1);
                const pp = styles.paraPr({ align: 'LEFT', left: HWPX_GOV.step * level + hwpxGovLevelHang(level), ls: 160 });
                return hwpxParagraph(state, pp, hwpxGovPlainRuns(text.trim(), hwpxGovBodyFmt(level), styles));
            }
            const marker = m[1];
            const body = text.slice(m[0].length);
            const prevMarker = state.govLastMarker;
            state.govLastMarker = marker;
            if (marker === '※' || marker === '*' || marker === '**') {
                // ※가 연달아 오면(갈래별 줄) 둘째 줄부터는 ※ 없이 앞 줄 본문에 맞춰 이어 쓴다
                const cont = marker === '※' && prevMarker === '※';
                return hwpxGovMarkerPara(state, styles, {
                    marker: cont ? '' : marker, markerFmt: noteBase, bodyRuns: hwpxGovPlainRuns(body, noteBase, styles),
                    pp: hwpxGovNotePp(styles, hwpxGovNoteHang(marker), cont ? 0 : HWPX_GOV.prevNote, cont)
                });
            }
            if ('⇨⇒➡▶►→'.indexOf(marker) >= 0) {
                return hwpxGovMarkerPara(state, styles, {
                    marker, level: Math.min(state.govLastLevel + 1, 3), width: HWPX_GOV.wFull,
                    markerFmt: Object.assign({}, bodyBase, { bold: true, color: HWPX_GOV.colors.emph }),
                    bodyRuns: hwpxGovPlainRuns(body, bodyBase, styles), prev: HWPX_GOV.prevLx
                });
            }
            const level = HWPX_GOV.markers[marker][0];
            const width = HWPX_GOV.markers[marker][1];
            let xml;
            if (level === 0) {
                const l0 = hwpxGovLevel0(state, styles);
                xml = hwpxGovMarkerPara(state, styles, {
                    marker: l0.marker, level, width, markerFmt: l0.markerFmt,
                    bodyRuns: hwpxGovPlainRuns(body, l0.fmt, styles),
                    prev: hwpxGovPrev(level), next: HWPX_GOV.nextL0
                });
            } else {
                const fmt = hwpxGovBodyFmt(level);
                const label = hwpxGovSplitLabel(body, hwpxGovLabelFmt(level), styles);
                xml = hwpxGovMarkerPara(state, styles, {
                    marker, level, width, markerFmt: fmt,
                    bodyRuns: label.runs + hwpxGovPlainRuns(label.rest, fmt, styles),
                    prev: hwpxGovPrev(level), next: 0
                });
            }
            state.govLastLevel = level;
            state.govAutoBase = Math.min(level + 1, 3);
            return xml;
        }

        /**
         * 코드 블록(pre) 변환
         *  - 개조식 평문(ㅁ / ㅇ / - / ※ / * 줄)이면 걸어쓰기 계층으로 펼친다 — 개조식 초안을
         *    코드블럭째 붙여 넣는 작성 방식을 그대로 지원
         *  - 그 밖의 코드는 맑은 고딕 회색, 한 수준 들여쓰기로 원문 유지
         */
        function hwpxGovPreToXml(pre, state, styles) {
            const lines = pre.textContent.replace(/\n+$/, '').split('\n');
            // ```python처럼 언어를 지정한 코드는 개조식으로 해석하지 않는다
            const code = pre.querySelector('code');
            const lang = code && /(?:^|\s)language-([\w-]+)/.exec(code.className || '');
            const isCode = lang && !/^(text|txt|plain|plaintext|md|markdown)$/i.test(lang[1]);
            if (!isCode && hwpxGovLooksLikeOutline(lines)) {
                return lines.map(line => hwpxGovTextLineToXml(line, state, styles)).join('');
            }
            const cp = hwpxCharIdFor(styles, {
                size: HWPX_GOV.sz.note, font: HWPX_GOV.fonts.gothic, color: HWPX_GOV.colors.note
            });
            const pp = styles.paraPr({ align: 'LEFT', left: HWPX_GOV.step + HWPX_GOV.wHalf, ls: 150 });
            return lines.map(line => hwpxParagraph(state, pp, hwpxTextRun(line || ' ', cp))).join('');
        }

        /**
         * 목록(ul/ol)을 개조식 걸어쓰기(ㅁ / ㅇ / - / ·, 번호는 "1.")로 변환
         * (항목이 ㅁ/ㅇ/▸/· 등 정부 마커로 시작하면 그 마커·수준을 보존)
         */
        function hwpxGovListToXml(list, depth, state, styles, ctx) {
            const ordered = list.tagName === 'OL';
            // 마커 없는 목록은 「직전 줄의 다음 수준」에서 시작하고(ㅇ 아래 목록 → -),
            // 한 목록 안의 형제 항목은 모두 같은 수준을 쓴다
            const autoLevel = Math.min(Math.max(state.govAutoBase, 1), HWPX_GOV.autoMarkers.length - 1);
            const auto = HWPX_GOV.autoMarkers[autoLevel];
            let index = ordered ? (parseInt(list.getAttribute('start') || '1', 10) || 1) : 0;
            let xml = '';
            Array.from(list.children).forEach(li => {
                if (li.tagName !== 'LI') return;
                const liText = li.textContent.replace(/^\s+/, '');
                let marker, level, width;
                let markerFmt = null;
                let bodyBase = { gov: true, size: HWPX_GOV.sz.body, font: HWPX_GOV.fonts.body };
                let strip = null;
                const mGov = HWPX_GOV.markerRe.exec(liText);
                const mArrow = HWPX_GOV.arrowRe.exec(liText);
                if (ordered) {
                    marker = index + '.';
                    level = autoLevel;
                    width = HWPX_GOV.wNum;
                } else if (mGov) {
                    marker = mGov[1];
                    level = HWPX_GOV.markers[marker][0];
                    width = HWPX_GOV.markers[marker][1];
                    strip = new RegExp('^\\s*' + marker.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*');
                } else if (mArrow) {
                    marker = mArrow[1];
                    level = Math.min(state.govLastLevel + 1, 3);
                    width = HWPX_GOV.wFull;
                    markerFmt = { gov: true, size: HWPX_GOV.sz.body, font: HWPX_GOV.fonts.body, bold: true, color: HWPX_GOV.colors.emph };
                    strip = new RegExp('^\\s*' + marker + '\\s*');
                } else {
                    marker = auto[0];
                    level = autoLevel;
                    width = auto[1];
                }
                if (level === 0) {
                    const l0 = hwpxGovLevel0(state, styles);
                    marker = l0.marker;
                    markerFmt = l0.markerFmt;
                    bodyBase = l0.fmt;
                } else if (!ordered) {
                    bodyBase = hwpxGovBodyFmt(level);
                    state.govLabelFmt = mArrow ? null : hwpxGovLabelFmt(level);
                }
                if (!markerFmt) markerFmt = bodyBase;
                // 항목 안 둘째 문단은 부호 뒤 본문 시작선에 맞춘다
                width = hwpxMarkerHang(marker, markerFmt.size || HWPX_GOV.sz.body,
                    level === 0 ? HWPX_GOV.sz.h0 : HWPX_GOV.sz.body, !!markerFmt.shadeBf);
                const ppCont = styles.paraPr({
                    align: 'LEFT', left: HWPX_GOV.step * level + width, next: 0, ls: 160
                });
                let firstParagraphDone = false;
                let inlineBuffer = '';
                const flushInline = () => {
                    if (inlineBuffer.trim() === '' && firstParagraphDone) { inlineBuffer = ''; return; }
                    if (!firstParagraphDone) {
                        xml += hwpxGovMarkerPara(state, styles, {
                            marker, level, width, markerFmt, bodyRuns: inlineBuffer,
                            prev: hwpxGovPrev(level), next: level === 0 ? HWPX_GOV.nextL0 : 0
                        });
                        // 하위 목록·※·*는 이 항목의 다음 수준에서 이어진다
                        state.govLastLevel = level;
                        state.govAutoBase = Math.min(level + 1, 3);
                    } else {
                        xml += hwpxParagraph(state, ppCont, inlineBuffer);
                    }
                    inlineBuffer = '';
                    firstParagraphDone = true;
                };
                if (strip) state.stripPrefixRe = strip;
                li.childNodes.forEach(child => {
                    const childTag = child.nodeType === Node.ELEMENT_NODE ? child.tagName : null;
                    if (childTag === 'UL' || childTag === 'OL') {
                        flushInline();
                        xml += hwpxGovListToXml(child, depth + 1, state, styles, ctx);
                    } else if (childTag === 'P') {
                        child.childNodes.forEach(grandchild => {
                            inlineBuffer += hwpxInlineToRuns(grandchild, bodyBase, state, styles);
                        });
                        flushInline();
                    } else if (childTag === 'PRE') {
                        flushInline();
                        xml += hwpxGovPreToXml(child, state, styles);
                    } else if (childTag === 'TABLE') {
                        flushInline();
                        xml += hwpxGovTableToXml(child, state, styles);
                    } else if (childTag === 'BLOCKQUOTE') {
                        flushInline();
                        xml += hwpxGovBlocksToXml(child, state, styles,
                            Object.assign({}, ctx, { quoteDepth: (ctx.quoteDepth || 0) + 1 }));
                    } else {
                        inlineBuffer += hwpxInlineToRuns(child, bodyBase, state, styles);
                    }
                });
                state.stripPrefixRe = null;
                state.govLabelFmt = null;
                if (!firstParagraphDone || inlineBuffer.trim() !== '') flushInline();
                state.govLastLevel = level;
                if (ordered) index++;
            });
            return xml;
        }

        /**
         * 미리보기 블록 요소들을 개조식 본문으로 변환
         */
        function hwpxGovBlocksToXml(parent, state, styles, ctx) {
            ctx = ctx || {};
            let xml = '';
            Array.from(parent.childNodes).forEach(node => {
                if (node.nodeType !== Node.ELEMENT_NODE) return;
                const tag = node.tagName;

                if (tag === 'SECTION' && node.classList.contains('footnotes')) return;
                if (tag === 'FIGURE' && node.classList.contains('md-chart')) { xml += hwpxChartPara(node, state, styles); return; }
                if (tag === 'H1') {
                    xml += hwpxGovTitle(node, state, styles);
                    state.govAfterTitle = true;
                    state.govLastLevel = 1;
                    state.govAutoBase = 1;
                    return;
                }
                // 제목 직후 인용(>)은 우측 부제(일자·부서)로
                if (tag === 'BLOCKQUOTE' && state.govAfterTitle) {
                    state.govAfterTitle = false;
                    const ppSub = styles.paraPr({ align: 'RIGHT', ls: 150 });
                    const subFmt = { gov: true, size: HWPX_GOV.sz.subtitle, font: HWPX_GOV.fonts.gothic, color: HWPX_GOV.colors.note };
                    Array.from(node.children).forEach(child => {
                        xml += hwpxParagraph(state, ppSub, hwpxInlineToRuns(child, subFmt, state, styles));
                    });
                    return;
                }
                state.govAfterTitle = false;

                if (/^H[2-6]$/.test(tag)) {
                    const text = node.textContent.trim();
                    // 붙임/참고 헤딩은 배너로
                    const mAttach = HWPX_GOV.attachRe.exec(text);
                    if (tag === 'H2' && mAttach) {
                        state.stripPrefixRe = /^\s*(붙임|참고|별첨|별지)\s*\d*\s*/;
                        const titleRuns = hwpxInlineToRuns(node, {
                            gov: true, size: HWPX_GOV.sz.attach, font: HWPX_GOV.fonts.head, bold: true
                        }, state, styles);
                        state.stripPrefixRe = null;
                        xml += hwpxGovAttachBanner(state, styles, (mAttach[1] + mAttach[2]).trim(), titleRuns);
                        return;
                    }
                    // H2=ㅁ 16pt, H3=ㅇ 15pt, H4=- 14pt, H5=· 13.5pt, H6=◦ 13pt
                    const spec = {
                        H2: ['ㅁ', 0, HWPX_GOV.sz.h0, HWPX_GOV.wFull],
                        H3: ['ㅇ', 1, HWPX_GOV.sz.body, HWPX_GOV.wFull],
                        H4: ['-', 2, HWPX_GOV.sz.body - 100, HWPX_GOV.wHalf],
                        H5: ['·', 3, HWPX_GOV.sz.body - 150, HWPX_GOV.wHalf],
                        H6: ['◦', 3, HWPX_GOV.sz.note, HWPX_GOV.wFull]
                    }[tag];
                    // 작성자가 마커를 직접 썼으면 제거 후 표준 마커 적용
                    state.stripPrefixRe = HWPX_GOV.markerStripRe;
                    let marker = spec[0];
                    let fmt = { gov: true, size: spec[2], font: HWPX_GOV.fonts.head, bold: true };
                    let markerFmt = fmt;
                    if (spec[1] === 0) {
                        const l0 = hwpxGovLevel0(state, styles);
                        marker = l0.marker; markerFmt = l0.markerFmt; fmt = l0.fmt;
                    } else {
                        fmt = Object.assign(hwpxGovBodyFmt(spec[1]), { size: spec[2] });
                        markerFmt = fmt;
                        state.govLabelFmt = hwpxGovLabelFmt(spec[1]);
                    }
                    const bodyRuns = hwpxInlineToRuns(node, fmt, state, styles);
                    state.stripPrefixRe = null;
                    state.govLabelFmt = null;
                    xml += hwpxGovMarkerPara(state, styles, {
                        marker, level: spec[1], width: spec[3], markerFmt, bodyRuns,
                        prev: hwpxGovPrev(spec[1]), next: spec[1] === 0 ? HWPX_GOV.nextL0 : 0,
                        outline: parseInt(tag[1], 10) - 1
                    });
                    state.govLastLevel = spec[1];
                    state.govAutoBase = Math.min(spec[1] + 1, 3);
                    return;
                }

                switch (tag) {
                    case 'P': {
                        if (isEmptyParagraph(node)) break;
                        const text = node.textContent.trim();
                        const bodyBase = { gov: true, size: HWPX_GOV.sz.body, font: HWPX_GOV.fonts.body };
                        const noteBase = { gov: true, size: HWPX_GOV.sz.note, font: HWPX_GOV.fonts.gothic, color: HWPX_GOV.colors.note };
                        if (text === '' && node.querySelector('img')) {
                            const ppImg = styles.paraPr({ align: 'CENTER', prev: 300, next: 300, ls: 100 });
                            node.querySelectorAll('img').forEach(img => {
                                xml += hwpxParagraph(state, ppImg, hwpxPicRun(img, state, styles));
                            });
                            break;
                        }
                        // (5)·(6)·(2) 여백 지정 줄
                        const mSpacer = HWPX_GOV.spacerRe.exec(text);
                        if (mSpacer) {
                            xml += hwpxGovSpacerPara(state, styles, parseInt(mSpacer[1], 10));
                            break;
                        }
                        const mBracket = HWPX_GOV.attachBracketRe.exec(text);
                        if (mBracket) {
                            state.stripPrefixRe = /^\s*\[(붙임|참고|별첨|별지)\s*\d*\]\s*/;
                            const titleRuns = hwpxInlineToRuns(node, {
                                gov: true, size: HWPX_GOV.sz.attach, font: HWPX_GOV.fonts.head, bold: true
                            }, state, styles);
                            state.stripPrefixRe = null;
                            xml += hwpxGovAttachBanner(state, styles, (mBracket[1] + mBracket[2]).trim(), titleRuns);
                            break;
                        }
                        if (/^※/.test(text)) {
                            state.stripPrefixRe = /^\s*※\s*/;
                            const bodyRuns = hwpxInlineToRuns(node, noteBase, state, styles);
                            state.stripPrefixRe = null;
                            // ※가 연달아 오면(갈래별 줄) 둘째 줄부터는 ※ 없이 앞 줄 본문에 맞춰 이어 쓴다
                            const cont = state.govLastMarker === '※';
                            state.govLastMarker = '※';
                            xml += hwpxGovMarkerPara(state, styles, {
                                marker: cont ? '' : '※', markerFmt: noteBase, bodyRuns,
                                pp: hwpxGovNotePp(styles, hwpxGovNoteHang('※'), cont ? 0 : HWPX_GOV.prevNote, cont)
                            });
                            break;
                        }
                        state.govLastMarker = null;
                        const mArrow = HWPX_GOV.arrowRe.exec(text);
                        if (mArrow) {
                            state.stripPrefixRe = new RegExp('^\\s*' + mArrow[1] + '\\s*');
                            const bodyRuns = hwpxInlineToRuns(node, bodyBase, state, styles);
                            state.stripPrefixRe = null;
                            xml += hwpxGovMarkerPara(state, styles, {
                                marker: mArrow[1], level: Math.min(state.govLastLevel + 1, 3), width: HWPX_GOV.wFull,
                                markerFmt: Object.assign({}, bodyBase, { bold: true, color: HWPX_GOV.colors.emph }),
                                bodyRuns, prev: HWPX_GOV.prevLx
                            });
                            break;
                        }
                        const mGov = HWPX_GOV.markerRe.exec(text);
                        if (mGov) {
                            const marker = mGov[1];
                            const level = HWPX_GOV.markers[marker][0];
                            const width = HWPX_GOV.markers[marker][1];
                            const l0 = level === 0 ? hwpxGovLevel0(state, styles) : null;
                            const base = l0 ? l0.fmt : hwpxGovBodyFmt(level);
                            state.stripPrefixRe = new RegExp('^\\s*' + marker.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*');
                            state.govLabelFmt = l0 ? null : hwpxGovLabelFmt(level);
                            const bodyRuns = hwpxInlineToRuns(node, base, state, styles);
                            state.stripPrefixRe = null;
                            state.govLabelFmt = null;
                            xml += hwpxGovMarkerPara(state, styles, {
                                marker: l0 ? l0.marker : marker, level, width, markerFmt: l0 ? l0.markerFmt : base, bodyRuns,
                                prev: hwpxGovPrev(level), next: level === 0 ? HWPX_GOV.nextL0 : 0
                            });
                            state.govLastLevel = level;
                            state.govAutoBase = Math.min(level + 1, 3);
                            break;
                        }
                        // * / ** 각주 줄 — 본문 용어 뒤 표시와 같은 순서로 붙는 보충
                        const mNote = /^(\*\*|\*)\s/.exec(text);
                        if (mNote) {
                            state.stripPrefixRe = mNote[1] === '**' ? /^\s*\*\*\s*/ : /^\s*\*\s*/;
                            const bodyRuns = hwpxInlineToRuns(node, noteBase, state, styles);
                            state.stripPrefixRe = null;
                            xml += hwpxGovMarkerPara(state, styles, {
                                marker: mNote[1], markerFmt: noteBase, bodyRuns,
                                pp: hwpxGovNotePp(styles, hwpxGovNoteHang(mNote[1]), HWPX_GOV.prevNote)
                            });
                            break;
                        }
                        if (ctx.quoteDepth > 0) {
                            const pp = styles.paraPr({
                                align: 'LEFT', left: HWPX_GOV.step + HWPX_GOV.wHalf, ls: 160
                            });
                            xml += hwpxParagraph(state, pp,
                                hwpxInlineToRuns(node, Object.assign({}, bodyBase, { italic: true }), state, styles));
                            break;
                        }
                        const pp = styles.paraPr({ align: 'JUSTIFY', ls: 160 });
                        let runs = '';
                        node.childNodes.forEach(child => { runs += hwpxInlineToRuns(child, bodyBase, state, styles); });
                        xml += hwpxParagraph(state, pp, runs);
                        state.govLastLevel = 1;
                        break;
                    }
                    case 'UL': case 'OL':
                        xml += hwpxGovListToXml(node, 0, state, styles, ctx);
                        break;
                    case 'BLOCKQUOTE':
                        xml += hwpxGovBlocksToXml(node, state, styles,
                            Object.assign({}, ctx, { quoteDepth: (ctx.quoteDepth || 0) + 1 }));
                        break;
                    case 'PRE':
                        xml += hwpxGovPreToXml(node, state, styles);
                        break;
                    case 'TABLE':
                        xml += hwpxGovTableToXml(node, state, styles);
                        break;
                    case 'HR':
                        xml += hwpxParagraph(state, styles.paraPr({ align: 'JUSTIFY', ls: 160 }), '');
                        break;
                    default:
                        if (node.querySelector && node.querySelector('p, ul, ol, table, pre, blockquote, h1, h2, h3, h4, h5, h6')) {
                            xml += hwpxGovBlocksToXml(node, state, styles, ctx);
                        } else {
                            let runs = '';
                            node.childNodes.forEach(child => {
                                runs += hwpxInlineToRuns(child, { gov: true, size: HWPX_GOV.sz.body, font: HWPX_GOV.fonts.body }, state, styles);
                            });
                            if (node.classList && node.classList.contains('katex')) {
                                runs = hwpxInlineToRuns(node, { gov: true, size: HWPX_GOV.sz.body, font: HWPX_GOV.fonts.body }, state, styles);
                            }
                            if (runs !== '') {
                                const isMathBlock = node.classList
                                    && (node.classList.contains('katex-display') || !!node.querySelector('.katex-display'));
                                xml += hwpxParagraph(state,
                                    styles.paraPr({ align: isMathBlock ? 'CENTER' : 'JUSTIFY', ls: 160 }), runs);
                            }
                        }
                }
            });
            return xml;
        }

        /**
         * 헤더(header.xml) 생성 — 한/글 기본 템플릿 서식 + 발간물 사용자 서식
         */
        function hwpxHeaderXml(styles) {
            // 글꼴 목록 (7개 언어축 × 3개 글꼴, id 2 = 맑은 고딕)
            const typeInfo = '<hh:typeInfo familyType="FCAT_GOTHIC" weight="6" proportion="4" contrast="0"'

            const fontfaces = '<hh:fontfaces itemCnt="7">'

            // 기본 테두리 2종 (한/글 템플릿과 동일: 1=없음, 2=없음+투명 배경)
            const noneSides = ['leftBorder', 'rightBorder', 'topBorder', 'bottomBorder']

            const baseBorderFills = '<hh:borderFill id="1" threeD="0" shadow="0" centerLine="NONE" breakCellSeparateLine="0">'

            const borderFills = '<hh:borderFills itemCnt="' + (2 + styles.custom.borderFill.length) + '">'

            // 기본 글자 모양 7종 (한/글 템플릿과 동일) + 사용자 글자 모양
            const baseCharPrs = [

            // 개요 번호 모양 — 번호 서식 텍스트를 비워 둔다. 제목 문단을 개요(OUTLINE)로 표시해
            // 「문서 찾아가기」·차례에 잡히게 하되 화면에 "1." 같은 개요 번호가 붙지 않게 한다
            const numberings = '<hh:numberings itemCnt="1"><hh:numbering id="1" start="0">'

            // 기본 문단 모양 20종 (한/글 템플릿과 동일한 표) + 사용자 문단 모양
            const J = 'JUSTIFY', L = 'LEFT', K = 'KEEP_WORD', B = 'BREAK_WORD';
