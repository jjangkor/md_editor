<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJANG's MD Editor</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Marked.js for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>

    <!-- DOMPurify for sanitizing rendered Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"
            integrity="sha384-JEyTNhjM6R1ElGoJns4U2Ln4ofPcqzSsynQkmEc/KGy6336qAZl70tDLufbkla+3"
            crossorigin="anonymous"></script>

    <!-- html2pdf.js for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"
            integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
          integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV"
          crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
            integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8"
            crossorigin="anonymous"></script>

    <style>
        /* 전체 레이아웃을 위한 기본 스타일 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        /* 에디터 textarea 스타일 */
        #editor {
            resize: none;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            overflow-y: auto;
        }

        #editor:focus {
            outline: none;
        }

        /* 프리뷰 영역 스크롤 */
        #preview {
            overflow-y: auto;
        }

        /* Tailwind Typography 플러그인 스타일을 CDN으로 불러오기 위한 대체 */
        .prose {
            max-width: 100%;
            color: #374151;
        }

        .prose h1 {
            font-size: 2.25em;
            margin-top: 0;
            margin-bottom: 0.8888889em;
            line-height: 1.1111111;
            font-weight: 800;
        }

        .prose h2 {
            font-size: 1.5em;
            margin-top: 2em;
            margin-bottom: 1em;
            line-height: 1.3333333;
            font-weight: 700;
        }

        .prose h3 {
            font-size: 1.25em;
            margin-top: 1.6em;
            margin-bottom: 0.6em;
            line-height: 1.6;
            font-weight: 600;
        }

        .prose p {
            margin-top: 1.25em;
            margin-bottom: 1.25em;
        }

        .prose ul, .prose ol {
            margin-top: 1.25em;
            margin-bottom: 1.25em;
            padding-left: 1.625em;
        }

        /* 불릿 리스트 스타일: 1단계 □, 2단계 ○, 3단계 ● */
        .prose ul {
            list-style-type: square;
        }

        .prose ul > li {
            display: list-item;
            margin-top: 0.5em;
            margin-bottom: 0.5em;
        }

        .prose ul ul {
            list-style-type: circle;
            margin-top: 0.5em;
            margin-bottom: 0.5em;
        }

        .prose ul ul ul {
            list-style-type: disc;
        }

        /* 순서 리스트: 계층적 번호 (1, 1.1, 1.1.1) */
        .prose ol {
            counter-reset: item;
            list-style-type: none;
            padding-left: 0;
        }

        .prose ol > li {
            counter-increment: item;
            margin-top: 0.5em;
            margin-bottom: 0.5em;
            padding-left: 2.5em;
            position: relative;
        }

        .prose ol > li::before {
            content: counters(item, ".") ". ";
            position: absolute;
            left: 0;
            width: 2.5em;
            text-align: left;
            font-weight: 500;
        }

        .prose ol ol {
            margin-top: 0.5em;
            margin-bottom: 0.5em;
            padding-left: 0;
        }

        .prose code {
            background-color: #f3f4f6;
            padding: 0.2em 0.4em;
            border-radius: 0.25rem;
            font-size: 0.875em;
            font-family: 'Courier New', monospace;
        }

        .prose pre {
            background-color: #1f2937;
            color: #f9fafb;
            overflow-x: auto;
            padding: 1em;
            border-radius: 0.375rem;
            margin-top: 1.7142857em;
            margin-bottom: 1.7142857em;
        }

        .prose pre code {
            background-color: transparent;
            padding: 0;
            color: inherit;
            font-size: inherit;
        }

        .prose blockquote {
            font-weight: 500;
            font-style: italic;
            color: #111827;
            border-left-width: 0.25rem;
            border-left-color: #e5e7eb;
            quotes: "\201C""\201D""\2018""\2019";
            margin-top: 1.6em;
            margin-bottom: 1.6em;
            padding-left: 1em;
        }

        .prose strong {
            font-weight: 600;
        }

        .prose em {
            font-style: italic;
        }

        .prose del,
        .prose s {
            text-decoration: line-through;
        }

        /* 버튼 호버 효과 */
        .btn-toolbar:hover {
            background-color: #e5e7eb;
        }

        .btn-toolbar:active {
            background-color: #d1d5db;
        }

        /* 로딩 인디케이터 */
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        /* 리사이저 스타일 */
        .resizer,
        .toc-resizer {
            width: 5px;
            background-color: #d1d5db;
            cursor: col-resize;
            position: relative;
            flex-shrink: 0;
            touch-action: none;
        }

        .resizer:hover,
        .toc-resizer:hover {
            background-color: #9ca3af;
        }

        .resizer:active,
        .toc-resizer:active {
            background-color: #6b7280;
        }

        .toc-resizer {
            display: none;
        }

        /* 비활성화된 버튼 스타일 */
        .btn-toolbar:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-toolbar:disabled:hover {
            background-color: transparent;
        }

        /* 드래그 앤 드롭 스타일 */
        .drag-over {
            background-color: #e0f2fe !important;
            border: 2px dashed #0284c7 !important;
        }

        /* 파일 입력 숨김 */
        #fileInput {
            display: none;
        }

        /* 파일명 표시 */
        .filename-display {
            font-size: 0.875rem;
            color: #d1d5db;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 수식 스타일 */
        .math-block {
            margin: 1em 0;
            overflow-x: auto;
            text-align: center;
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .math-inline {
            display: inline;
        }

        /* 테이블 스타일 (PDF 호환) */
        .prose table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
        }

        .prose th, .prose td {
            border: 1px solid #d1d5db;
            padding: 0.5em 1em;
            text-align: left;
        }

        .prose th {
            background-color: #f3f4f6;
            font-weight: 600;
        }

        /* 코드 블록 페이지 분할 방지 */
        .prose pre {
            page-break-inside: avoid;
            break-inside: avoid;
        }

        /* PDF 페이지 나누기 방지 - 텍스트 요소 */
        .prose p,
        .prose li,
        .prose h1,
        .prose h2,
        .prose h3,
        .prose h4,
        .prose h5,
        .prose h6,
        .prose blockquote,
        .prose table {
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .prose ul,
        .prose ol {
            page-break-inside: auto;
        }

        #editorPanel,
        #previewPanel {
            min-width: 0;
            min-height: 0;
        }

        @media (max-width: 767px) {
            .editor-workspace {
                flex-direction: column;
            }

            #editorPanel,
            #previewPanel {
                flex: 1 1 50% !important;
                width: 100%;
            }

            .resizer,
            .toc-resizer {
                width: 100%;
                height: 6px;
                cursor: row-resize;
            }

            #tocPanel {
                width: 100% !important;
                max-height: 50%;
                border-left: 0;
                border-top: 1px solid #d1d5db;
            }
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- 전체 컨테이너: 100vh 고정 레이아웃 -->
    <div class="h-screen flex flex-col">

        <!-- 헤더 -->
        <header class="bg-gray-800 text-white px-3 py-2 md:px-6 md:py-4 flex flex-wrap items-center gap-3 justify-between shadow-lg">
            <div class="flex items-center space-x-4">
                <i class="fas fa-markdown text-3xl"></i>
                <div>
                    <h1 class="text-lg md:text-2xl font-bold">JJANG's MD Editor</h1>
                    <div id="filenameDisplay" class="filename-display">untitled.md</div>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-2 md:gap-3">
                <input type="file" id="fileInput" accept=".md,.markdown,.txt" />
                <button id="openFileBtn"
                        class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg font-semibold transition-colors flex items-center space-x-2"
                        title="마크다운 파일 열기">
                    <i class="fas fa-folder-open"></i>
                    <span>파일 열기</span>
                </button>
                <button id="saveMarkdownBtn"
                        class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg font-semibold transition-colors flex items-center space-x-2"
                        title="마크다운 파일로 저장">
                    <i class="fas fa-save"></i>
                    <span>MD 저장</span>
                </button>
                <button id="exportPdfBtn"
                        class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg font-semibold transition-colors flex items-center space-x-2"
                        title="PDF로 내보내기">
                    <i class="fas fa-file-pdf"></i>
                    <span>PDF</span>
                </button>
                <button id="exportWordBtn"
                        class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg font-semibold transition-colors flex items-center space-x-2"
                        title="Word(.docx)로 내보내기">
                    <i class="fas fa-file-word"></i>
                    <span>Word</span>
                </button>
                <button id="exportHwpxBtn"
                        class="bg-orange-600 hover:bg-orange-700 px-4 py-2 rounded-lg font-semibold transition-colors flex items-center space-x-2"
                        title="한글(.hwpx)로 내보내기 — 발간물(책자) 서식">
                    <i class="fas fa-file-lines"></i>
                    <span>한글</span>
                </button>
            </div>
        </header>

        <!-- 툴바 -->
        <div class="bg-gray-200 px-3 md:px-6 py-2 md:py-3 flex items-center space-x-2 border-b border-gray-300 overflow-x-auto flex-shrink-0">
            <button id="undoBtn" class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    title="되돌리기 (Ctrl+Z)"
                    disabled>
                <i class="fas fa-undo"></i>
            </button>
            <button id="redoBtn" class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    title="다시실행 (Ctrl+Y)"
                    disabled>
                <i class="fas fa-redo"></i>
            </button>
            <div class="w-px h-6 bg-gray-400"></div>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="bold"
                    title="굵게 (Ctrl+B)">
                <i class="fas fa-bold"></i>
            </button>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="italic"
                    title="기울임 (Ctrl+I)">
                <i class="fas fa-italic"></i>
            </button>
            <div class="w-px h-6 bg-gray-400"></div>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="h1"
                    title="제목 1">
                <i class="fas fa-heading"></i><span class="text-xs ml-1">1</span>
            </button>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="h2"
                    title="제목 2">
                <i class="fas fa-heading"></i><span class="text-xs ml-1">2</span>
            </button>
            <div class="w-px h-6 bg-gray-400"></div>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="ul"
                    title="순서 없는 목록">
                <i class="fas fa-list-ul"></i>
            </button>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="ol"
                    title="순서 있는 목록">
                <i class="fas fa-list-ol"></i>
            </button>
            <div class="w-px h-6 bg-gray-400"></div>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="code"
                    title="코드 블록">
                <i class="fas fa-code"></i>
            </button>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="quote"
                    title="인용구">
                <i class="fas fa-quote-left"></i>
            </button>
            <div class="w-px h-6 bg-gray-400"></div>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="toc"
                    title="목차 삽입">
                <i class="fas fa-list-alt"></i>
            </button>
            <div class="w-px h-6 bg-gray-400"></div>
            <button class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    data-action="math"
                    title="수식 삽입">
                <i class="fas fa-square-root-alt"></i>
            </button>
            <div class="w-px h-6 bg-gray-400"></div>
            <button id="findBtn" class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    title="찾기 (Ctrl+F)">
                <i class="fas fa-search"></i>
            </button>
            <button id="replaceBtn" class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    title="찾아 바꾸기 (Ctrl+H)">
                <i class="fas fa-exchange-alt"></i>
            </button>
            <div class="w-px h-6 bg-gray-400"></div>
            <button id="toggleTocBtn" class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors"
                    title="목차 패널 표시/숨김">
                <i class="fas fa-bars"></i>
                <span class="ml-1 text-xs">TOC</span>
            </button>
            <button id="toggleSyncBtn" class="btn-toolbar px-3 py-2 rounded hover:bg-gray-300 transition-colors bg-green-100"
                    title="스크롤 동기화 ON/OFF">
                <i class="fas fa-link"></i>
                <span class="ml-1 text-xs">Sync</span>
            </button>
        </div>

        <!-- 찾기/바꾸기 패널 -->
        <div id="findReplacePanel" class="bg-gray-100 border-b border-gray-300 px-6 py-3" style="display: none;">
            <div class="flex flex-col space-y-2">
                <!-- 찾기 행 -->
                <div class="flex items-center space-x-2">
                    <label class="text-sm text-gray-700 w-16">찾기:</label>
                    <input type="text" id="findInput"
                           class="flex-1 px-3 py-1.5 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="검색어 입력">
                    <button id="findPrevBtn" class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 rounded transition-colors"
                            title="이전 찾기">
                        <i class="fas fa-chevron-up"></i>
                    </button>
                    <button id="findNextBtn" class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 rounded transition-colors"
                            title="다음 찾기">
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <span id="findCount" class="text-sm text-gray-600 min-w-[80px]">0개 찾음</span>
                    <button id="closeFindBtn" class="px-2 py-1.5 text-gray-500 hover:text-gray-700 transition-colors"
                            title="닫기">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <!-- 바꾸기 행 -->
                <div id="replaceRow" class="flex items-center space-x-2" style="display: none;">
                    <label class="text-sm text-gray-700 w-16">바꾸기:</label>
                    <input type="text" id="replaceInput"
                           class="flex-1 px-3 py-1.5 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="바꿀 내용 입력">
                    <button id="replaceOneBtn" class="px-3 py-1.5 bg-blue-500 hover:bg-blue-600 text-white rounded transition-colors"
                            title="바꾸기">
                        바꾸기
                    </button>
                    <button id="replaceAllBtn" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded transition-colors"
                            title="모두 바꾸기">
                        모두 바꾸기
                    </button>
                    <div class="min-w-[80px]"></div>
                    <div class="px-2 py-1.5"></div>
                </div>
            </div>
        </div>

        <!-- 메인 영역: 크기 조절 가능한 분할 -->
        <main class="editor-workspace flex-1 flex overflow-hidden">
            <!-- 왼쪽: 에디터 영역 -->
            <div id="editorPanel" class="bg-gray-50 flex flex-col" style="flex: 1;">
                <div class="px-4 py-2 bg-gray-100 border-b border-gray-300 font-semibold text-gray-700">
                    <i class="fas fa-edit mr-2"></i>Editor
                </div>
                <textarea id="editor"
                          class="flex-1 w-full p-6 bg-gray-50 text-gray-800 border-none"
                          placeholder="여기에 마크다운을 입력하세요..."
                          spellcheck="false"></textarea>
            </div>

            <!-- 리사이저 -->
            <div id="resizer" class="resizer"
                 role="separator"
                 aria-label="에디터와 미리보기 크기 조절"
                 aria-orientation="vertical"
                 tabindex="0"></div>

            <!-- 오른쪽: 프리뷰 영역 -->
            <div id="previewPanel" class="bg-white flex flex-col" style="flex: 1;">
                <div class="px-4 py-2 bg-gray-100 border-b border-gray-300 font-semibold text-gray-700">
                    <i class="fas fa-eye mr-2"></i>Preview
                </div>
                <div id="preview"
                     class="flex-1 p-6 prose overflow-y-auto">
                    <!-- 마크다운 프리뷰가 여기에 렌더링됩니다 -->
                </div>
            </div>

            <!-- 목차 패널 리사이저 -->
            <div id="tocResizer" class="toc-resizer"
                 role="separator"
                 aria-label="미리보기와 목차 크기 조절"
                 aria-orientation="vertical"
                 tabindex="0"></div>

            <!-- 목차 패널 (기본 숨김) -->
            <div id="tocPanel" class="bg-gray-50 border-l border-gray-300" style="width: 250px; display: none; flex: 0 0 250px; flex-direction: column;">
                <div class="px-4 py-2 bg-gray-100 border-b border-gray-300 font-semibold text-gray-700">
                    <i class="fas fa-list mr-2"></i>목차 (TOC)
                </div>
                <div id="tocContent" class="flex-1 p-4 overflow-y-auto text-sm">
                    <!-- 목차 리스트가 여기에 렌더링됩니다 -->
                    <p class="text-gray-500 text-xs">헤딩이 있는 문서를 작성하면 목차가 자동으로 생성됩니다.</p>
                </div>
            </div>
        </main>

    </div>

    <script>
        /**
         * JJANG's MD Editor
         * 모든 기능이 포함된 단일 파일 마크다운 에디터
         */

        // DOM 요소 참조
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const exportPdfBtn = document.getElementById('exportPdfBtn');
        const exportWordBtn = document.getElementById('exportWordBtn');
        const exportHwpxBtn = document.getElementById('exportHwpxBtn');

        const toolbarButtons = document.querySelectorAll('.btn-toolbar');
        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');
        const resizer = document.getElementById('resizer');
        const editorPanel = document.getElementById('editorPanel');
        const previewPanel = document.getElementById('previewPanel');
        const fileInput = document.getElementById('fileInput');
        const openFileBtn = document.getElementById('openFileBtn');
        const saveMarkdownBtn = document.getElementById('saveMarkdownBtn');
        const filenameDisplay = document.getElementById('filenameDisplay');
        const tocPanel = document.getElementById('tocPanel');
        const tocResizer = document.getElementById('tocResizer');

        /**
         * 히스토리에 현재 상태 저장
         */
        function saveToHistory() {
            if (isRestoringState) return;

            const currentState = {
                text: editor.value,
                selectionStart: editor.selectionStart,
                selectionEnd: editor.selectionEnd
            };

            // 현재 인덱스 이후의 히스토리 제거
            history = history.slice(0, historyIndex + 1);

            // 새로운 상태 추가
            history.push(currentState);
            historyIndex++;

            // 히스토리 크기 제한 (최대 100개)
            if (history.length > 100) {
                history.shift();
                historyIndex--;
            }

            updateUndoRedoButtons();
        }

        /**

            redoBtn.disabled = historyIndex >= history.length - 1;

        /**

                historyIndex--;
                restoreState(history[historyIndex]);

        }

        /**

        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                restoreState(history[historyIndex]);
            }
        }

        /**

            editor.selectionEnd = state.selectionEnd;

        /**

        /**
         * 목차(TOC) 생성
         * 코드 블록 내부의 TOC 주석과 헤딩은 무시
         */
        function generateTOC(markdownText) {
            // 코드 블록을 먼저 플레이스홀더로 치환
            const codeBlocks = [];
            let codeBlockIndex = 0;
            let textWithoutCode = markdownText;

            // 백틱 코드 블록 추출 (```...```)
            textWithoutCode = textWithoutCode.replace(/```[\s\S]*?```/g, (match) => {
                const placeholder = `___TOC_CODE_BLOCK_${codeBlockIndex}___`;
                codeBlocks.push({ placeholder, content: match });
                codeBlockIndex++;
                return placeholder;
            });

            // 인라인 코드 추출 (`...`)
            textWithoutCode = textWithoutCode.replace(/`[^`\n]+?`/g, (match) => {
                const placeholder = `___TOC_INLINE_CODE_${codeBlockIndex}___`;
                codeBlocks.push({ placeholder, content: match });
                codeBlockIndex++;
                return placeholder;
            });

            // 코드 블록이 제거된 텍스트에서 TOC 주석 찾기
            const tocRegex = /<!--\s*TOC\s*-->([\s\S]*?)<!--\s*\/TOC\s*-->/i;

            // TOC 주석이 없으면 코드 블록 복원 후 반환
            if (!tocRegex.test(textWithoutCode)) {
                // 코드 블록 복원
                codeBlocks.forEach(({ placeholder, content }) => {
                    textWithoutCode = textWithoutCode.replace(placeholder, content);
                });
                return textWithoutCode;
            }

            // 헤딩 추출 (코드 블록이 제거된 텍스트에서)
            const headings = [];
            const lines = textWithoutCode.split('\n');

            lines.forEach((line, index) => {
                const headingMatch = line.match(/^(#{1,6})\s+(.+)$/);
                if (headingMatch) {
                    const level = headingMatch[1].length;
                    const text = headingMatch[2].trim();
                    const id = `heading-${headings.length}`;

                    headings.push({ level, text, id });
                }
            });

            // TOC HTML 생성
            let tocHtml = '\n';
            headings.forEach(heading => {
                const indent = '  '.repeat(heading.level - 1);
                tocHtml += `${indent}- [${heading.text}](#${heading.id})\n`;
            });

            // TOC 주석 사이에 목차 삽입 (코드 블록이 제거된 텍스트에서)
            let result = textWithoutCode.replace(tocRegex, `<!-- TOC -->${tocHtml}<!-- /TOC -->`);

            // 코드 블록 복원
            codeBlocks.forEach(({ placeholder, content }) => {
                result = result.replace(placeholder, content);
            });

            return result;
        }

        /**
         * 수식 렌더링 (KaTeX)
         * 플레이스홀더 방식으로 처리
         */
        function processMath(markdownText) {
            if (typeof katex === 'undefined') {
                console.warn('⚠️ KaTeX 라이브러리가 로드되지 않았습니다.');
                return { text: markdownText, mathBlocks: [] };
            }

            const originalText = markdownText;
            const mathBlocks = [];
            const codeSegments = [];
            let index = 0;

            try {
                // 코드 블록과 인라인 코드는 수식 처리에서 제외
                markdownText = markdownText.replace(
                    /```[\s\S]*?```|~~~[\s\S]*?~~~|`[^`\n]*`/g,
                    (match) => {
                        const placeholder = `\uE000CODE_SEGMENT_${codeSegments.length}\uE001`;
                        codeSegments.push({ placeholder, content: match });
                        return placeholder;
                    }
                );

                // 블록 수식 추출 및 플레이스홀더로 치환 ($$...$$)
                // 여러 줄 지원
                markdownText = markdownText.replace(/\$\$([\s\S]+?)\$\$/g, (match, math) => {
                    try {
                        const rendered = katex.renderToString(math.trim(), {
                            displayMode: true,
                            throwOnError: false
                        });
                        const placeholder = `<span class="math-placeholder-block" data-math-id="${index}"></span>`;
                        mathBlocks.push({ placeholder, html: rendered, type: 'block', id: index });
                        index++;
                        return placeholder;
                    } catch (e) {
                        console.error('❌ 블록 수식 렌더링 오류:', e);
                        return match;
                    }
                });

                // 인라인 수식 추출 및 플레이스홀더로 치환 (\(...\))
                // 단일 $는 통화 기호로 보존하고 인라인 수식은 명시적 구분자만 허용
                markdownText = markdownText.replace(/\\\(([^\n]+?)\\\)/g, (match, math) => {
                    try {
                        const rendered = katex.renderToString(math.trim(), {
                            displayMode: false,
                            throwOnError: false
                        });
                        const placeholder = `<span class="math-placeholder-inline" data-math-id="${index}"></span>`;
                        mathBlocks.push({ placeholder, html: rendered, type: 'inline', id: index });
                        index++;
                        return placeholder;
                    } catch (e) {
                        console.error('❌ 인라인 수식 렌더링 오류:', e);
                        return match;
                    }
                });

                // 보호했던 코드 영역 복원
                codeSegments.forEach(({ placeholder, content }) => {
                    markdownText = markdownText.split(placeholder).join(content);
                });

                return { text: markdownText, mathBlocks };
            } catch (error) {
                console.error('❌ 수식 렌더링 오류:', error);
                return { text: originalText, mathBlocks: [] };
            }
        }

        /**
         * 플레이스홀더를 실제 렌더링된 수식으로 교체
         */
        function replaceMathPlaceholders(html, mathBlocks) {
            mathBlocks.forEach(({ id, html: mathHtml, type }) => {
                const wrappedHtml = type === 'block'
                    ? `<div class="math-block">${mathHtml}</div>`
                    : `<span class="math-inline">${mathHtml}</span>`;

                // span 플레이스홀더를 찾아서 교체
                const placeholderClass = type === 'block' ? 'math-placeholder-block' : 'math-placeholder-inline';
                const regex = new RegExp(
                    `<span class="${placeholderClass}" data-math-id="${id}"><\\/span>`,
                    'g'
                );
                html = html.replace(regex, wrappedHtml);
            });
            return html;
        }

        /**
         * 실시간 미리보기 업데이트
         */
        function updatePreview() {
            try {
                let markdownText = editor.value;

                // TOC 자동 생성
                markdownText = generateTOC(markdownText);

                // 수식을 플레이스홀더로 치환
                const { text, mathBlocks } = processMath(markdownText);

                // 마크다운 파싱 후 신뢰할 수 없는 HTML과 URL 속성 제거
                let htmlContent = DOMPurify.sanitize(marked.parse(text), {
                    FORBID_TAGS: ['form', 'input', 'button', 'textarea', 'select', 'option', 'style'],
                    FORBID_ATTR: ['style', 'srcdoc']
                });

                // 플레이스홀더를 렌더링된 수식으로 교체
                htmlContent = replaceMathPlaceholders(htmlContent, mathBlocks);

                preview.innerHTML = htmlContent;

                // 새 창 링크의 opener 접근 차단
                preview.querySelectorAll('a[target="_blank"]').forEach(link => {
                    link.rel = 'noopener noreferrer';
                });

                // 목차 업데이트
                updateTOC();

            } catch (error) {
                console.error('❌ 마크다운 파싱 오류:', error);
                preview.innerHTML = '<p class="text-red-600">마크다운 렌더링 중 오류가 발생했습니다.</p>';
            }
        }

        /**
         * 목차(TOC) 업데이트
         */
        function updateTOC() {
            try {
                // 프리뷰에서 모든 헤딩 추출
                const headings = preview.querySelectorAll('h1, h2, h3, h4, h5, h6');
                tocContent.replaceChildren();

                if (headings.length === 0) {
                    const emptyMessage = document.createElement('p');
                    emptyMessage.className = 'text-gray-500 text-xs';
                    emptyMessage.textContent = '헤딩이 있는 문서를 작성하면 목차가 자동으로 생성됩니다.';
                    tocContent.appendChild(emptyMessage);
                    return;
                }

                // 사용자 입력을 HTML 문자열로 재해석하지 않도록 DOM API로 목차 생성
                const tocList = document.createElement('ul');
                tocList.className = 'space-y-1';

                headings.forEach((heading, index) => {
                    const level = parseInt(heading.tagName[1]); // H1 -> 1, H2 -> 2, ...
                    const text = heading.textContent;
                    const id = `heading-${index}`;

                    // 헤딩에 ID 추가 (스크롤 이동용)
                    heading.id = id;

                    // 들여쓰기 레벨
                    const indent = (level - 1) * 12;

                    const listItem = document.createElement('li');
                    listItem.style.marginLeft = `${indent}px`;

                    const link = document.createElement('a');
                    link.href = `#${id}`;
                    link.className = 'toc-link text-gray-700 hover:text-blue-600 hover:underline block py-1';
                    link.dataset.headingId = id;
                    link.textContent = text;

                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const headingId = link.dataset.headingId;
                        const headingElement = document.getElementById(headingId);
                        if (headingElement) {
                            // 스크롤 동기화 임시 해제
                            const wasSyncEnabled = isSyncEnabled;
                            isSyncEnabled = false;

                            // 헤딩 위치로 스크롤
                            headingElement.scrollIntoView({ behavior: 'smooth', block: 'start' });

                            // 1초 후 동기화 복원
                            setTimeout(() => {
                                isSyncEnabled = wasSyncEnabled;
                            }, 1000);
                        }
                    });

                    listItem.appendChild(link);
                    tocList.appendChild(listItem);
                });

                tocContent.appendChild(tocList);
            } catch (error) {
                console.error('❌ 목차 업데이트 오류:', error);
            }
        }

        /**
         * 에디터에 마크다운 문법 삽입
         * @param {string} action - 수행할 액션 (bold, italic, h1, h2, ul, ol, code, quote)
         */
        function insertMarkdown(action) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const selectedText = editor.value.substring(start, end);
            const beforeText = editor.value.substring(0, start);
            const afterText = editor.value.substring(end);

            let newText = '';
            let cursorOffset = 0;

            switch(action) {
                case 'bold':
                    newText = `**${selectedText || '굵은 텍스트'}**`;
                    cursorOffset = selectedText ? newText.length : 2;
                    break;

                case 'italic':
                    newText = `*${selectedText || '기울임 텍스트'}*`;
                    cursorOffset = selectedText ? newText.length : 1;
                    break;

                case 'h1':
                    newText = `# ${selectedText || '제목 1'}`;
                    cursorOffset = newText.length;
                    break;

                case 'h2':
                    newText = `## ${selectedText || '제목 2'}`;
                    cursorOffset = newText.length;
                    break;

                case 'ul':
                    if (selectedText) {
                        const lines = selectedText.split('\n');
                        newText = lines.map(line => `- ${line}`).join('\n');
                    } else {
                        newText = '- 목록 항목';
                    }
                    cursorOffset = newText.length;
                    break;

                case 'ol':
                    if (selectedText) {
                        const lines = selectedText.split('\n');
                        newText = lines.map((line, index) => `${index + 1}. ${line}`).join('\n');
                    } else {
                        newText = '1. 목록 항목';
                    }
                    cursorOffset = newText.length;
                    break;

                case 'code':
                    if (selectedText.includes('\n')) {
                        newText = `\`\`\`\n${selectedText}\n\`\`\``;
                        cursorOffset = newText.length - 4;
                    } else {
                        newText = `\`${selectedText || '코드'}\``;
                        cursorOffset = selectedText ? newText.length : 1;
                    }
                    break;

                case 'quote':
                    if (selectedText) {
                        const lines = selectedText.split('\n');
                        newText = lines.map(line => `> ${line}`).join('\n');
                    } else {
                        newText = '> 인용구';
                    }
                    cursorOffset = newText.length;
                    break;

                case 'toc':
                    newText = '<!-- TOC -->\n자동으로 생성될 위치\n<!-- /TOC -->';
                    cursorOffset = newText.length;
                    break;

                case 'math':
                    if (selectedText) {
                        // 여러 줄이면 블록 수식, 한 줄이면 인라인 수식
                        if (selectedText.includes('\n')) {
                            newText = `$$\n${selectedText}\n$$`;
                        } else {
                            newText = `\\(${selectedText}\\)`;
                        }
                    } else {
                        newText = '\\(E = mc^2\\)';
                    }
                    cursorOffset = selectedText ? newText.length : 1;
                    break;

                default:
                    return;
            }

            // 텍스트 업데이트
            editor.value = beforeText + newText + afterText;

            // 커서 위치 설정
            if (selectedText) {
                editor.selectionStart = editor.selectionEnd = start + cursorOffset;
            } else {
                editor.selectionStart = start + cursorOffset;
                editor.selectionEnd = start + cursorOffset;
            }

            // 포커스 및 미리보기 업데이트
            editor.focus();
            updatePreview();

            // 히스토리에 저장
            saveToHistory();
        }

        /**
         * PDF로 내보내기
         */
        async function exportToPDF() {
            // 원본 스타일 백업
            const originalOverflow = preview.style.overflow;
            const originalHeight = preview.style.height;
            const originalMaxHeight = preview.style.maxHeight;

            try {
                // 로딩 상태 표시
                exportPdfBtn.classList.add('loading');
                exportPdfBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span class="ml-2">생성 중...</span>';

                console.log('📄 PDF 생성 시작...');
                console.log('Preview 내용:', preview.innerHTML.substring(0, 100));

                // preview 요소의 overflow 임시 제거 (전체 콘텐츠 표시)
                preview.style.overflow = 'visible';
                preview.style.height = 'auto';
                preview.style.maxHeight = 'none';

                // DOM 업데이트 대기
                await new Promise(resolve => setTimeout(resolve, 500));

                console.log('Preview 크기:', preview.scrollWidth, 'x', preview.scrollHeight);

                // PDF 생성 옵션
                const opt = {
                    margin: [10, 10, 10, 10],
                    filename: currentFilename.replace(/\.md$/, '.pdf') || 'document.pdf',
                    image: {
                        type: 'jpeg',
                        quality: 0.95
                    },
                    html2canvas: {
                        scale: 2,
                        useCORS: true,
                        logging: true,
                        backgroundColor: '#ffffff',
                        windowHeight: preview.scrollHeight,
                        height: preview.scrollHeight
                    },
                    jsPDF: {
                        unit: 'mm',
                        format: 'a4',
                        orientation: 'portrait'
                    }
                };

                // PDF 생성
                console.log('html2pdf 시작...');
                const pdfBlob = await html2pdf().from(preview).set(opt).outputPdf('blob');

                // File System Access API 지원 시 저장 경로 선택 대화상자 표시
                if (window.showSaveFilePicker) {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: opt.filename,
                        types: [{
                            description: 'PDF Files',
                            accept: { 'application/pdf': ['.pdf'] }
                        }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(pdfBlob);
                    await writable.close();
                } else {
                    // 폴백: 자동 다운로드
                    const url = URL.createObjectURL(pdfBlob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = opt.filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                }

                console.log('✅ PDF 내보내기 완료');

            } catch (error) {
                if (error.name === 'AbortError') return; // 사용자 취소
                console.error('❌ PDF 내보내기 오류:', error);
                console.error('에러 상세:', error.stack);
                alert('PDF 생성 중 오류가 발생했습니다:\n' + error.message);
            } finally {
                // 원본 스타일 복원
                preview.style.overflow = originalOverflow;
                preview.style.height = originalHeight;
                preview.style.maxHeight = originalMaxHeight;

                // 로딩 상태 해제
                exportPdfBtn.classList.remove('loading');
                exportPdfBtn.innerHTML = '<i class="fas fa-file-pdf"></i><span class="ml-2">PDF</span>';
            }
        }

        /**
         * XML 특수문자 이스케이프 (제어문자 제거 포함)
         */
        function docxEscape(text) {
            return String(text)
                .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        /**
         * Word 책갈피 이름으로 사용할 수 있게 앵커 이름 정리
         */
        function docxBookmarkName(name) {
            let safe = String(name).replace(/[^A-Za-z0-9_]/g, '_').slice(0, 40);
            if (!/^[A-Za-z_]/.test(safe)) safe = 'bm_' + safe;
            return safe;
        }

        /**
         * 런 문자 서식(rPr) 생성 — OOXML 스키마의 자식 순서 준수
         */
        function docxRunProps(fmt) {
            let props = '';
            if (fmt.link) props += '<w:rStyle w:val="ac"/>';
            else if (fmt.code) props += '<w:rStyle w:val="VerbatimChar"/>';
            if (fmt.math) props += '<w:rFonts w:ascii="Cambria Math" w:eastAsia="Cambria Math" w:hAnsi="Cambria Math"/>';
            if (fmt.bold) props += '<w:b/><w:bCs/>';
            if (fmt.italic || fmt.math) props += '<w:i/><w:iCs/>';
            if (fmt.strike) props += '<w:strike/>';
            if (fmt.color) props += '<w:color w:val="' + fmt.color + '"/>';
            if (fmt.underline) props += '<w:u w:val="single"/>';
            if (fmt.sup) props += '<w:vertAlign w:val="superscript"/>';
            else if (fmt.sub) props += '<w:vertAlign w:val="subscript"/>';
            return props ? '<w:rPr>' + props + '</w:rPr>' : '';
        }

        /**
         * 텍스트 런 생성 (탭 문자는 <w:tab/>으로 변환)
         */
        function docxMakeRun(text, fmt) {
            if (text === '') return '';
            const props = docxRunProps(fmt || {});
            const parts = String(text).split('\t').map(seg =>
                seg === '' ? '' : '<w:t xml:space="preserve">' + docxEscape(seg) + '</w:t>'
            );
            return '<w:r>' + props + parts.join('<w:tab/>') + '</w:r>';
        }

        /**
         * 단락 속성(pPr) 생성 — OOXML 스키마의 자식 순서 준수
         */
        function docxParaProps(opts) {
            let props = '';
            if (opts.style) props += '<w:pStyle w:val="' + opts.style + '"/>';
            if (opts.numId) props += '<w:numPr><w:ilvl w:val="' + opts.ilvl + '"/><w:numId w:val="' + opts.numId + '"/></w:numPr>';
            if (opts.hr) props += '<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="999999"/></w:pBdr>';
            if (opts.indLeft || opts.indRight) {
                props += '<w:ind';
                if (opts.indLeft) props += ' w:left="' + opts.indLeft + '"';
                if (opts.indRight) props += ' w:right="' + opts.indRight + '"';
                props += '/>';
            }
            if (opts.jc) props += '<w:jc w:val="' + opts.jc + '"/>';
            return props ? '<w:pPr>' + props + '</w:pPr>' : '';
        }

        /**
         * KaTeX 수식 요소에서 원본 TeX 문자열 추출
         */
        function docxTexFromKatex(el) {
            const annotation = el.querySelector('annotation');
            if (annotation) return annotation.textContent;
            const htmlPart = el.querySelector('.katex-html');
            return htmlPart ? htmlPart.textContent : el.textContent;
        }

        /**
         * 미리보기의 인라인 노드를 OOXML 런 목록으로 변환
         */
        function docxInlineToRuns(node, fmt, state) {
            if (node.nodeType === Node.TEXT_NODE) {
                if (node.textContent.trim() === '') {
                    // 블록 요소 사이·요소 가장자리의 공백 노드는 무시
                    const isBlock = el => el && el.nodeType === Node.ELEMENT_NODE
                        && /^(UL|OL|P|PRE|TABLE|BLOCKQUOTE|DIV|LI|H[1-6]|TR|TD|TH)$/.test(el.tagName);
                    const prev = node.previousSibling;
                    const next = node.nextSibling;
                    if (!prev || !next || isBlock(prev) || isBlock(next)) return '';
                    return docxMakeRun(' ', fmt);
                }
                return docxMakeRun(node.textContent.replace(/[ \t\r\n]+/g, ' '), fmt);
            }
            if (node.nodeType !== Node.ELEMENT_NODE) return '';

            const tag = node.tagName;
            if (node.classList.contains('katex-display') || node.classList.contains('katex')) {
                const katexRoot = node.classList.contains('katex') ? node : (node.querySelector('.katex') || node);
                return docxMakeRun(docxTexFromKatex(katexRoot), Object.assign({}, fmt, { math: true }));
            }

            switch (tag) {
                case 'BR':
                    return '<w:r>' + docxRunProps(fmt) + '<w:br/></w:r>';
                case 'STRONG': case 'B':
                    fmt = Object.assign({}, fmt, { bold: true }); break;
                case 'EM': case 'I':
                    fmt = Object.assign({}, fmt, { italic: true }); break;
                case 'DEL': case 'S': case 'STRIKE':
                    fmt = Object.assign({}, fmt, { strike: true }); break;
                case 'U':
                    fmt = Object.assign({}, fmt, { underline: true }); break;
                case 'SUP':
                    fmt = Object.assign({}, fmt, { sup: true }); break;
                case 'SUB':
                    fmt = Object.assign({}, fmt, { sub: true }); break;
                case 'CODE':
                    fmt = Object.assign({}, fmt, { code: true }); break;
                case 'IMG':
                    return docxImageRun(node, state);
                case 'A': {
                    const href = node.getAttribute('href') || '';
                    const linkFmt = Object.assign({}, fmt, { link: true });
                    let inner = '';
                    node.childNodes.forEach(child => { inner += docxInlineToRuns(child, linkFmt, state); });
                    if (inner === '') return '';
                    if (href.startsWith('#')) {
                        return '<w:hyperlink w:anchor="' + docxBookmarkName(href.slice(1)) + '">' + inner + '</w:hyperlink>';
                    }
                    if (/^(https?:|mailto:)/i.test(href)) {
                        const relId = 'rId' + (state.relCounter++);
                        state.rels.push('<Relationship Id="' + relId + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="' + docxEscape(href) + '" TargetMode="External"/>');
                        return '<w:hyperlink r:id="' + relId + '">' + inner + '</w:hyperlink>';
                    }
                    return inner;
                }
            }

            let runs = '';
            node.childNodes.forEach(child => { runs += docxInlineToRuns(child, fmt, state); });
            return runs;
        }

        /**
         * 미리 수집한 이미지 데이터를 인라인 그림 런으로 변환
         */
        function docxImageRun(img, state) {
            const data = state.images.get(img);
            if (!data) {
                const alt = img.getAttribute('alt') || img.getAttribute('src') || '이미지';
                return docxMakeRun('[이미지: ' + alt + ']', { italic: true, color: '808080' });
            }
            const id = ++state.drawingId;
            const name = docxEscape(img.getAttribute('alt') || ('그림 ' + id));
            return '<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">'
                + '<wp:extent cx="' + data.cx + '" cy="' + data.cy + '"/>'
                + '<wp:effectExtent l="0" t="0" r="0" b="0"/>'
                + '<wp:docPr id="' + id + '" name="' + name + '"/>'
                + '<wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr>'
                + '<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">'
                + '<pic:pic><pic:nvPicPr><pic:cNvPr id="' + id + '" name="' + name + '"/><pic:cNvPicPr/></pic:nvPicPr>'
                + '<pic:blipFill><a:blip r:embed="' + data.relId + '"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>'
                + '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + data.cx + '" cy="' + data.cy + '"/></a:xfrm>'
                + '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>'
                + '</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>';
        }

        /**
         * 미리보기의 이미지를 PNG로 인코딩해 문서 미디어로 수집
         * (CORS로 캔버스가 오염된 경우 fetch 폴백, 실패 시 대체 텍스트 사용)
         */
        async function docxCollectImages(root, state) {
            const imgs = root.querySelectorAll('img');
            for (const img of imgs) {
                if (!img.complete || !img.naturalWidth) continue;
                let bytes = null;
                let ext = 'png';
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    const dataUrl = canvas.toDataURL('image/png');
                    const base64 = dataUrl.split(',')[1];
                    const binary = atob(base64);
                    bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                } catch (canvasError) {
                    try {
                        const response = await fetch(img.src);
                        const buffer = new Uint8Array(await response.arrayBuffer());
                        if (buffer[0] === 0x89 && buffer[1] === 0x50) ext = 'png';
                        else if (buffer[0] === 0xFF && buffer[1] === 0xD8) ext = 'jpeg';
                        else if (buffer[0] === 0x47 && buffer[1] === 0x49) ext = 'gif';
                        else continue;
                        bytes = buffer;
                    } catch (fetchError) {
                        continue;
                    }
                }
                let cx = Math.round(img.naturalWidth * 9525);
                let cy = Math.round(img.naturalHeight * 9525);
                if (cx > DOCX_CONTENT_WIDTH_EMU) {
                    cy = Math.max(1, Math.round(cy * DOCX_CONTENT_WIDTH_EMU / cx));
                    cx = DOCX_CONTENT_WIDTH_EMU;
                }
                const mediaIndex = state.media.length + 1;
                const fileName = 'image' + mediaIndex + '.' + ext;
                const relId = 'rId' + (state.relCounter++);
                state.media.push({ name: 'word/media/' + fileName, data: bytes });
                state.rels.push('<Relationship Id="' + relId + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/' + fileName + '"/>');
                state.images.set(img, { relId, cx: Math.max(1, cx), cy: Math.max(1, cy) });
            }
        }

        /**
         * 코드 블록(pre)을 Source Code 단락들로 변환
         */
        function docxPreToXml(pre, ctx) {
            const text = pre.textContent.replace(/\n$/, '');
            const indent = ctx.listLevel >= 0 ? 720 * (ctx.listLevel + 1) : 0;
            // 견본과 동일하게 코드 블록 전체를 한 단락으로 만들고 줄은 <w:br/>로 구분
            const runs = text.split('\n').map(line => docxMakeRun(line, { code: true }))
                .join('<w:r><w:rPr><w:rStyle w:val="VerbatimChar"/></w:rPr><w:br/></w:r>');
            return '<w:p>' + docxParaProps({ style: 'SourceCode', indLeft: indent }) + runs + '</w:p>';
        }

        /**
         * 표를 견본과 동일한 서식(격자 테두리 + 하늘색 머리행)으로 변환
         */
        function docxTableToXml(table, state) {
            const rows = Array.from(table.rows);
            if (rows.length === 0) return '';
            const colCount = Math.max(...rows.map(row => row.cells.length));
            if (colCount === 0) return '';

            // 미리보기에 렌더링된 실제 열 폭 비율을 사용 (측정 불가 시 균등 분할)
            let measured = Array.from(rows[0].cells).map(cell => cell.getBoundingClientRect().width);
            while (measured.length < colCount) measured.push(0);
            const totalMeasured = measured.reduce((sum, w) => sum + w, 0);
            let widths;
            if (totalMeasured > 0) {
                widths = measured.map(w => Math.max(240, Math.round(w / totalMeasured * DOCX_CONTENT_WIDTH_TWIPS)));
            } else {
                widths = new Array(colCount).fill(Math.floor(DOCX_CONTENT_WIDTH_TWIPS / colCount));
            }
            const widthSum = widths.reduce((sum, w) => sum + w, 0);
            widths[widths.length - 1] += DOCX_CONTENT_WIDTH_TWIPS - widthSum;

            let xml = '<w:tbl><w:tblPr><w:tblStyle w:val="Table"/>'
                + '<w:tblW w:w="' + DOCX_CONTENT_WIDTH_TWIPS + '" w:type="dxa"/>'
                + '<w:tblLayout w:type="fixed"/>'
                + '<w:tblLook w:val="0020" w:firstRow="1" w:lastRow="0" w:firstColumn="0" w:lastColumn="0" w:noHBand="0" w:noVBand="0"/></w:tblPr>'
                + '<w:tblGrid>' + widths.map(w => '<w:gridCol w:w="' + w + '"/>').join('') + '</w:tblGrid>';

            rows.forEach(row => {
                const cells = Array.from(row.cells);
                const isHeader = cells.length > 0 && cells.every(cell => cell.tagName === 'TH');
                xml += '<w:tr>' + (isHeader ? '<w:trPr><w:tblHeader/></w:trPr>' : '');
                for (let c = 0; c < colCount; c++) {
                    const cell = cells[c];
                    const width = widths[c];
                    let cellProps = '<w:tcPr><w:tcW w:w="' + width + '" w:type="dxa"/>'
                        + (isHeader ? '<w:shd w:val="clear" w:color="auto" w:fill="D9E2F3"/>' : '')
                        + '</w:tcPr>';
                    let paragraph;
                    if (cell) {
                        const align = (cell.getAttribute('align') || '').toLowerCase();
                        const jc = align === 'center' ? 'center' : align === 'right' ? 'right' : (isHeader ? 'center' : '');
                        const fmt = isHeader ? { bold: true, color: '1F4E79' } : {};
                        let runs = '';
                        cell.childNodes.forEach(child => { runs += docxInlineToRuns(child, fmt, state); });
                        paragraph = '<w:p>' + docxParaProps({ style: 'Compact', jc: jc || undefined }) + runs + '</w:p>';
                    } else {
                        paragraph = '<w:p>' + docxParaProps({ style: 'Compact' }) + '</w:p>';
                    }
                    xml += '<w:tc>' + cellProps + paragraph + '</w:tc>';
                }
                xml += '</w:tr>';
            });
            return xml + '</w:tbl>';
        }

        /**
         * 목록(ul/ol)을 견본과 동일한 글머리 기호/번호 단락으로 변환
         */
        function docxListToXml(list, level, state, ctx) {
            const ordered = list.tagName === 'OL';
            let numId = 1;
            if (ordered) {
                const start = parseInt(list.getAttribute('start') || '1', 10) || 1;
                state.orderedListStarts.push(start);
                numId = 2 + state.orderedListStarts.length; // numId 1은 글머리 기호 목록
            }
            const ilvl = Math.min(level, 8);
            let xml = '';
            Array.from(list.children).forEach(li => {
                if (li.tagName !== 'LI') return;
                let firstParagraphDone = false;
                let inlineBuffer = '';
                const flushInline = () => {
                    if (inlineBuffer.trim() === '' && firstParagraphDone) { inlineBuffer = ''; return; }
                    xml += '<w:p>' + docxParaProps(firstParagraphDone
                        ? { style: 'Compact', indLeft: 720 * (ilvl + 1) }
                        : { style: 'Compact', numId: numId, ilvl: ilvl })
                        + inlineBuffer + '</w:p>';
                    inlineBuffer = '';
                    firstParagraphDone = true;
                };
                li.childNodes.forEach(child => {
                    const childTag = child.nodeType === Node.ELEMENT_NODE ? child.tagName : null;
                    if (childTag === 'UL' || childTag === 'OL') {
                        flushInline();
                        xml += docxListToXml(child, level + 1, state, ctx);
                    } else if (childTag === 'P') {
                        let runs = '';
                        child.childNodes.forEach(grandchild => { runs += docxInlineToRuns(grandchild, {}, state); });
                        inlineBuffer += runs;
                        flushInline();
                    } else if (childTag === 'PRE') {
                        flushInline();
                        xml += docxPreToXml(child, { listLevel: ilvl });
                    } else if (childTag === 'TABLE') {
                        flushInline();
                        xml += docxTableToXml(child, state);
                    } else if (childTag === 'BLOCKQUOTE') {
                        flushInline();
                        xml += docxBlocksToXml(child, state, { quoteDepth: (ctx.quoteDepth || 0) + 1, listLevel: ilvl });
                    } else {
                        inlineBuffer += docxInlineToRuns(child, {}, state);
                    }
                });
                if (!firstParagraphDone || inlineBuffer.trim() !== '') flushInline();
            });
            return xml;
        }

        /**
         * 미리보기 블록 요소들을 OOXML 본문으로 변환
         */
        function docxBlocksToXml(parent, state, ctx) {
            ctx = ctx || {};
            let xml = '';
            Array.from(parent.childNodes).forEach(node => {
                if (node.nodeType !== Node.ELEMENT_NODE) return;
                const tag = node.tagName;

                if (/^H[1-6]$/.test(tag)) {
                    const headingLevel = tag[1];
                    let bookmark = '';
                    let bookmarkEnd = '';
                    if (node.id) {
                        const bookmarkId = ++state.bookmarkCounter;
                        bookmark = '<w:bookmarkStart w:id="' + bookmarkId + '" w:name="' + docxBookmarkName(node.id) + '"/>';
                        bookmarkEnd = '<w:bookmarkEnd w:id="' + bookmarkId + '"/>';
                    }
                    let runs = '';
                    node.childNodes.forEach(child => { runs += docxInlineToRuns(child, {}, state); });
                    xml += '<w:p>' + docxParaProps({ style: headingLevel }) + bookmark + runs + bookmarkEnd + '</w:p>';
                    state.afterHeading = true;
                    return;
                }

                switch (tag) {
                    case 'P': {
                        const quoteDepth = ctx.quoteDepth || 0;
                        const style = quoteDepth > 0 ? 'a8' : (state.afterHeading ? 'FirstParagraph' : 'a0');
                        const displayMath = node.querySelector('.katex-display');
                        const paraOpts = { style };
                        if (quoteDepth > 1) paraOpts.indLeft = 480 * quoteDepth;
                        if (displayMath) paraOpts.jc = 'center';
                        let runs = '';
                        node.childNodes.forEach(child => { runs += docxInlineToRuns(child, {}, state); });
                        xml += '<w:p>' + docxParaProps(paraOpts) + runs + '</w:p>';
                        state.afterHeading = false;
                        break;
                    }
                    case 'UL': case 'OL':
                        xml += docxListToXml(node, ctx.listLevel != null && ctx.listLevel >= 0 ? ctx.listLevel : 0, state, ctx);
                        state.afterHeading = false;
                        break;
                    case 'BLOCKQUOTE':
                        xml += docxBlocksToXml(node, state, Object.assign({}, ctx, { quoteDepth: (ctx.quoteDepth || 0) + 1 }));
                        state.afterHeading = false;
                        break;
                    case 'PRE':
                        xml += docxPreToXml(node, { listLevel: ctx.listLevel != null ? ctx.listLevel : -1 });
                        state.afterHeading = false;
                        break;
                    case 'TABLE':
                        xml += docxTableToXml(node, state);
                        state.afterHeading = false;
                        break;
                    case 'HR':
                        xml += '<w:p>' + docxParaProps({ hr: true }) + '</w:p>';
                        state.afterHeading = false;
                        break;
                    default:
                        if (node.querySelector && node.querySelector('p, ul, ol, table, pre, blockquote, h1, h2, h3, h4, h5, h6')) {
                            xml += docxBlocksToXml(node, state, ctx);
                        } else {
                            let runs = '';
                            node.childNodes.forEach(child => { runs += docxInlineToRuns(child, {}, state); });
                            if (node.classList && node.classList.contains('katex')) {
                                runs = docxInlineToRuns(node, {}, state);
                            }
                            if (runs !== '') {
                                const isMathBlock = node.classList
                                    && (node.classList.contains('katex-display') || !!node.querySelector('.katex-display'));
                                xml += '<w:p>' + docxParaProps({ style: 'a0', jc: isMathBlock ? 'center' : undefined }) + runs + '</w:p>';
                                state.afterHeading = false;
                            }
                        }
                }
            });
            return xml;
        }

        /**
         * CRC-32 계산 (ZIP 무결성 검사값)
         */
        const DOCX_CRC_TABLE = (() => {
            const table = new Uint32Array(256);
            for (let n = 0; n < 256; n++) {
                let c = n;
                for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
                table[n] = c >>> 0;
            }
            return table;
        })();

        function docxCrc32(bytes) {
            let crc = 0xFFFFFFFF;
            for (let i = 0; i < bytes.length; i++) {
                crc = DOCX_CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
            }
            return (crc ^ 0xFFFFFFFF) >>> 0;
        }

        /**
         * ZIP 패키지 생성 (무압축 저장 방식 — Word가 그대로 읽을 수 있음)
         */
        function docxBuildZip(entries) {
            const encoder = new TextEncoder();
            const now = new Date();
            const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2);
            const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
            const localParts = [];
            const centralParts = [];
            let offset = 0;

            entries.forEach(entry => {
                const nameBytes = encoder.encode(entry.name);
                const data = typeof entry.data === 'string' ? encoder.encode(entry.data) : entry.data;
                const crc = docxCrc32(data);
                const header = new DataView(new ArrayBuffer(30));
                header.setUint32(0, 0x04034b50, true);
                header.setUint16(4, 20, true);          // 필요한 최소 버전
                header.setUint16(6, 0x0800, true);      // UTF-8 파일명 플래그
                header.setUint16(8, 0, true);           // 무압축(STORE)
                header.setUint16(10, dosTime, true);
                header.setUint16(12, dosDate, true);
                header.setUint32(14, crc, true);
                header.setUint32(18, data.length, true);
                header.setUint32(22, data.length, true);
                header.setUint16(26, nameBytes.length, true);
                header.setUint16(28, 0, true);
                localParts.push(new Uint8Array(header.buffer), nameBytes, data);

                const central = new DataView(new ArrayBuffer(46));
                central.setUint32(0, 0x02014b50, true);
                central.setUint16(4, 20, true);
                central.setUint16(6, 20, true);
                central.setUint16(8, 0x0800, true);
                central.setUint16(10, 0, true);
                central.setUint16(12, dosTime, true);
                central.setUint16(14, dosDate, true);
                central.setUint32(16, crc, true);
                central.setUint32(20, data.length, true);
                central.setUint32(24, data.length, true);
                central.setUint16(28, nameBytes.length, true);
                central.setUint32(42, offset, true);
                centralParts.push(new Uint8Array(central.buffer), nameBytes);
                offset += 30 + nameBytes.length + data.length;
            });

            const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
            const end = new DataView(new ArrayBuffer(22));
            end.setUint32(0, 0x06054b50, true);
            end.setUint16(8, entries.length, true);
            end.setUint16(10, entries.length, true);
            end.setUint32(12, centralSize, true);
            end.setUint32(16, offset, true);

            const allParts = localParts.concat(centralParts, [new Uint8Array(end.buffer)]);
            const total = new Uint8Array(allParts.reduce((sum, part) => sum + part.length, 0));
            let position = 0;
            allParts.forEach(part => { total.set(part, position); position += part.length; });
            return total;
        }

        /**
         * 미리보기 DOM 전체를 .docx 패키지 바이트로 변환

            const state = {

                relCounter: 100,
                drawingId: 0,

                afterHeading: false

            await docxCollectImages(root, state);
            const bodyXml = docxBlocksToXml(root, state, {});

            const documentXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<w:document xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006"'
                + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"'
                + ' xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"'
                + ' xmlns:w14="http://schemas.microsoft.com/office/word/2010/wordml"'
                + ' xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"'
                + ' xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"'
                + ' xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"'

                + (bodyXml || '<w:p/>')
                + DOCX_SECTPR_XML + '</w:body></w:document>';

            // 글머리 기호 목록은 numId 1 공유, 번호 목록은 목록마다 번호를 새로 시작
            let numberingXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<w:numbering xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:w14="http://schemas.microsoft.com/office/word/2010/wordml" mc:Ignorable="w14">'
                + DOCX_BULLET_ABSTRACT_XML + DOCX_DECIMAL_ABSTRACT_XML
                + '<w:num w:numId="1"><w:abstractNumId w:val="1"/></w:num>'
                + state.orderedListStarts.map((start, index) =>
                    '<w:num w:numId="' + (3 + index) + '"><w:abstractNumId w:val="2"/>'
                    + '<w:lvlOverride w:ilvl="0"><w:startOverride w:val="' + start + '"/></w:lvlOverride>'
                    + [1, 2, 3, 4, 5, 6, 7, 8].map(lvl => '<w:lvlOverride w:ilvl="' + lvl + '"><w:startOverride w:val="1"/></w:lvlOverride>').join('')

            const documentRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
                + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>'
                + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
                + '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/>'
                + '<Relationship Id="rId7" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>'
                + '<Relationship Id="rId8" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/fontTable" Target="fontTable.xml"/>'
                + '<Relationship Id="rId9" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="theme/theme1.xml"/>'
                + state.rels.join('')
                + '</Relationships>';

            const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
                + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
                + '<Default Extension="xml" ContentType="application/xml"/>'
                + '<Default Extension="png" ContentType="image/png"/>'
                + '<Default Extension="jpeg" ContentType="image/jpeg"/>'
                + '<Default Extension="gif" ContentType="image/gif"/>'
                + '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
                + '<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/>'

                + '<Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/>'
                + '<Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/>'
                + '<Override PartName="/word/fontTable.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.fontTable+xml"/>'

            const timestamp = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');

                + '<dcterms:created xsi:type="dcterms:W3CDTF">' + timestamp + '</dcterms:created>'
                + '<dcterms:modified xsi:type="dcterms:W3CDTF">' + timestamp + '</dcterms:modified>'
                + '</cp:coreProperties>';

            const appXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes">'
                + '<Application>JJANG MD Editor</Application>'
                + '</Properties>';

            const files = [
                { name: '[Content_Types].xml', data: contentTypes },
                { name: '_rels/.rels', data: rootRels },
                { name: 'word/document.xml', data: documentXml },
                { name: 'word/_rels/document.xml.rels', data: documentRels },
                { name: 'word/styles.xml', data: DOCX_STYLES_XML },
                { name: 'word/numbering.xml', data: numberingXml },
                { name: 'word/settings.xml', data: DOCX_SETTINGS_XML },
                { name: 'word/footer1.xml', data: DOCX_FOOTER_XML },
                { name: 'word/fontTable.xml', data: DOCX_FONT_TABLE_XML },
                { name: 'word/theme/theme1.xml', data: DOCX_THEME_XML },
                { name: 'docProps/core.xml', data: coreXml },
                { name: 'docProps/app.xml', data: appXml }
            ].concat(state.media);

            return docxBuildZip(files);
        }

        /**
         * Word(.docx)로 내보내기
         * 견본 문서와 동일한 서식의 .docx 파일 생성
         */
        async function exportToWord() {
            try {
                // 로딩 상태 표시
                exportWordBtn.classList.add('loading');
                exportWordBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span class="ml-2">생성 중...</span>';

                const wordFilename = (currentFilename || 'markdown-document.md').replace(/\.(md|markdown|txt)$/i, '') + '.docx';
                const docTitle = wordFilename.replace(/\.docx$/i, '');
                const docxBytes = await buildDocxFromPreview(preview, docTitle);
                const blob = new Blob([docxBytes], { type: DOCX_MIME });

                // File System Access API 지원 시 저장 경로 선택 대화상자 표시
                if (window.showSaveFilePicker) {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: wordFilename,
                        types: [{
                            description: 'Word 문서 (.docx)',
                            accept: { [DOCX_MIME]: ['.docx'] }
                        }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                } else {
                    // 폴백: 자동 다운로드
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = wordFilename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                }

                console.log('✅ Word 내보내기 완료');

            } catch (error) {
                if (error.name === 'AbortError') return; // 사용자 취소
                console.error('❌ Word 내보내기 오류:', error);
                alert('Word 문서 생성 중 오류가 발생했습니다:\n' + error.message);
            } finally {
                // 로딩 상태 해제
                exportWordBtn.classList.remove('loading');
                exportWordBtn.innerHTML = '<i class="fas fa-file-word"></i><span class="ml-2">Word</span>';
            }
        }

        // 발간물 서식 팔레트
        const HWPX_COLORS = {

        const HWPX_CONTENT_WIDTH = HWPX_PAGE.width - HWPX_PAGE.left - HWPX_PAGE.right; // 48190

        const HWPX_FONTS = ['함초롬돋움', '함초롬바탕', '맑은 고딕']; // id 2 = 발간물 서식 글꼴
