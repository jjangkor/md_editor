        /**
         * XML 특수문자 이스케이프 (제어문자 제거 포함)
         */
        function docxEscape(text) {
            return String(text)
                .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        /**
         * Word 책갈피 이름으로 사용할 수 있게 앵커 이름 정리
         */
        function docxBookmarkName(name) {
            let safe = String(name).replace(/[^A-Za-z0-9_]/g, '_').slice(0, 40);
            if (!/^[A-Za-z_]/.test(safe)) safe = 'bm_' + safe;
            return safe;
        }

        /**
         * 런 문자 서식(rPr) 생성 — OOXML 스키마의 자식 순서 준수
         */
        function docxRunProps(fmt) {
            let props = '';
            if (fmt.link) props += '<w:rStyle w:val="ac"/>';
            else if (fmt.code) props += '<w:rStyle w:val="VerbatimChar"/>';
            if (fmt.math) props += '<w:rFonts w:ascii="Cambria Math" w:eastAsia="Cambria Math" w:hAnsi="Cambria Math"/>';
            if (fmt.bold) props += '<w:b/><w:bCs/>';
            if (fmt.italic || fmt.math) props += '<w:i/><w:iCs/>';
            if (fmt.strike) props += '<w:strike/>';
            if (fmt.color) props += '<w:color w:val="' + fmt.color + '"/>';
            if (fmt.underline) props += '<w:u w:val="single"/>';
            if (fmt.sup) props += '<w:vertAlign w:val="superscript"/>';
            else if (fmt.sub) props += '<w:vertAlign w:val="subscript"/>';
            return props ? '<w:rPr>' + props + '</w:rPr>' : '';
        }

        /**
         * 텍스트 런 생성 (탭 문자는 <w:tab/>으로 변환)
         */
        function docxMakeRun(text, fmt) {
            if (text === '') return '';
            const props = docxRunProps(fmt || {});
            const parts = String(text).split('\t').map(seg =>
                seg === '' ? '' : '<w:t xml:space="preserve">' + docxEscape(seg) + '</w:t>'
            );
            return '<w:r>' + props + parts.join('<w:tab/>') + '</w:r>';
        }

        /**
         * 단락 속성(pPr) 생성 — OOXML 스키마의 자식 순서 준수
         */
        function docxParaProps(opts) {
            let props = '';
            if (opts.style) props += '<w:pStyle w:val="' + opts.style + '"/>';
            if (opts.numId) props += '<w:numPr><w:ilvl w:val="' + opts.ilvl + '"/><w:numId w:val="' + opts.numId + '"/></w:numPr>';
            if (opts.hr) props += '<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="999999"/></w:pBdr>';
            if (opts.indLeft || opts.indRight) {
                props += '<w:ind';
                if (opts.indLeft) props += ' w:left="' + opts.indLeft + '"';
                if (opts.indRight) props += ' w:right="' + opts.indRight + '"';
                props += '/>';
            }
            if (opts.jc) props += '<w:jc w:val="' + opts.jc + '"/>';
            return props ? '<w:pPr>' + props + '</w:pPr>' : '';
        }

        /**
         * KaTeX 수식 요소에서 원본 TeX 문자열 추출
         */
        function docxTexFromKatex(el) {
            const annotation = el.querySelector('annotation');
            if (annotation) return annotation.textContent;
            const htmlPart = el.querySelector('.katex-html');
            return htmlPart ? htmlPart.textContent : el.textContent;
        }

        /**
         * 미리보기의 인라인 노드를 OOXML 런 목록으로 변환
         */
        function docxInlineToRuns(node, fmt, state) {
            if (node.nodeType === Node.TEXT_NODE) {
                if (node.textContent.trim() === '') {
                    // 블록 요소 사이·요소 가장자리의 공백 노드는 무시
                    const isBlock = el => el && el.nodeType === Node.ELEMENT_NODE
                        && /^(UL|OL|P|PRE|TABLE|BLOCKQUOTE|DIV|LI|H[1-6]|TR|TD|TH)$/.test(el.tagName);
                    const prev = node.previousSibling;
                    const next = node.nextSibling;
                    if (!prev || !next || isBlock(prev) || isBlock(next)) return '';
                    return docxMakeRun(' ', fmt);
                }
                return docxMakeRun(node.textContent.replace(/[ \t\r\n]+/g, ' '), fmt);
            }
            if (node.nodeType !== Node.ELEMENT_NODE) return '';

            const tag = node.tagName;
            if (node.classList.contains('katex-display') || node.classList.contains('katex')) {
                const katexRoot = node.classList.contains('katex') ? node : (node.querySelector('.katex') || node);
                return docxMakeRun(docxTexFromKatex(katexRoot), Object.assign({}, fmt, { math: true }));
            }

            switch (tag) {
                case 'BR':
                    return '<w:r>' + docxRunProps(fmt) + '<w:br/></w:r>';
                case 'STRONG': case 'B':
                    fmt = Object.assign({}, fmt, { bold: true }); break;
                case 'EM': case 'I':
                    fmt = Object.assign({}, fmt, { italic: true }); break;
                case 'DEL': case 'S': case 'STRIKE':
                    fmt = Object.assign({}, fmt, { strike: true }); break;
                case 'U':
                    fmt = Object.assign({}, fmt, { underline: true }); break;
                case 'SUP':
                    fmt = Object.assign({}, fmt, { sup: true }); break;
                case 'SUB':
                    fmt = Object.assign({}, fmt, { sub: true }); break;
                case 'CODE':
                    fmt = Object.assign({}, fmt, { code: true }); break;
                case 'IMG':
                    return docxImageRun(node, state);
                case 'A': {
                    const href = node.getAttribute('href') || '';
                    const linkFmt = Object.assign({}, fmt, { link: true });
                    let inner = '';
                    node.childNodes.forEach(child => { inner += docxInlineToRuns(child, linkFmt, state); });
                    if (inner === '') return '';
                    if (href.startsWith('#')) {
                        return '<w:hyperlink w:anchor="' + docxBookmarkName(href.slice(1)) + '">' + inner + '</w:hyperlink>';
                    }
                    if (/^(https?:|mailto:)/i.test(href)) {
                        const relId = 'rId' + (state.relCounter++);
                        state.rels.push('<Relationship Id="' + relId + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="' + docxEscape(href) + '" TargetMode="External"/>');
                        return '<w:hyperlink r:id="' + relId + '">' + inner + '</w:hyperlink>';
                    }
                    return inner;
                }
            }

            let runs = '';
            node.childNodes.forEach(child => { runs += docxInlineToRuns(child, fmt, state); });
            return runs;
        }

        /**
         * 미리 수집한 이미지 데이터를 인라인 그림 런으로 변환
         */
        function docxImageRun(img, state) {
            const data = state.images.get(img);
            if (!data) {
                const alt = img.getAttribute('alt') || img.getAttribute('src') || '이미지';
                return docxMakeRun('[이미지: ' + alt + ']', { italic: true, color: '808080' });
            }
            const id = ++state.drawingId;
            const name = docxEscape(img.getAttribute('alt') || ('그림 ' + id));
            return '<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">'
                + '<wp:extent cx="' + data.cx + '" cy="' + data.cy + '"/>'
                + '<wp:effectExtent l="0" t="0" r="0" b="0"/>'
                + '<wp:docPr id="' + id + '" name="' + name + '"/>'
                + '<wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr>'
                + '<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">'
                + '<pic:pic><pic:nvPicPr><pic:cNvPr id="' + id + '" name="' + name + '"/><pic:cNvPicPr/></pic:nvPicPr>'
                + '<pic:blipFill><a:blip r:embed="' + data.relId + '"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>'
                + '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + data.cx + '" cy="' + data.cy + '"/></a:xfrm>'
                + '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>'
                + '</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>';
        }

        /**
         * 미리보기의 이미지를 PNG로 인코딩해 문서 미디어로 수집
         * (CORS로 캔버스가 오염된 경우 fetch 폴백, 실패 시 대체 텍스트 사용)
         */
        async function docxCollectImages(root, state) {
            const imgs = root.querySelectorAll('img');
            for (const img of imgs) {
                if (!img.complete || !img.naturalWidth) continue;
                let bytes = null;
                let ext = 'png';
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    const dataUrl = canvas.toDataURL('image/png');
                    const base64 = dataUrl.split(',')[1];
                    const binary = atob(base64);
                    bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                } catch (canvasError) {
                    try {
                        const response = await fetch(img.src);
                        const buffer = new Uint8Array(await response.arrayBuffer());
                        if (buffer[0] === 0x89 && buffer[1] === 0x50) ext = 'png';
                        else if (buffer[0] === 0xFF && buffer[1] === 0xD8) ext = 'jpeg';
                        else if (buffer[0] === 0x47 && buffer[1] === 0x49) ext = 'gif';
                        else continue;
                        bytes = buffer;
                    } catch (fetchError) {
                        continue;
                    }
                }
                let cx = Math.round(img.naturalWidth * 9525);
                let cy = Math.round(img.naturalHeight * 9525);
                if (cx > DOCX_CONTENT_WIDTH_EMU) {
                    cy = Math.max(1, Math.round(cy * DOCX_CONTENT_WIDTH_EMU / cx));
                    cx = DOCX_CONTENT_WIDTH_EMU;
                }
                const mediaIndex = state.media.length + 1;
                const fileName = 'image' + mediaIndex + '.' + ext;
                const relId = 'rId' + (state.relCounter++);
                state.media.push({ name: 'word/media/' + fileName, data: bytes });
                state.rels.push('<Relationship Id="' + relId + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/' + fileName + '"/>');
                state.images.set(img, { relId, cx: Math.max(1, cx), cy: Math.max(1, cy) });
            }
        }

        /**
         * 코드 블록(pre)을 Source Code 단락들로 변환
         */
        function docxPreToXml(pre, ctx) {
            const text = pre.textContent.replace(/\n$/, '');
            const indent = ctx.listLevel >= 0 ? 720 * (ctx.listLevel + 1) : 0;
            // 견본과 동일하게 코드 블록 전체를 한 단락으로 만들고 줄은 <w:br/>로 구분
            const runs = text.split('\n').map(line => docxMakeRun(line, { code: true }))
                .join('<w:r><w:rPr><w:rStyle w:val="VerbatimChar"/></w:rPr><w:br/></w:r>');
            return '<w:p>' + docxParaProps({ style: 'SourceCode', indLeft: indent }) + runs + '</w:p>';
        }

        /**
         * 표를 견본과 동일한 서식(격자 테두리 + 하늘색 머리행)으로 변환
         */
        function docxTableToXml(table, state) {
            const rows = Array.from(table.rows);
            if (rows.length === 0) return '';
            const colCount = Math.max(...rows.map(row => row.cells.length));
            if (colCount === 0) return '';

            // 미리보기에 렌더링된 실제 열 폭 비율을 사용 (측정 불가 시 균등 분할)
            let measured = Array.from(rows[0].cells).map(cell => cell.getBoundingClientRect().width);
            while (measured.length < colCount) measured.push(0);
            const totalMeasured = measured.reduce((sum, w) => sum + w, 0);
            let widths;
            if (totalMeasured > 0) {
                widths = measured.map(w => Math.max(240, Math.round(w / totalMeasured * DOCX_CONTENT_WIDTH_TWIPS)));
            } else {
                widths = new Array(colCount).fill(Math.floor(DOCX_CONTENT_WIDTH_TWIPS / colCount));
            }
            const widthSum = widths.reduce((sum, w) => sum + w, 0);
            widths[widths.length - 1] += DOCX_CONTENT_WIDTH_TWIPS - widthSum;

            let xml = '<w:tbl><w:tblPr><w:tblStyle w:val="Table"/>'
                + '<w:tblW w:w="' + DOCX_CONTENT_WIDTH_TWIPS + '" w:type="dxa"/>'
                + '<w:tblLayout w:type="fixed"/>'
                + '<w:tblLook w:val="0020" w:firstRow="1" w:lastRow="0" w:firstColumn="0" w:lastColumn="0" w:noHBand="0" w:noVBand="0"/></w:tblPr>'
                + '<w:tblGrid>' + widths.map(w => '<w:gridCol w:w="' + w + '"/>').join('') + '</w:tblGrid>';

            rows.forEach(row => {
                const cells = Array.from(row.cells);
                const isHeader = cells.length > 0 && cells.every(cell => cell.tagName === 'TH');
                xml += '<w:tr>' + (isHeader ? '<w:trPr><w:tblHeader/></w:trPr>' : '');
                for (let c = 0; c < colCount; c++) {
                    const cell = cells[c];
                    const width = widths[c];
                    let cellProps = '<w:tcPr><w:tcW w:w="' + width + '" w:type="dxa"/>'
                        + (isHeader ? '<w:shd w:val="clear" w:color="auto" w:fill="D9E2F3"/>' : '')
                        + '</w:tcPr>';
                    let paragraph;
                    if (cell) {
                        const align = (cell.getAttribute('align') || '').toLowerCase();
                        const jc = align === 'center' ? 'center' : align === 'right' ? 'right' : (isHeader ? 'center' : '');
                        const fmt = isHeader ? { bold: true, color: '1F4E79' } : {};
                        let runs = '';
                        cell.childNodes.forEach(child => { runs += docxInlineToRuns(child, fmt, state); });
                        paragraph = '<w:p>' + docxParaProps({ style: 'Compact', jc: jc || undefined }) + runs + '</w:p>';
                    } else {
                        paragraph = '<w:p>' + docxParaProps({ style: 'Compact' }) + '</w:p>';
                    }
                    xml += '<w:tc>' + cellProps + paragraph + '</w:tc>';
                }
                xml += '</w:tr>';
            });
            return xml + '</w:tbl>';
        }

        /**
         * 목록(ul/ol)을 견본과 동일한 글머리 기호/번호 단락으로 변환
         */
        function docxListToXml(list, level, state, ctx) {
            const ordered = list.tagName === 'OL';
            let numId = 1;
            if (ordered) {
                const start = parseInt(list.getAttribute('start') || '1', 10) || 1;
                state.orderedListStarts.push(start);
                numId = 2 + state.orderedListStarts.length; // numId 1은 글머리 기호 목록
            }
            const ilvl = Math.min(level, 8);
            let xml = '';
            Array.from(list.children).forEach(li => {
                if (li.tagName !== 'LI') return;
                let firstParagraphDone = false;
                let inlineBuffer = '';
                const flushInline = () => {
                    if (inlineBuffer.trim() === '' && firstParagraphDone) { inlineBuffer = ''; return; }
                    xml += '<w:p>' + docxParaProps(firstParagraphDone
                        ? { style: 'Compact', indLeft: 720 * (ilvl + 1) }
                        : { style: 'Compact', numId: numId, ilvl: ilvl })
                        + inlineBuffer + '</w:p>';
                    inlineBuffer = '';
                    firstParagraphDone = true;
                };
                li.childNodes.forEach(child => {
                    const childTag = child.nodeType === Node.ELEMENT_NODE ? child.tagName : null;
                    if (childTag === 'UL' || childTag === 'OL') {
                        flushInline();
                        xml += docxListToXml(child, level + 1, state, ctx);
                    } else if (childTag === 'P') {
                        let runs = '';
                        child.childNodes.forEach(grandchild => { runs += docxInlineToRuns(grandchild, {}, state); });
                        inlineBuffer += runs;
                        flushInline();
                    } else if (childTag === 'PRE') {
                        flushInline();
                        xml += docxPreToXml(child, { listLevel: ilvl });
                    } else if (childTag === 'TABLE') {
                        flushInline();
                        xml += docxTableToXml(child, state);
                    } else if (childTag === 'BLOCKQUOTE') {
                        flushInline();
                        xml += docxBlocksToXml(child, state, { quoteDepth: (ctx.quoteDepth || 0) + 1, listLevel: ilvl });
                    } else {
                        inlineBuffer += docxInlineToRuns(child, {}, state);
                    }
                });
                if (!firstParagraphDone || inlineBuffer.trim() !== '') flushInline();
            });
            return xml;
        }

        /**
         * 미리보기 블록 요소들을 OOXML 본문으로 변환
         */
        function docxBlocksToXml(parent, state, ctx) {
            ctx = ctx || {};
            let xml = '';
            Array.from(parent.childNodes).forEach(node => {
                if (node.nodeType !== Node.ELEMENT_NODE) return;
                const tag = node.tagName;

                if (/^H[1-6]$/.test(tag)) {
                    const headingLevel = tag[1];
                    let bookmark = '';
                    let bookmarkEnd = '';
                    if (node.id) {
                        const bookmarkId = ++state.bookmarkCounter;
                        bookmark = '<w:bookmarkStart w:id="' + bookmarkId + '" w:name="' + docxBookmarkName(node.id) + '"/>';
                        bookmarkEnd = '<w:bookmarkEnd w:id="' + bookmarkId + '"/>';
                    }
                    let runs = '';
                    node.childNodes.forEach(child => { runs += docxInlineToRuns(child, {}, state); });
                    xml += '<w:p>' + docxParaProps({ style: headingLevel }) + bookmark + runs + bookmarkEnd + '</w:p>';
                    state.afterHeading = true;
                    return;
                }

                switch (tag) {
                    case 'P': {
                        const quoteDepth = ctx.quoteDepth || 0;
                        const style = quoteDepth > 0 ? 'a8' : (state.afterHeading ? 'FirstParagraph' : 'a0');
                        const displayMath = node.querySelector('.katex-display');
                        const paraOpts = { style };
                        if (quoteDepth > 1) paraOpts.indLeft = 480 * quoteDepth;
                        if (displayMath) paraOpts.jc = 'center';
                        let runs = '';
                        node.childNodes.forEach(child => { runs += docxInlineToRuns(child, {}, state); });
                        xml += '<w:p>' + docxParaProps(paraOpts) + runs + '</w:p>';
                        state.afterHeading = false;
                        break;
                    }
                    case 'UL': case 'OL':
                        xml += docxListToXml(node, ctx.listLevel != null && ctx.listLevel >= 0 ? ctx.listLevel : 0, state, ctx);
                        state.afterHeading = false;
                        break;
                    case 'BLOCKQUOTE':
                        xml += docxBlocksToXml(node, state, Object.assign({}, ctx, { quoteDepth: (ctx.quoteDepth || 0) + 1 }));
                        state.afterHeading = false;
                        break;
                    case 'PRE':
                        xml += docxPreToXml(node, { listLevel: ctx.listLevel != null ? ctx.listLevel : -1 });
                        state.afterHeading = false;
                        break;
                    case 'TABLE':
                        xml += docxTableToXml(node, state);
                        state.afterHeading = false;
                        break;
                    case 'HR':
                        xml += '<w:p>' + docxParaProps({ hr: true }) + '</w:p>';
                        state.afterHeading = false;
                        break;
                    default:
                        if (node.querySelector && node.querySelector('p, ul, ol, table, pre, blockquote, h1, h2, h3, h4, h5, h6')) {
                            xml += docxBlocksToXml(node, state, ctx);
                        } else {
                            let runs = '';
                            node.childNodes.forEach(child => { runs += docxInlineToRuns(child, {}, state); });
                            if (node.classList && node.classList.contains('katex')) {
                                runs = docxInlineToRuns(node, {}, state);
                            }
                            if (runs !== '') {
                                const isMathBlock = node.classList
                                    && (node.classList.contains('katex-display') || !!node.querySelector('.katex-display'));
                                xml += '<w:p>' + docxParaProps({ style: 'a0', jc: isMathBlock ? 'center' : undefined }) + runs + '</w:p>';
                                state.afterHeading = false;
                            }
                        }
                }
            });
            return xml;
        }

        /**
         * CRC-32 계산 (ZIP 무결성 검사값)
         */
        const DOCX_CRC_TABLE = (() => {
            const table = new Uint32Array(256);
            for (let n = 0; n < 256; n++) {
                let c = n;
                for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
                table[n] = c >>> 0;
            }
            return table;
        })();

        function docxCrc32(bytes) {
            let crc = 0xFFFFFFFF;
            for (let i = 0; i < bytes.length; i++) {
                crc = DOCX_CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
            }
            return (crc ^ 0xFFFFFFFF) >>> 0;
        }

        /**
         * ZIP 패키지 생성 (무압축 저장 방식 — Word가 그대로 읽을 수 있음)
         */
        function docxBuildZip(entries) {
            const encoder = new TextEncoder();
            const now = new Date();
            const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2);
            const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
            const localParts = [];
            const centralParts = [];
            let offset = 0;

            entries.forEach(entry => {
                const nameBytes = encoder.encode(entry.name);
                const data = typeof entry.data === 'string' ? encoder.encode(entry.data) : entry.data;
                const crc = docxCrc32(data);
                const header = new DataView(new ArrayBuffer(30));
                header.setUint32(0, 0x04034b50, true);
                header.setUint16(4, 20, true);          // 필요한 최소 버전
                header.setUint16(6, 0x0800, true);      // UTF-8 파일명 플래그
                header.setUint16(8, 0, true);           // 무압축(STORE)
                header.setUint16(10, dosTime, true);
                header.setUint16(12, dosDate, true);
                header.setUint32(14, crc, true);
                header.setUint32(18, data.length, true);
                header.setUint32(22, data.length, true);
                header.setUint16(26, nameBytes.length, true);
                header.setUint16(28, 0, true);
                localParts.push(new Uint8Array(header.buffer), nameBytes, data);

                const central = new DataView(new ArrayBuffer(46));
                central.setUint32(0, 0x02014b50, true);
                central.setUint16(4, 20, true);
                central.setUint16(6, 20, true);
                central.setUint16(8, 0x0800, true);
                central.setUint16(10, 0, true);
                central.setUint16(12, dosTime, true);
                central.setUint16(14, dosDate, true);
                central.setUint32(16, crc, true);
                central.setUint32(20, data.length, true);
                central.setUint32(24, data.length, true);
                central.setUint16(28, nameBytes.length, true);
                central.setUint32(42, offset, true);
                centralParts.push(new Uint8Array(central.buffer), nameBytes);
                offset += 30 + nameBytes.length + data.length;
            });

            const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
            const end = new DataView(new ArrayBuffer(22));
            end.setUint32(0, 0x06054b50, true);
            end.setUint16(8, entries.length, true);
            end.setUint16(10, entries.length, true);
            end.setUint32(12, centralSize, true);
            end.setUint32(16, offset, true);

            const allParts = localParts.concat(centralParts, [new Uint8Array(end.buffer)]);
            const total = new Uint8Array(allParts.reduce((sum, part) => sum + part.length, 0));
            let position = 0;
            allParts.forEach(part => { total.set(part, position); position += part.length; });
            return total;
        }

        /**
         * 미리보기 DOM 전체를 .docx 패키지 바이트로 변환
         */
        async function buildDocxFromPreview(root, docTitle) {
            const state = {
                rels: [],
                media: [],
                images: new Map(),
                orderedListStarts: [],
                relCounter: 100,
                drawingId: 0,
                bookmarkCounter: 0,
                afterHeading: false
            };
            await docxCollectImages(root, state);
            const bodyXml = docxBlocksToXml(root, state, {});

            const documentXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<w:document xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006"'
                + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"'
                + ' xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"'
                + ' xmlns:w14="http://schemas.microsoft.com/office/word/2010/wordml"'
                + ' xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"'
                + ' xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"'
                + ' xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"'
                + ' mc:Ignorable="w14"><w:body>'
                + (bodyXml || '<w:p/>')
                + DOCX_SECTPR_XML + '</w:body></w:document>';

            // 글머리 기호 목록은 numId 1 공유, 번호 목록은 목록마다 번호를 새로 시작
            let numberingXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<w:numbering xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:w14="http://schemas.microsoft.com/office/word/2010/wordml" mc:Ignorable="w14">'
                + DOCX_BULLET_ABSTRACT_XML + DOCX_DECIMAL_ABSTRACT_XML
                + '<w:num w:numId="1"><w:abstractNumId w:val="1"/></w:num>'
                + state.orderedListStarts.map((start, index) =>
                    '<w:num w:numId="' + (3 + index) + '"><w:abstractNumId w:val="2"/>'
                    + '<w:lvlOverride w:ilvl="0"><w:startOverride w:val="' + start + '"/></w:lvlOverride>'
                    + [1, 2, 3, 4, 5, 6, 7, 8].map(lvl => '<w:lvlOverride w:ilvl="' + lvl + '"><w:startOverride w:val="1"/></w:lvlOverride>').join('')
                    + '</w:num>'
                ).join('')
                + '</w:numbering>';

            const documentRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
                + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>'
                + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
                + '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/>'
                + '<Relationship Id="rId7" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>'
                + '<Relationship Id="rId8" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/fontTable" Target="fontTable.xml"/>'
                + '<Relationship Id="rId9" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="theme/theme1.xml"/>'
                + state.rels.join('')
                + '</Relationships>';

            const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
                + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
                + '<Default Extension="xml" ContentType="application/xml"/>'
                + '<Default Extension="png" ContentType="image/png"/>'
                + '<Default Extension="jpeg" ContentType="image/jpeg"/>'
                + '<Default Extension="gif" ContentType="image/gif"/>'
                + '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
                + '<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/>'
                + '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>'
                + '<Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/>'
                + '<Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/>'
                + '<Override PartName="/word/fontTable.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.fontTable+xml"/>'
                + '<Override PartName="/word/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/>'
                + '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>'
                + '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>'
                + '</Types>';

            const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
                + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'
                + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>'
                + '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>'
                + '</Relationships>';

            const timestamp = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
            const coreXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:dcmitype="http://purl.org/dc/dcmitype/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">'
                + '<dc:title>' + docxEscape(docTitle) + '</dc:title>'
                + '<dcterms:created xsi:type="dcterms:W3CDTF">' + timestamp + '</dcterms:created>'
                + '<dcterms:modified xsi:type="dcterms:W3CDTF">' + timestamp + '</dcterms:modified>'
                + '</cp:coreProperties>';

            const appXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
                + '<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes">'
                + '<Application>JJANG MD Editor</Application>'
                + '</Properties>';

            const files = [
                { name: '[Content_Types].xml', data: contentTypes },
                { name: '_rels/.rels', data: rootRels },
                { name: 'word/document.xml', data: documentXml },
                { name: 'word/_rels/document.xml.rels', data: documentRels },
                { name: 'word/styles.xml', data: DOCX_STYLES_XML },
                { name: 'word/numbering.xml', data: numberingXml },
                { name: 'word/settings.xml', data: DOCX_SETTINGS_XML },
                { name: 'word/footer1.xml', data: DOCX_FOOTER_XML },
                { name: 'word/fontTable.xml', data: DOCX_FONT_TABLE_XML },
                { name: 'word/theme/theme1.xml', data: DOCX_THEME_XML },
                { name: 'docProps/core.xml', data: coreXml },
                { name: 'docProps/app.xml', data: appXml }
            ].concat(state.media);

            return docxBuildZip(files);
        }

        /**
         * Word(.docx)로 내보내기
         * 견본 문서와 동일한 서식의 .docx 파일 생성
         */
        async function exportToWord() {
            try {
                // 로딩 상태 표시
                exportWordBtn.classList.add('loading');
                exportWordBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span class="ml-2">생성 중...</span>';

                const wordFilename = (currentFilename || 'markdown-document.md').replace(/\.(md|markdown|txt)$/i, '') + '.docx';
                const docTitle = wordFilename.replace(/\.docx$/i, '');
                const docxBytes = await buildDocxFromPreview(preview, docTitle);
                const blob = new Blob([docxBytes], { type: DOCX_MIME });

                // File System Access API 지원 시 저장 경로 선택 대화상자 표시
                if (window.showSaveFilePicker) {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: wordFilename,
                        types: [{
                            description: 'Word 문서 (.docx)',
                            accept: { [DOCX_MIME]: ['.docx'] }
                        }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                } else {
                    // 폴백: 자동 다운로드
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = wordFilename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                }

                console.log('✅ Word 내보내기 완료');

            } catch (error) {
                if (error.name === 'AbortError') return; // 사용자 취소
                console.error('❌ Word 내보내기 오류:', error);
                alert('Word 문서 생성 중 오류가 발생했습니다:\n' + error.message);
            } finally {
                // 로딩 상태 해제
                exportWordBtn.classList.remove('loading');
                exportWordBtn.innerHTML = '<i class="fas fa-file-word"></i><span class="ml-2">Word</span>';
            }
        }

        /**
         * 마크다운 파일 열기
         */
        function openMarkdownFile(file) {
            if (!file) return;

            const reader = new FileReader();

            reader.onload = (e) => {
                try {
                    const content = e.target.result;

                    // 에디터에 내용 로드
                    editor.value = content;
                    updatePreview();

                    // 파일명 업데이트
                    currentFilename = file.name;
                    filenameDisplay.textContent = currentFilename;

                    // 히스토리 초기화 및 현재 상태 저장
                    history = [];
                    historyIndex = -1;
                    saveToHistory();

                    console.log('✅ 파일 열기 완료:', currentFilename);

                } catch (error) {
                    console.error('❌ 파일 읽기 오류:', error);
                    alert('파일을 읽는 중 오류가 발생했습니다:\n' + error.message);
                }
            };

            reader.onerror = () => {
                console.error('❌ 파일 읽기 실패');
                alert('파일을 읽을 수 없습니다.');
            };

            reader.readAsText(file);
        }

        /**
         * 마크다운 파일로 저장 (저장 경로 지정 지원)
         */
        async function saveMarkdownFile() {
            try {
                const content = editor.value;

                // File System Access API 지원 시 저장 경로 선택 대화상자 표시
                if (window.showSaveFilePicker) {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: currentFilename,
                        types: [{
                            description: 'Markdown Files',
                            accept: { 'text/markdown': ['.md', '.markdown'] }
                        }, {
                            description: 'Text Files',
                            accept: { 'text/plain': ['.txt'] }
                        }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(content);
                    await writable.close();
                    currentFilename = handle.name;
                    filenameDisplay.textContent = currentFilename;
                    console.log('✅ 마크다운 저장 완료:', currentFilename);
                } else {
                    // 폴백: 파일명 입력 후 다운로드 (file:// 등 File System Access API 미지원 환경)
                    const filename = prompt('저장할 파일명을 입력하세요:', currentFilename);
                    if (!filename) return; // 취소
                    currentFilename = filename.endsWith('.md') || filename.endsWith('.markdown') || filename.endsWith('.txt')
                        ? filename : filename + '.md';
                    filenameDisplay.textContent = currentFilename;
                    const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = currentFilename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    console.log('✅ 마크다운 저장 완료 (다운로드):', currentFilename);
                }

            } catch (error) {
                if (error.name === 'AbortError') return; // 사용자가 대화상자 취소
                console.error('❌ 파일 저장 오류:', error);
                alert('파일 저장 중 오류가 발생했습니다:\n' + error.message);
            }
        }

        /**
         * 드래그 앤 드롭 처리
         */
        function setupDragAndDrop() {
            // 드래그 오버 방지 (전체 창)
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                document.body.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            // 에디터 영역에 드래그 오버 효과
            ['dragenter', 'dragover'].forEach(eventName => {
                editorPanel.addEventListener(eventName, () => {
                    editorPanel.classList.add('drag-over');
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                editorPanel.addEventListener(eventName, () => {
                    editorPanel.classList.remove('drag-over');
                }, false);
            });

            // 파일 드롭 처리
            editorPanel.addEventListener('drop', handleDrop, false);

            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;

                if (files.length > 0) {
                    const file = files[0];

                    // 마크다운 또는 텍스트 파일만 허용
                    if (file.name.match(/\.(md|markdown|txt)$/i)) {
                        openMarkdownFile(file);
                    } else {
                        alert('마크다운 파일(.md, .markdown, .txt)만 열 수 있습니다.');
                    }
                }
            }
        }

        // ============================================================
        // 이벤트 리스너 등록
        // ============================================================

        // 에디터 입력 시 실시간 미리보기 업데이트 및 히스토리 저장
        let inputTimeout;
        editor.addEventListener('input', () => {
            updatePreview();

            // 디바운싱: 500ms 후에 히스토리 저장
            clearTimeout(inputTimeout);
            inputTimeout = setTimeout(() => {
                saveToHistory();
            }, 500);
        });

        // 툴바 버튼 클릭 이벤트
        toolbarButtons.forEach(button => {
            button.addEventListener('click', () => {
                const action = button.getAttribute('data-action');
                insertMarkdown(action);
            });
        });

        // Undo/Redo 버튼
        undoBtn.addEventListener('click', undo);
        redoBtn.addEventListener('click', redo);

        // 파일 열기 버튼
        openFileBtn.addEventListener('click', () => {
            fileInput.click();
        });

        // 파일 선택 시
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                openMarkdownFile(file);
            }
            // 파일 입력 초기화 (같은 파일 재선택 가능하도록)
            fileInput.value = '';
        });

        // 마크다운 저장 버튼
        saveMarkdownBtn.addEventListener('click', saveMarkdownFile);

        // PDF 내보내기 버튼
        exportPdfBtn.addEventListener('click', exportToPDF);

        // Word 내보내기 버튼
        exportWordBtn.addEventListener('click', exportToWord);


        // 키보드 단축키
        editor.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                // Ctrl+Z: Undo
                if (e.key === 'z' && !e.shiftKey) {
                    e.preventDefault();
                    undo();
                }
                // Ctrl+Y or Ctrl+Shift+Z: Redo
                else if (e.key === 'y' || (e.key === 'z' && e.shiftKey)) {
                    e.preventDefault();
                    redo();
                }
                // Ctrl+B: Bold
                else if (e.key === 'b' || e.key === 'B') {
                    e.preventDefault();
                    insertMarkdown('bold');
                }
                // Ctrl+I: Italic
                else if (e.key === 'i' || e.key === 'I') {
                    e.preventDefault();
                    insertMarkdown('italic');
                }
            }
        });

        // 리사이저 드래그 및 키보드 조절 기능
        let isResizing = false;
        let isTocResizing = false;
        let wasNarrowLayout = window.matchMedia('(max-width: 767px)').matches;

        function isNarrowLayout() {
            return window.matchMedia('(max-width: 767px)').matches;
        }

        function applyDefaultPanelSizes() {
            const narrow = isNarrowLayout();
            editorPanel.style.flex = narrow ? '1 1 50%' : '1 1 0%';
            previewPanel.style.flex = narrow ? '1 1 50%' : '1 1 0%';
            resizer.setAttribute('aria-orientation', narrow ? 'horizontal' : 'vertical');
        }

        function applyDefaultTocSize() {
            const narrow = isNarrowLayout();
            if (narrow) {
                tocPanel.style.width = '100%';
                tocPanel.style.height = '30%';
                tocPanel.style.flex = '0 0 30%';
            } else {
                tocPanel.style.width = '250px';
                tocPanel.style.height = '';
                tocPanel.style.flex = '0 0 250px';
            }
            tocResizer.setAttribute('aria-orientation', narrow ? 'horizontal' : 'vertical');
        }

        function resizePanels(clientX, clientY) {
            const container = editorPanel.parentElement;
            const containerRect = container.getBoundingClientRect();
            const narrow = isNarrowLayout();
            const tocSize = isTocVisible ? (narrow ? tocPanel.offsetHeight : tocPanel.offsetWidth) : 0;
            const tocDividerSize = isTocVisible
                ? (narrow ? tocResizer.offsetHeight : tocResizer.offsetWidth)
                : 0;
            const availableSize = (narrow ? containerRect.height : containerRect.width) - tocSize - tocDividerSize;
            const editorSize = narrow
                ? clientY - containerRect.top
                : clientX - containerRect.left;
            const minSize = availableSize * 0.2;
            const maxSize = availableSize * 0.8;

            if (editorSize >= minSize && editorSize <= maxSize) {
                const previewSize = availableSize - editorSize - (narrow ? resizer.offsetHeight : resizer.offsetWidth);
                editorPanel.style.flex = `0 0 ${editorSize}px`;
                previewPanel.style.flex = `0 0 ${previewSize}px`;
            }
        }

        function resizeToc(clientX, clientY) {
            const containerRect = editorPanel.parentElement.getBoundingClientRect();
            const narrow = isNarrowLayout();
            const tocSize = narrow
                ? containerRect.bottom - clientY
                : containerRect.right - clientX;
            const totalSize = narrow ? containerRect.height : containerRect.width;
            const minSize = narrow ? 120 : 180;
            const maxSize = Math.min(narrow ? totalSize * 0.5 : totalSize * 0.45, narrow ? 420 : 520);

            if (tocSize >= minSize && tocSize <= maxSize) {
                if (narrow) {
                    tocPanel.style.height = `${tocSize}px`;
                    tocPanel.style.flex = `0 0 ${tocSize}px`;
                } else {
                    tocPanel.style.width = `${tocSize}px`;
                    tocPanel.style.flex = `0 0 ${tocSize}px`;
                }
            }
        }

        resizer.addEventListener('pointerdown', (e) => {
            isResizing = true;
            resizer.setPointerCapture(e.pointerId);
            document.body.style.cursor = isNarrowLayout() ? 'row-resize' : 'col-resize';
            document.body.style.userSelect = 'none';
        });

        resizer.addEventListener('pointermove', (e) => {
            if (!isResizing) return;
            resizePanels(e.clientX, e.clientY);
        });

        function stopResizing() {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            }
        }

        resizer.addEventListener('pointerup', stopResizing);
        resizer.addEventListener('pointercancel', stopResizing);

        tocResizer.addEventListener('pointerdown', (e) => {
            isTocResizing = true;
            tocResizer.setPointerCapture(e.pointerId);
            document.body.style.cursor = isNarrowLayout() ? 'row-resize' : 'col-resize';
            document.body.style.userSelect = 'none';
        });

        tocResizer.addEventListener('pointermove', (e) => {
            if (!isTocResizing) return;
            resizeToc(e.clientX, e.clientY);
        });

        function stopTocResizing() {
            if (isTocResizing) {
                isTocResizing = false;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            }
        }

        tocResizer.addEventListener('pointerup', stopTocResizing);
        tocResizer.addEventListener('pointercancel', stopTocResizing);

        resizer.addEventListener('keydown', (e) => {
            const narrow = isNarrowLayout();
            const decreaseKey = narrow ? 'ArrowUp' : 'ArrowLeft';
            const increaseKey = narrow ? 'ArrowDown' : 'ArrowRight';
            if (e.key !== decreaseKey && e.key !== increaseKey) return;

            e.preventDefault();
            const rect = resizer.getBoundingClientRect();
            const step = 24 * (e.key === decreaseKey ? -1 : 1);
            resizePanels(rect.left + step, rect.top + step);
        });

        tocResizer.addEventListener('keydown', (e) => {
            const narrow = isNarrowLayout();
            const increaseKey = narrow ? 'ArrowUp' : 'ArrowLeft';
            const decreaseKey = narrow ? 'ArrowDown' : 'ArrowRight';
            if (e.key !== increaseKey && e.key !== decreaseKey) return;

            e.preventDefault();
            const rect = tocResizer.getBoundingClientRect();
            const step = 24 * (e.key === increaseKey ? -1 : 1);
            resizeToc(rect.left + step, rect.top + step);
        });

        window.addEventListener('resize', () => {
            const narrow = isNarrowLayout();
            if (narrow !== wasNarrowLayout) {
                wasNarrowLayout = narrow;
                applyDefaultPanelSizes();
                applyDefaultTocSize();
            }
        });

        applyDefaultPanelSizes();
        applyDefaultTocSize();

        // 스크롤 동기화
        // 에디터 스크롤 -> 프리뷰 스크롤 동기화
        editor.addEventListener('scroll', () => {
            if (!isSyncEnabled || isSyncingScroll) return;

            isSyncingScroll = true;

            // 에디터의 스크롤 비율 계산
            const scrollPercentage = editor.scrollTop / (editor.scrollHeight - editor.clientHeight);

            // 프리뷰를 같은 비율로 스크롤
            preview.scrollTop = scrollPercentage * (preview.scrollHeight - preview.clientHeight);

            setTimeout(() => {
                isSyncingScroll = false;
            }, 10);
        });

        // 프리뷰 스크롤 -> 에디터 스크롤 동기화
        preview.addEventListener('scroll', () => {
            if (!isSyncEnabled || isSyncingScroll) return;

            isSyncingScroll = true;

            // 프리뷰의 스크롤 비율 계산
            const scrollPercentage = preview.scrollTop / (preview.scrollHeight - preview.clientHeight);

            // 에디터를 같은 비율로 스크롤
            editor.scrollTop = scrollPercentage * (editor.scrollHeight - editor.clientHeight);

            setTimeout(() => {
                isSyncingScroll = false;
            }, 10);
        });

        // 목차 패널 토글
        toggleTocBtn.addEventListener('click', () => {
            isTocVisible = !isTocVisible;

            if (isTocVisible) {
                // 패널 표시
                applyDefaultTocSize();
                tocResizer.style.display = 'block';
                tocPanel.style.display = 'flex';
                toggleTocBtn.classList.add('bg-blue-100');
            } else {
                // 패널 숨김
                tocResizer.style.display = 'none';
                tocPanel.style.display = 'none';
                toggleTocBtn.classList.remove('bg-blue-100');
            }
        });

        // 스크롤 동기화 토글
        toggleSyncBtn.addEventListener('click', () => {
            isSyncEnabled = !isSyncEnabled;
            if (isSyncEnabled) {
                toggleSyncBtn.classList.add('bg-green-100');
                toggleSyncBtn.classList.remove('bg-red-100');
            } else {
                toggleSyncBtn.classList.remove('bg-green-100');
                toggleSyncBtn.classList.add('bg-red-100');
            }
        });

        // ===== 찾기/바꾸기 기능 =====

        // 찾기 패널 열기
        findBtn.addEventListener('click', () => {
            findReplacePanel.style.display = 'block';
            replaceRow.style.display = 'none';
            findInput.focus();
            findInput.select();
        });

        // 바꾸기 패널 열기
        replaceBtn.addEventListener('click', () => {
            findReplacePanel.style.display = 'block';
            replaceRow.style.display = 'flex';
            findInput.focus();
            findInput.select();
        });

        // 패널 닫기
        closeFindBtn.addEventListener('click', () => {
            findReplacePanel.style.display = 'none';
            clearHighlights();
        });

        // 찾기 함수
        function findInEditor(searchText) {
            if (!searchText) {
                clearHighlights();
                findCount.textContent = '0개 찾음';
                return;
            }

            const text = editor.value;
            findMatches = [];
            let index = 0;

            // 모든 매치 찾기
            while ((index = text.indexOf(searchText, index)) !== -1) {
                findMatches.push(index);
                index += searchText.length;
            }

            // 카운트 업데이트
            if (findMatches.length > 0) {
                currentMatchIndex = 0;
                findCount.textContent = `${findMatches.length}개 찾음`;
                highlightCurrentMatch();
            } else {
                currentMatchIndex = -1;
                findCount.textContent = '0개 찾음';
            }
        }

        // 현재 매치 하이라이트
        function highlightCurrentMatch() {
            if (currentMatchIndex < 0 || currentMatchIndex >= findMatches.length) return;

            const matchPos = findMatches[currentMatchIndex];
            const searchText = findInput.value;

            // 커서 이동 및 선택
            editor.focus();
            editor.setSelectionRange(matchPos, matchPos + searchText.length);

            // 스크롤하여 보이기
            const lineHeight = parseInt(window.getComputedStyle(editor).lineHeight) || 20;
            const textBeforeMatch = editor.value.substring(0, matchPos);
            const lineNumber = (textBeforeMatch.match(/\n/g) || []).length;
            editor.scrollTop = lineNumber * lineHeight - editor.clientHeight / 2;

            // 카운트 업데이트
            findCount.textContent = `${currentMatchIndex + 1}/${findMatches.length}`;
        }

        // 하이라이트 제거
        function clearHighlights() {
            findMatches = [];
            currentMatchIndex = -1;
        }

        // 이전 찾기
        findPrevBtn.addEventListener('click', () => {
            if (findMatches.length === 0) return;
            currentMatchIndex = (currentMatchIndex - 1 + findMatches.length) % findMatches.length;
            highlightCurrentMatch();
        });

        // 다음 찾기
        findNextBtn.addEventListener('click', () => {
            if (findMatches.length === 0) return;
            currentMatchIndex = (currentMatchIndex + 1) % findMatches.length;
            highlightCurrentMatch();
        });

        // 찾기 입력 변경 시
        findInput.addEventListener('input', () => {
            findInEditor(findInput.value);
        });

        // Enter 키로 다음 찾기
        findInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (e.shiftKey) {
                    findPrevBtn.click();
                } else {
                    findNextBtn.click();
                }
            } else if (e.key === 'Escape') {
                closeFindBtn.click();
            }
        });

        // 바꾸기 입력에서 Enter
        replaceInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                replaceOneBtn.click();
            } else if (e.key === 'Escape') {
                closeFindBtn.click();
            }
        });

        // 하나 바꾸기
        replaceOneBtn.addEventListener('click', () => {
            if (currentMatchIndex < 0 || currentMatchIndex >= findMatches.length) return;

            const searchText = findInput.value;
            const replaceText = replaceInput.value;
            const matchPos = findMatches[currentMatchIndex];

            // 텍스트 바꾸기
            const text = editor.value;
            editor.value = text.substring(0, matchPos) + replaceText + text.substring(matchPos + searchText.length);

            // 히스토리에 저장
            saveToHistory();

            // 다시 찾기
            findInEditor(searchText);

            // 프리뷰 업데이트
            updatePreview();
        });

        // 모두 바꾸기
        replaceAllBtn.addEventListener('click', () => {
            if (findMatches.length === 0) return;

            const searchText = findInput.value;
            const replaceText = replaceInput.value;

            // 전체 텍스트에서 모두 바꾸기
            const text = editor.value;
            const newText = text.split(searchText).join(replaceText);

            if (text !== newText) {
                editor.value = newText;
                saveToHistory();
                updatePreview();

                // 결과 표시
                const count = findMatches.length;
                findCount.textContent = `${count}개 바꿈`;

                // 다시 찾기 (남은 항목 확인)
                setTimeout(() => {
                    findInEditor(searchText);
                }, 100);
            }
        });

        // 키보드 단축키
        document.addEventListener('keydown', (e) => {
            // Ctrl+F: 찾기
            if (e.ctrlKey && e.key === 'f') {
                e.preventDefault();
                findBtn.click();
            }
            // Ctrl+H: 바꾸기
            else if (e.ctrlKey && e.key === 'h') {
                e.preventDefault();
                replaceBtn.click();
            }
        });

        // ===== 찾기/바꾸기 기능 끝 =====

        // 페이지 로드 시 초기화
        window.addEventListener('DOMContentLoaded', initialize);

        // CDN 로드 실패 감지
        window.addEventListener('error', (e) => {
            if (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK') {
                console.error('❌ 외부 리소스 로드 실패:', e.target.src || e.target.href);
                alert('일부 라이브러리를 로드하는데 실패했습니다.\n인터넷 연결을 확인해주세요.');
            }
        }, true);

    </script>
</body>
</html>
