            { code: 'DATE_NO_END_DOT', severity: 'warning', pattern: /\b\d{4}\.\s\d{1,2}\.\s\d{1,2}(?!\s*[.\d(])/g,
              message: "날짜의 '일' 다음에 마침표(.)를 찍어야 함", suggest: '예) 2025. 1. 6.' },
            { code: 'DATE_HYPHEN', severity: 'warning', skipTable: true,
              pattern: /(?<![\/=&?#%.\w-])(?:19|20)\d{2}-\d{1,2}-\d{1,2}(?![\/\w-])/g,
              message: '날짜는 하이픈(-) 대신 온점으로 구분하고 온점 뒤 한 칸 띄움', suggest: '예) 2026. 7. 18.' },
            { code: 'TIME_AMPM', severity: 'error', pattern: /(오전|오후|아침|밤|낮)\s*\d{1,2}\s*시/g,
              message: '24시각제 숫자로 표기(오전/오후 사용 안 함)', suggest: '예) 09:00, 15:30' },
            { code: 'TIME_24H', severity: 'warning', pattern: /(?<!\d)24\s*시(?!각)/g,
              message: "'24시'보다 익일 00:00 또는 '18:00까지' 권장", suggest: '예) 18:00' },
            { code: 'TIME_COLON_SP', severity: 'error', pattern: /\b\d{1,2}\s+:\s*\d{2}\b|\b\d{1,2}:\s+\d{2}\b/g,
              message: '시와 분 사이 쌍점은 양쪽을 붙여 씀', suggest: '예) 13:20' },
            { code: 'MONEY_CHEONWON', severity: 'error', pattern: /\d+\s*천\s*원/g,
              message: "금액은 '천원'으로 줄이지 않고 아라비아 숫자로", suggest: '예) 345,000원' },
            { code: 'MONEY_GEUM_SP', severity: 'warning', pattern: /금\s+\d/g,
              message: "'금'과 숫자 사이는 붙여 쓰는 것이 원칙", suggest: '예) 금113,560원' },
            { code: 'BUNIM_COLON', severity: 'error', pattern: /붙\s*임\s*:/g,
              message: "'붙임' 다음에 쌍점(:)을 붙이지 않음(2타 띄움)", suggest: '예) 붙임  계획서 1부.' },
            { code: 'KKAJI_DUP', severity: 'error', pattern: /[∼~～][^\n]{0,20}?까지/g,
              message: "물결표(∼)와 '까지'를 함께 쓰지 않음", suggest: '예) ’26. 2. 20. ∼ 2. 24.' },
            { code: 'FOREIGN_FIRST', severity: 'warning', pattern: /\b[A-Z]{2,5}\s*\([가-힣]/g,
              message: '한글을 먼저 쓰고 괄호 안에 외국어를 병기', suggest: '예) 업무 협약(MOU)' },
            { code: 'COLON_SPACE', severity: 'warning', skipTable: true,
              pattern: /\S\s+:(?!\/\/)|\S:(?!\/\/)[^\s\d<*_]/g,
              message: '쌍점은 앞말에 붙이고 뒤는 한 칸 띄움', suggest: '예) 원장: 김갑동' },
            { code: 'MONEY_NO_HANGUL', severity: 'warning', pattern: /금\d[\d,]*원(?![\s]*[(（])/g,
              message: '금액은 숫자 다음 괄호 안에 한글 병기', suggest: '예) 금113,560원(금일십일만삼천오백육십원)' },
            { code: 'TILDE_ASCII', severity: 'warning', pattern: /[\d’')][ \t]*~[ \t]*(?=[\d’'])/g,
              message: "범위 물결은 '∼'(U+223C)로 적음 — 한글(개조) 내보내기는 자동 변환", suggest: '예) ’24 ∼ ’26' },
            { code: 'DUEUM_ERROR', severity: 'warning',
              pattern: /(?<![가-힣\d])(?<!\d[ \t]{1,3})(?<![(（>|][ \t]*)(?<![ \t][ \t])년(?:도별|도|간|말|초|차|세|내)(?![가-힣])(?![ \t]*(?:<\/t[dh]>|\|))/g,
              message: "어두의 '년'은 두음법칙에 따라 '연'으로 적음", suggest: '예) 연도, 연간, 연말, 연초' },
            { code: 'LOANWORD_ERROR', severity: 'warning', pattern: lintWordRe(LINT_LOANWORDS), dict: LINT_LOANWORDS,
              message: '외래어 표기법에 맞지 않는 표기', suggest: '예) 콘텐츠·애플리케이션·메시지·워크숍' },
            { code: 'DISCRIMINATORY_TERM', severity: 'warning', pattern: lintWordRe(LINT_DISCRIM), dict: LINT_DISCRIM,
              message: '차별·비하 표현은 순화어로', suggest: '예) 장애자→장애인, 편부모→한부모' },
            { code: 'AI_EM_DASH', severity: 'warning', pattern: /[—–―]/g,
              message: '줄표(— – ―)는 공문서 표기 관행에 맞지 않음(생성형 AI 문체 흔적)', suggest: '쉼표·괄호·가운뎃점(·)으로 풀어쓰기' },
            { code: 'AI_BOLD_OVERUSE', severity: 'warning', pattern: /(?:\*\*[^*\n]+\*\*[^*\n]*){3}/g,
              message: '한 줄에 강조(**) 3회 이상 — 강조 남발은 생성형 AI 문체 흔적', suggest: '리드어·핵심 수치 한 곳만 강조' }
        ];

        /**
         * 금액 숫자를 한글로 (113560 → 일십일만삼천오백육십)
         */
        function hangulAmount(value) {
            const digits = String(value).replace(/[^\d]/g, '').replace(/^0+/, '');
            if (!digits) return '영';
            const num = '영일이삼사오육칠팔구';
            const small = ['', '십', '백', '천'];
            const big = ['', '만', '억', '조', '경'];
            let out = '';
            const groups = [];
            for (let end = digits.length; end > 0; end -= 4) groups.unshift(digits.slice(Math.max(0, end - 4), end));
            groups.forEach((group, gi) => {
                let part = '';
                group.padStart(4, '0').split('').forEach((d, i) => {
                    if (d !== '0') part += num[d] + small[3 - i];
                });
                if (part) out += part + big[groups.length - 1 - gi];
            });
            return out;
        }

        // 개조식 문체 — 실측 임계(항목 중앙 31자, 결론 중앙 30자, 리드문 40∼120자)
        const LINT_ABSTRACT = ['사람', '마음', '본질', '전환', '태도', '문화', '철학', '가치', '정신', '관계',
            '신뢰', '과정', '질문', '이야기', '경험', '시간', '공간', '연결', '변화', '미래',
            '시작', '용기', '의지', '방법', '자세', '의식', '역량'];

        function lintClassifyLine(raw) {
            const indent = raw.length - raw.trimStart().length;
            const t = raw.trim();
            if (!t) return null;
            if (t.startsWith('#') || t.startsWith('|') || t.startsWith('![') || /^[-=*_]{3,}$/.test(t) || /^\((\d{1,2})\)$/.test(t)) return null;
            if (t.startsWith('>')) return { kind: 'lead', body: t.slice(1).trim() };
            if (/^(?:⇒|⇨|=>|➡|→)/.test(t)) return { kind: 'concl', body: t.replace(/^(?:⇒|⇨|=>|➡|→)\s*/, '') };
            if (/^(?:※|\*\*?\s)/.test(t)) return { kind: 'note', body: t.replace(/^(?:※|\*\*?)\s*/, '') };
            if (/^[□ㅁ■]/.test(t)) return { kind: 'dae', body: t.slice(1).trim() };
            if (/^(?:○|❍|ㅇ|◦|◯)/.test(t)) return { kind: 'item', body: t.slice(1).trim() };
            const li = /^(?:[-•ㆍ·▸]|\d+[.)])\s+(.*)$/.exec(t);
            if (li) return { kind: indent >= 2 ? 'sub' : 'item', body: li[1].trim() };
            return { kind: 'para', body: t };
        }

        function lintMuncheLine(no, raw, add, lead) {
            const c = lintClassifyLine(raw);
            if (!c) { lead.flush(); return; }
            const plain = c.body.replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/(\*\*|__|~~|`)/g, '').trim();
            if (c.kind === 'lead') { lead.buf.push({ line: no, body: plain }); return; }
            lead.flush();
            if (!plain) return;
            const q = plain.replace(/[“"'‘][^”"'’]{0,80}[”"'’]/g, '').replace(/\([^)]{0,80}\)/g, '');
            if (c.kind === 'item' || c.kind === 'sub' || c.kind === 'concl' || c.kind === 'para') {
                if (/[가-힣]다\.?$/.test(q)) add(no, 'error', 'DA_ENDING', plain, "'∼다' 서술형 종결 — 개조식은 명사·명사구로 끝맺음", "명사·명사구 또는 '∼함/있음'으로");
                if (/것(?:이다|임)\.?$/.test(q)) add(no, 'warning', 'GEOSIDA', plain, "'∼것이다/것임' 종결", '명사 종결로');
            }
            if (/(?:해야|하여야|되어야|돼야|필요가 있)\s*(?:한다|함|합니다|하겠음)\.?$|할 것\.?$/.test(q)) {
                add(no, 'error', 'DEONTIC', plain, "'∼해야 한다' 당위 종결 — 판단은 명사로 끝맺음", '예) ⇨ 지역맞춤형 보급 필요');
            }
            for (const m of q.matchAll(/(?:아니라|아닌|아니고|아니며)\s*,?\s*([가-힣]{1,12})/g)) {
                const tail = m[1] || '';
                if (LINT_ABSTRACT.some(w => tail.includes(w))) {
                    add(no, 'error', 'RHETORIC_CONTRAST', m[0].trim(), "'아니라 " + tail + "' — B가 추상어·가치어면 수사", '두 구체 선택지를 가르는 경우만 허용');
                } else {
                    add(no, 'warning', 'CONTRAST_CHECK', m[0].trim(), "'아니라 " + tail + "' — B가 구체 선택지인지 확인");
                }
            }
            if (c.kind !== 'note' && /[?!？！]/.test(q)) add(no, 'error', 'QUESTION_EXCLAIM', plain, '물음표·느낌표는 개조식 본문에 쓰지 않음');
            if ((c.kind === 'item' || c.kind === 'para' || c.kind === 'dae') && /[은는이가]\s*[^,]{2,15},\s*[^,]{2,15}[은는이가]\s*[^,]{2,15}$/.test(q)) {
                add(no, 'warning', 'COUPLET', plain, '대구(對句) 슬로건 문장으로 보임', '목표 수치·명사로');
            }
            if (c.kind === 'item' && plain.length > 70) add(no, 'warning', 'ITEM_LONG', plain, '항목 ' + plain.length + '자 — 2줄 이내 권장(실측 중앙 31자)', '근거·예시는 세부(-)로 내림');
            if (c.kind === 'concl' && plain.length > 60) add(no, 'warning', 'CONCL_LONG', plain, '결론 ' + plain.length + '자 — 실측 중앙 30자', '판단 하나만 남김');
            if (/\d{4}년\s*\d{1,2}월/.test(plain)) add(no, 'warning', 'DATE_KOREAN', plain, '연·월을 글자로 표기', '예) 2026. 8. 22.');
        }

        /**
         * 마크다운 원고 검사 — [{ line, severity, rule, match, message, suggest }]
         * 코드블럭은 건너뛰되, 언어 지정 없이 붙여 넣은 개조식 초안(ㅁ/ㅇ/- 줄)은 검사한다
         */
        function lintMarkdown(text, options) {
            const opts = Object.assign({ notation: true, munche: true, strict: false }, options);
            const findings = [];
            const lines = String(text).split(/\r?\n/);
            // 검사할 줄 표시 — 일반 펜스 코드는 제외
            const check = new Array(lines.length).fill(true);
            let fence = null;
            for (let i = 0; i < lines.length; i++) {
                const m = /^\s*(```+|~~~+)\s*([\w-]*)/.exec(lines[i]);
                if (!fence && m) { fence = { mark: m[1][0], lang: m[2], start: i }; check[i] = false; continue; }
                if (fence && m && m[1][0] === fence.mark && !m[2]) {
                    const body = lines.slice(fence.start + 1, i);
                    const outline = (!fence.lang || /^(text|txt|plain|plaintext|md|markdown)$/i.test(fence.lang))
                        && hwpxGovLooksLikeOutline(body);
                    for (let k = fence.start + 1; k < i; k++) check[k] = outline;
                    check[i] = false;
                    fence = null;
                    continue;
                }
                if (fence) check[i] = false;
            }
            if (fence) for (let k = fence.start; k < lines.length; k++) check[k] = false;

            const add = (line, severity, rule, match, message, suggest) =>
                findings.push({ line, severity, rule, match: String(match).slice(0, 60), message, suggest });
            const lead = {
                buf: [],
                flush() {
                    if (!this.buf.length) return;
                    const block = this.buf.map(l => l.body).join(' ').trim();
                    const at = this.buf[0].line;
                    const bulleted = this.buf.every(l => /^[▪■□○ㅇㅁ●\-–ㆍ·•*※]/u.test(l.body));
                    this.buf = [];
                    if (bulleted || block.length < 20) return;
                    if (!/(?:하고자|하려|고자)\s*함\.?$/.test(block)) add(at, 'warning', 'LEAD_ENDING', block, "리드문은 '∼하고자 함.' 한 문장", '[수단]하고, [수단]하여 [목적]하고자 함.');
                    const sentences = (block.match(/\./g) || []).length;
                    if (block.length > 140 || sentences > 1) add(at, 'warning', 'LEAD_LONG', block, '리드문 ' + block.length + '자·문장 ' + sentences + '개 — 한 문장 40∼120자 권장', '수단 둘·목적 하나로 압축');
                }
            };
            lines.forEach((line, i) => {
                if (!check[i]) { lead.flush(); return; }
                const no = i + 1;
                if (opts.notation) {
                    const tableLine = /^\s*\|/.test(line) || /<t[dhr][\s>]/i.test(line);
                    LINT_NOTATION_RULES.forEach(rule => {
                        if (rule.strict && !opts.strict) return;
                        if (rule.skipTable && tableLine) return;
                        rule.pattern.lastIndex = 0;
                        for (const m of line.matchAll(rule.pattern)) {
                            const hit = m[0].trim();
                            let suggest = rule.suggest;
                            if (rule.dict) {
                                const pair = rule.dict.find(w => w[0] === hit);
                                if (pair) suggest = pair[0] + ' → ' + pair[1];
                            } else if (rule.code === 'MONEY_NO_HANGUL') {
                                suggest = hit + ' → ' + hit + '(금' + hangulAmount(hit) + '원)';
                            } else if (rule.code === 'DATE_HYPHEN') {
                                const d = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(hit);
                                if (d) suggest = hit + ' → ' + d[1] + '. ' + Number(d[2]) + '. ' + Number(d[3]) + '.';
                            }
                            add(no, rule.severity, rule.code, hit, rule.message, suggest);
                        }
                    });
                }
                if (opts.munche) lintMuncheLine(no, line, add, lead);
            });
            lead.flush();
            return findings.sort((a, b) => a.line - b.line);
        }

        /**
         * 검사 패널 갱신
         */
        function refreshLintPanel() {
            const panel = document.getElementById('lintPanel');
            if (!panel || panel.style.display === 'none') return;
            const findings = lintMarkdown(editor.value, {
                notation: document.getElementById('lintNotation').checked,
                munche: document.getElementById('lintMunche').checked,
                strict: document.getElementById('lintStrict').checked
            });
            const list = document.getElementById('lintList');
            list.replaceChildren();
            const errors = findings.filter(f => f.severity === 'error').length;
            document.getElementById('lintSummary').textContent = findings.length === 0
                ? '문제 없음'
                : '오류 ' + errors + '건 · 경고 ' + (findings.length - errors) + '건';
            findings.slice(0, 300).forEach(f => {
                const item = document.createElement('li');
                const line = document.createElement('span');
                line.className = 'lint-line';
                line.textContent = 'L' + f.line;
                const sev = document.createElement('span');
                sev.className = f.severity === 'error' ? 'lint-error' : 'lint-warning';
                sev.textContent = (f.severity === 'error' ? '오류' : '경고') + ' ' + f.rule;
                const msg = document.createElement('span');
                msg.textContent = '「' + f.match + '」 ' + f.message;
                item.append(line, sev, msg);
                if (f.suggest) {
                    const sug = document.createElement('span');
                    sug.className = 'lint-suggest';
                    sug.textContent = '(' + f.suggest + ')';
                    item.appendChild(sug);
                }
                item.title = '클릭하면 해당 줄로 이동';
                item.addEventListener('click', () => goToEditorLine(f.line, f.match));
                list.appendChild(item);
            });
        }

        /**
         * 에디터의 n번째 줄(1부터)로 이동해 걸린 부분을 선택
         */
        function goToEditorLine(lineNo, match) {
            const lines = editor.value.split('\n');
            let start = 0;
            for (let i = 0; i < lineNo - 1 && i < lines.length; i++) start += lines[i].length + 1;
            const lineText = lines[lineNo - 1] || '';
            const within = match ? lineText.indexOf(match) : -1;
            const selStart = start + Math.max(within, 0);
            const selEnd = within >= 0 ? selStart + match.length : start + lineText.length;
            editor.focus();
            editor.setSelectionRange(selStart, selEnd);
            const lineHeight = parseInt(window.getComputedStyle(editor).lineHeight) || 20;
            editor.scrollTop = (lineNo - 1) * lineHeight - editor.clientHeight / 2;
        }

        /* ==========================================================
         * 한글(.hwpx)·Word(.docx) 열기 — 브라우저에서 바로 마크다운으로 변환
         * 제목(개요·제목 스타일), 굵게·기울임·취소선·위/아래 첨자, 목록, 표(병합은 HTML 표),
         * 그림(data URL), 각주, 하이퍼링크, 수식(한/글 수식 → LaTeX 근사, Word 수식 → LaTeX)을 옮긴다
         * ========================================================== */

        /**
         * ZIP 읽기 — Map(이름 → Uint8Array). DEFLATE는 브라우저 DecompressionStream으로 푼다
         */
        async function readZipEntries(buffer) {
            const bytes = new Uint8Array(buffer);
            const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
            let eocd = bytes.length - 22;
            while (eocd >= 0 && view.getUint32(eocd, true) !== 0x06054b50) eocd--;
            if (eocd < 0) throw new Error('ZIP 형식이 아닙니다 (HWP 5.0 이전 형식은 한/글에서 HWPX로 저장 후 여세요)');
            const count = view.getUint16(eocd + 10, true);
            let p = view.getUint32(eocd + 16, true);
            const decoder = new TextDecoder();
            const files = new Map();
            for (let i = 0; i < count; i++) {
                if (view.getUint32(p, true) !== 0x02014b50) throw new Error('ZIP 중앙 디렉터리가 손상되었습니다');
                const method = view.getUint16(p + 10, true);
                const csize = view.getUint32(p + 20, true);
                const nameLen = view.getUint16(p + 28, true);
                const extraLen = view.getUint16(p + 30, true);
                const commentLen = view.getUint16(p + 32, true);
                const offset = view.getUint32(p + 42, true);
                const name = decoder.decode(bytes.subarray(p + 46, p + 46 + nameLen));
                const start = offset + 30 + view.getUint16(offset + 26, true) + view.getUint16(offset + 28, true);
                const raw = bytes.subarray(start, start + csize);
                if (method === 0) {
                    files.set(name, raw);
                } else if (method === 8) {
                    if (typeof DecompressionStream === 'undefined') throw new Error('이 브라우저는 압축 해제(DecompressionStream)를 지원하지 않습니다');
                    const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
                    files.set(name, new Uint8Array(await new Response(stream).arrayBuffer()));
                }
                p += 46 + nameLen + extraLen + commentLen;
            }
            return files;
        }

        // 요소 탐색 도우미 (네임스페이스 접두어 무시)
        const xLocal = el => el.localName || String(el.nodeName).replace(/^.*:/, '');
        const xKids = (el, name) => el ? Array.from(el.children).filter(c => !name || xLocal(c) === name) : [];
        const xFirst = (el, name) => xKids(el, name)[0] || null;
        const xAll = (el, name) => el ? Array.from(el.getElementsByTagName('*')).filter(c => xLocal(c) === name) : [];
        const xAttr = (el, name) => {
            if (!el) return null;
            if (el.hasAttribute(name)) return el.getAttribute(name);
            const attr = Array.from(el.attributes).find(a => a.localName === name);
            return attr ? attr.value : null;
        };

        function bytesToDataUrl(bytes, mime) {
            let binary = '';
            for (let i = 0; i < bytes.length; i += 0x8000) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
            }
            return 'data:' + mime + ';base64,' + btoa(binary);
        }

        function imageMime(name, bytes) {
            const kind = sniffImageType(bytes) || (/\.(\w+)$/.exec(name) || [])[1] || 'png';
            return { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', bmp: 'image/bmp' }[String(kind).toLowerCase()] || 'image/png';
        }

        // 마크다운 문자로 해석되지 않도록 본문 글자를 이스케이프
        function mdEscapeText(text) {
            return String(text).replace(/([\\`*_\[\]<>~|])/g, '\\$1');
        }

        /**
         * 서식 조각 목록 → 마크다운 인라인 (같은 서식 조각은 합쳐서 한 번만 감싼다)
         * 조각: { text, fmt:{bold,italic,strike,sup,sub} } 또는 { md } (이미 마크다운인 조각)
         */
        function mdInlineFromSegments(segments) {
            const merged = [];
            segments.forEach(seg => {
                const last = merged[merged.length - 1];
                if (seg.text != null && last && last.text != null && JSON.stringify(last.fmt) === JSON.stringify(seg.fmt)) {
                    last.text += seg.text;
                } else {
                    merged.push(Object.assign({}, seg));
                }
            });
            return merged.map(seg => {
                if (seg.md != null) return seg.md;
                const f = seg.fmt || {};
                return seg.text.split('\n').map(line => {
                    const m = /^(\s*)([\s\S]*?)(\s*)$/.exec(line);
                    if (!m[2]) return line;
                    let core = mdEscapeText(m[2]);
                    if (f.sup) core = '<sup>' + core + '</sup>';
                    else if (f.sub) core = '<sub>' + core + '</sub>';
                    if (f.strike) core = '~~' + core + '~~';
                    if (f.bold && f.italic) core = '***' + core + '***';
                    else if (f.bold) core = '**' + core + '**';
                    else if (f.italic) core = '*' + core + '*';
                    return m[1] + core + m[3];
                }).join('\n');
            }).join('');
        }

        /**
         * 셀 격자 → 마크다운 표 (병합·여러 줄이 있으면 HTML 표, 아니면 GFM 표)
         * cells: [{ row, col, rowSpan, colSpan, header, md, text }]
         */
        function mdTableFromCells(cells) {
            if (cells.length === 0) return '';
            const rowCount = Math.max(...cells.map(c => c.row + c.rowSpan));
            const colCount = Math.max(...cells.map(c => c.col + c.colSpan));
            const merged = cells.some(c => c.rowSpan > 1 || c.colSpan > 1);
            const multiline = cells.some(c => /\n/.test(c.md));
            if (merged || multiline || rowCount < 1) {
                const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                let html = '<table>\n';
                for (let r = 0; r < rowCount; r++) {
                    const rowCells = cells.filter(c => c.row === r).sort((a, b) => a.col - b.col);
                    if (rowCells.length === 0) continue;
                    html += '<tr>' + rowCells.map(c => {
                        const tag = c.header ? 'th' : 'td';
                        return '<' + tag + (c.colSpan > 1 ? ' colspan="' + c.colSpan + '"' : '') + (c.rowSpan > 1 ? ' rowspan="' + c.rowSpan + '"' : '') + '>'
                            + esc(c.text).replace(/\n/g, '<br>') + '</' + tag + '>';
                    }).join('') + '</tr>\n';
                }
                return html + '</table>';
            }
            const grid = Array.from({ length: rowCount }, () => new Array(colCount).fill(''));
            cells.forEach(c => { grid[c.row][c.col] = c.md.replace(/\|/g, '\\|'); });
            const line = row => '| ' + row.map(v => v || ' ').join(' | ') + ' |';
            return [line(grid[0]), '|' + grid[0].map(() => ' --- ').join('|') + '|'].concat(grid.slice(1).map(line)).join('\n');
        }

        /**
         * 블록 목록 → 마크다운 문서 (연속된 목록 항목은 빈 줄 없이 잇는다)
         */
        function mdJoinBlocks(blocks, notes) {
            let out = '';
            blocks.forEach((block, i) => {
                const prev = blocks[i - 1];
                if (i > 0) out += (block.list && prev && prev.list) ? '\n' : '\n\n';
                out += block.md;
            });
            if (notes.length) {
                out += '\n\n' + notes.map((note, i) => '[^' + (i + 1) + ']: ' + note.replace(/\n+/g, ' ')).join('\n');
            }
            return out.replace(/\n{3,}/g, '\n\n').trim() + '\n';
        }

        // 한/글 수식 스크립트 → LaTeX (근사 — 이 편집기가 내보내는 어휘 위주)
        const HWPX_EQ_TO_TEX = (() => {
            const map = {};
            Object.keys(HWPX_EQ_COMMANDS).forEach(cmd => {
                const token = HWPX_EQ_COMMANDS[cmd];
                if (!(token in map) || cmd.length < map[token].length) map[token] = cmd;
            });
            return map;
        })();
        function eqEditToLatex(script) {
            let s = ' ' + String(script).replace(/\s+/g, ' ') + ' ';
            // 기호 토큰 → LaTeX 명령
            s = s.replace(/(^|[\s{}(])([A-Za-z]+|!=|\+-|-\+|->|<->|<<|>>|==)(?=[\s{}()^_]|$)/g, (m, pre, tok) => {
                if (tok === 'over' || tok === 'root' || tok === 'of' || tok === 'sqrt' || tok === 'LEFT' || tok === 'RIGHT' || tok === 'atop') return m;
                if (HWPX_EQ_TO_TEX[tok]) return pre + '\\' + HWPX_EQ_TO_TEX[tok] + ' ';
                if (HWPX_EQ_FUNCTIONS.has(tok)) return pre + '\\' + tok + ' ';
                return m;
            });
            // {a} over {b} → \frac{a}{b} (안쪽부터 반복)
            for (let guard = 0; guard < 20; guard++) {
                const next = s.replace(/\{([^{}]*)\}\s*over\s*\{([^{}]*)\}/, '\\frac{$1}{$2}');
                if (next === s) break;
                s = next;
            }
            s = s.replace(/root\s*\{([^{}]*)\}\s*of\s*\{/g, '\\sqrt[$1]{').replace(/\bsqrt\s*\{/g, '\\sqrt{')
                .replace(/\bLEFT\s*/g, '\\left').replace(/\bRIGHT\s*/g, '\\right').replace(/\s#\s/g, ' \\\\ ')
                .replace(/"([^"]*)"/g, '\\text{$1}').replace(/`/g, '\\,').replace(/~/g, '\;');
            return s.replace(/\s+/g, ' ').trim();
        }

        /**
         * HWPX 파일 묶음 → 마크다운
         */
        function hwpxToMarkdown(files) {
            const decoder = new TextDecoder();
            const parser = new DOMParser();
            const xmlOf = name => files.has(name) ? parser.parseFromString(decoder.decode(files.get(name)), 'application/xml') : null;
            const fileOf = href => files.get(href) || files.get('Contents/' + href) || null;

            // 매니페스트: id → href, spine 순서의 섹션
            const hpf = xmlOf('Contents/content.hpf');
            const items = new Map();
            let sections = [];
            if (hpf) {
                xAll(hpf.documentElement, 'item').forEach(item => items.set(item.getAttribute('id'), item.getAttribute('href')));
                sections = xAll(hpf.documentElement, 'itemref').map(ref => items.get(ref.getAttribute('idref')))
                    .filter(href => href && /section\d+\.xml$/.test(href));
            }
            if (sections.length === 0) {
                sections = Array.from(files.keys()).filter(n => /^Contents\/section\d+\.xml$/.test(n))
                    .sort((a, b) => parseInt(a.replace(/\D/g, ''), 10) - parseInt(b.replace(/\D/g, ''), 10));
            }

            // 글자 모양(굵게·기울임…)과 문단 모양(개요 수준), 스타일(개요 N)
            const header = xmlOf('Contents/header.xml');
            const charFmt = new Map();
            const paraOutline = new Map();
            const styleOutline = new Map();
            if (header) {
                xAll(header.documentElement, 'charPr').forEach(cp => {
                    const strike = xFirst(cp, 'strikeout');
                    const offset = xFirst(cp, 'offset');
                    const off = offset ? parseInt(offset.getAttribute('hangul') || '0', 10) : 0;
                    charFmt.set(cp.getAttribute('id'), {
                        bold: !!xFirst(cp, 'bold'), italic: !!xFirst(cp, 'italic'),
                        strike: !!(strike && !/^NONE$/i.test(strike.getAttribute('shape') || 'NONE')),
                        sup: off > 0, sub: off < 0
                    });
                });
                xAll(header.documentElement, 'paraPr').forEach(pp => {
                    const heading = xAll(pp, 'heading')[0];
                    if (heading && heading.getAttribute('type') === 'OUTLINE') {
                        paraOutline.set(pp.getAttribute('id'), parseInt(heading.getAttribute('level') || '0', 10));
                    }
                });
                xAll(header.documentElement, 'style').forEach(st => {
                    const m = /^개요\s*(\d+)$/.exec(st.getAttribute('name') || '');
                    if (m) styleOutline.set(st.getAttribute('id'), parseInt(m[1], 10) - 1);
                });
            }

            const notes = [];
            const blocks = [];

            // 문단 → { segments, blocks(표·그림 등 딸린 블록) }
            function paragraphContent(p, inCell) {
                const segments = [];
                const extra = [];
                let link = null;
                xKids(p, 'run').forEach(run => {
                    const fmt = charFmt.get(run.getAttribute('charPrIDRef')) || {};
                    const plainFmt = { bold: !!fmt.bold, italic: !!fmt.italic, strike: !!fmt.strike, sup: !!fmt.sup, sub: !!fmt.sub };
                    xKids(run).forEach(child => {
                        const name = xLocal(child);
                        if (name === 't') {
                            let text = '';
                            child.childNodes.forEach(node => {
                                if (node.nodeType === 3) text += node.nodeValue;
                                else if (node.nodeType === 1) {
                                    const n = xLocal(node);
                                    if (n === 'tab') text += '\t';
                                    else if (n === 'nbSpace' || n === 'fwSpace' || n === 'hwSpace') text += ' ';
                                    else if (n === 'lineBreak') text += '\n';
                                }
                            });
                            if (text) segments.push({ text, fmt: plainFmt });
                        } else if (name === 'tbl') {
                            if (inCell) segments.push({ text: tableText(child), fmt: {} });
                            else extra.push(tableBlock(child));
                        } else if (name === 'pic') {
                            const img = xAll(child, 'img')[0];
                            const href = img && items.get(img.getAttribute('binaryItemIDRef'));
                            const bytes = href && fileOf(href);
                            if (bytes) segments.push({ md: '![그림](' + bytesToDataUrl(bytes, imageMime(href, bytes)) + ')' });
                        } else if (name === 'equation') {
                            const script = xAll(child, 'script')[0];
                            if (script) segments.push({ md: '\\(' + eqEditToLatex(script.textContent) + '\\)' });
                        } else if (name === 'chart') {
                            segments.push({ text: '[차트]', fmt: {} });
                        } else if (name === 'ctrl') {
                            xKids(child).forEach(ctrl => {
                                const c = xLocal(ctrl);
                                if (c === 'footNote' || c === 'endNote') {
                                    const text = xAll(ctrl, 'p').map(np => mdInlineFromSegments(paragraphContent(np, true).segments)).join(' ')
                                        .replace(/^\s*\d+\)\s*/, '').trim();
                                    notes.push(text);
                                    segments.push({ md: '[^' + notes.length + ']' });
                                } else if (c === 'fieldBegin' && ctrl.getAttribute('type') === 'HYPERLINK') {
                                    const path = xAll(ctrl, 'stringParam').find(sp => sp.getAttribute('name') === 'Path');
                                    link = { href: path ? path.textContent : '', start: segments.length };
                                } else if (c === 'fieldEnd' && link) {
                                    const inner = segments.splice(link.start);
                                    const text = mdInlineFromSegments(inner);
                                    segments.push({ md: /^(https?:|mailto:)/i.test(link.href) ? '[' + text + '](' + link.href.replace(/[()\s]/g, encodeURIComponent) + ')' : text });
                                    link = null;
                                }
                            });
                        }
                    });
                });
                return { segments, extra };
            }

            function tableCells(tbl) {
                const cells = [];
                xKids(tbl, 'tr').forEach((tr, r) => {
                    xKids(tr, 'tc').forEach((tc, c) => {
                        const addr = xFirst(tc, 'cellAddr');
                        const span = xFirst(tc, 'cellSpan');
                        const isHeader = tc.getAttribute('header') === '1' || tc.getAttribute('header') === 'true';
                        const paragraphs = xKids(xFirst(tc, 'subList'), 'p').map(p => paragraphContent(p, true));
                        const unbold = segs => isHeader ? segs.map(sg => sg.fmt ? Object.assign({}, sg, { fmt: Object.assign({}, sg.fmt, { bold: false }) }) : sg) : segs;
                        const md = paragraphs.map(pc => mdInlineFromSegments(unbold(pc.segments)).trim()).filter(Boolean).join('\n');
                        const text = paragraphs.map(pc => pc.segments.map(sg => sg.text != null ? sg.text : '').join('').trim()).filter(Boolean).join('\n');
                        cells.push({
                            row: addr ? parseInt(addr.getAttribute('rowAddr'), 10) : r,
                            col: addr ? parseInt(addr.getAttribute('colAddr'), 10) : c,
                            rowSpan: span ? parseInt(span.getAttribute('rowSpan'), 10) || 1 : 1,
                            colSpan: span ? parseInt(span.getAttribute('colSpan'), 10) || 1 : 1,
                            header: isHeader,
                            md: md.replace(/\t/g, ' '), text: text.replace(/\t/g, ' ')
                        });
                    });
                });
                return cells;
            }
            function tableText(tbl) {
                return tableCells(tbl).map(c => c.text).join(' ');
            }
            // 제목 문단만 든 1행 표(표지·배너)는 표 대신 제목으로 풀어 쓴다
            function tableBlock(tbl) {
                const rows = xKids(tbl, 'tr');
                if (rows.length === 1) {
                    const headings = xAll(tbl, 'p').map(p => paragraphBlock(p, true)).filter(b => b && b.heading);
                    if (headings.length) return { md: headings.map(b => b.md).join('\n\n') };
                }
                return { md: mdTableFromCells(tableCells(tbl)) };
            }

            function paragraphBlock(p, onlyHeading) {
                const level = paraOutline.has(p.getAttribute('paraPrIDRef'))
                    ? paraOutline.get(p.getAttribute('paraPrIDRef'))
                    : styleOutline.get(p.getAttribute('styleIDRef'));
                if (onlyHeading && level == null) return null;
                const content = paragraphContent(p, !!onlyHeading);
                if (level != null) {
                    // 제목은 스타일로 굵으므로 굵게 표시를 빼고, 개조식 부호(번호 박스·ㅁ·ㅇ·◈)와 탭도 뺀다
                    const plainSegs = content.segments.map(sg => sg.fmt ? Object.assign({}, sg, { fmt: Object.assign({}, sg.fmt, { bold: false }) }) : sg);
                    const md = mdInlineFromSegments(plainSegs).replace(/^[ \t\u00A0]+/, '')
                        .replace(/^(?:\d{1,3}|[ㅁㅇ□○◦·\-])\t/, '').replace(/^◈\s*/, '').replace(/\t/g, ' ').trim();
                    return md ? { md: '#'.repeat(Math.min(level + 1, 6)) + ' ' + md.replace(/\n/g, ' '), heading: true, extra: content.extra } : { md: '', extra: content.extra };
                }
                let md = mdInlineFromSegments(content.segments).replace(/^[ \t\u00A0]+/, '')
                    .replace(/\]\(([^)\s]+)\)\(\1\)/g, ']($1)')   // 인쇄용으로 덧붙인 (URL) 제거
                    .replace(/\n[ \t]+/g, '\n');
                // 서술식 목록 부호(□○● · 1.1.)는 마크다운 목록으로
                const bullet = /^([□○●])\t/.exec(md);
                if (bullet) return { md: '   '.repeat('□○●'.indexOf(bullet[1])) + '- ' + md.slice(2), list: true, extra: content.extra };
                const numbered = /^(\d+(?:\.\d+)*)\.\t/.exec(md);
                if (numbered) {
                    const depth = numbered[1].split('.').length - 1;
                    return { md: '   '.repeat(depth) + numbered[1].split('.').pop() + '. ' + md.slice(numbered[0].length), list: true, extra: content.extra };
                }
                // 개조식 부호 뒤 탭은 한 칸 공백으로 (ㅇ⇥본문 → ㅇ 본문)
                md = md.replace(/^(\S{1,4})\t/, '$1 ');
                return { md, list: /^- /.test(md), extra: content.extra };
            }

            sections.forEach(href => {
                const doc = xmlOf(href.startsWith('Contents/') ? href : 'Contents/' + href) || xmlOf(href);
                if (!doc) return;
                xKids(doc.documentElement, 'p').forEach(p => {
                    const block = paragraphBlock(p, false);
                    if (block.md.trim()) blocks.push({ md: block.md, list: !!block.list });
                    block.extra.forEach(extra => { if (extra.md.trim()) blocks.push(extra); });
                });
            });
            return mdJoinBlocks(blocks, notes);
        }

        // Word 수식(OMML) → LaTeX
        const OMML_SYMBOLS = { '∑': '\\sum', '∏': '\\prod', '∫': '\\int', '∬': '\\iint', '∭': '\\iiint', '∮': '\\oint',
            '∞': '\\infty', '±': '\\pm', '∓': '\\mp', '×': '\\times', '÷': '\\div', '≤': '\\le', '≥': '\\ge', '≠': '\\ne',
            '≈': '\\approx', '→': '\\to', '∂': '\\partial', '∇': '\\nabla', '⋅': '\\cdot', '·': '\\cdot', '…': '\\ldots', '⋯': '\\cdots' };
        const OMML_ACCENTS = { '̂': 'hat', '^': 'hat', '̃': 'tilde', '~': 'tilde', '̄': 'bar', '¯': 'bar', '⃗': 'vec', '→': 'vec', '̇': 'dot', '̈': 'ddot' };
        function ommlToLatex(el) {
            const kid = name => xFirst(el, name);
            const sub = name => kid(name) ? ommlToLatex(kid(name)) : '';
            const all = () => xKids(el).map(ommlToLatex).join('');
            switch (xLocal(el)) {
                case 'r': return xKids(el, 't').map(t => Array.from(t.textContent).map(ch => OMML_SYMBOLS[ch] ? OMML_SYMBOLS[ch] + ' ' : ch).join('')).join('');
                case 'sSup': return '{' + sub('e') + '}^{' + sub('sup') + '}';
                case 'sSub': return '{' + sub('e') + '}_{' + sub('sub') + '}';
                case 'sSubSup': return '{' + sub('e') + '}_{' + sub('sub') + '}^{' + sub('sup') + '}';
                case 'f': return '\\frac{' + sub('num') + '}{' + sub('den') + '}';
                case 'rad': {
                    const hide = xAll(el, 'degHide')[0];
                    const deg = sub('deg');
                    return (hide && xAttr(hide, 'val') !== '0') || !deg ? '\\sqrt{' + sub('e') + '}' : '\\sqrt[' + deg + ']{' + sub('e') + '}';
                }
                case 'd': {
                    const pr = kid('dPr');
                    const beg = pr && xFirst(pr, 'begChr') ? xAttr(xFirst(pr, 'begChr'), 'val') : '(';
                    const end = pr && xFirst(pr, 'endChr') ? xAttr(xFirst(pr, 'endChr'), 'val') : ')';
                    const fix = c => c === '{' ? '\\{' : c === '}' ? '\\}' : (c || '.');
                    return '\\left' + fix(beg) + ' ' + xKids(el, 'e').map(ommlToLatex).join(', ') + ' \\right' + fix(end);
                }
                case 'nary': {
                    const pr = kid('naryPr');
                    const chr = pr && xFirst(pr, 'chr') ? xAttr(xFirst(pr, 'chr'), 'val') : '∫';
                    return (OMML_SYMBOLS[chr] || chr) + '_{' + sub('sub') + '}^{' + sub('sup') + '} ' + sub('e');
                }
                case 'limLow': return '{' + sub('e') + '}_{' + sub('lim') + '}';
                case 'limUpp': return '{' + sub('e') + '}^{' + sub('lim') + '}';
                case 'acc': {
                    const pr = kid('accPr');
                    const chr = pr && xFirst(pr, 'chr') ? xAttr(xFirst(pr, 'chr'), 'val') : '̂';
                    return '\\' + (OMML_ACCENTS[chr] || 'hat') + '{' + sub('e') + '}';
                }
                case 'bar': return '\\overline{' + sub('e') + '}';
                case 'func': return sub('fName') + ' ' + sub('e');
                case 'm': return '\\begin{matrix}' + xKids(el, 'mr').map(mr => xKids(mr, 'e').map(ommlToLatex).join(' & ')).join(' \\\\ ') + '\\end{matrix}';
                case 'eqArr': return '\\begin{aligned}' + xKids(el, 'e').map(ommlToLatex).join(' \\\\ ') + '\\end{aligned}';
                case 'rPr': case 'ctrlPr': case 'naryPr': case 'dPr': case 'fPr': case 'radPr': case 'sSupPr': case 'sSubPr':
                case 'sSubSupPr': case 'accPr': case 'mPr': case 'funcPr': case 'limLowPr': case 'limUppPr': case 'barPr':
                    return '';
                default: return all();
            }
        }

        /**
         * DOCX 파일 묶음 → 마크다운
         */
        function docxToMarkdown(files) {
            const decoder = new TextDecoder();
            const parser = new DOMParser();
            const xmlOf = name => files.has(name) ? parser.parseFromString(decoder.decode(files.get(name)), 'application/xml') : null;
            const doc = xmlOf('word/document.xml');
            if (!doc) throw new Error('word/document.xml이 없습니다');
            const rels = new Map();
            const relDoc = xmlOf('word/_rels/document.xml.rels');
            if (relDoc) xAll(relDoc.documentElement, 'Relationship').forEach(rel => rels.set(rel.getAttribute('Id'), {
                target: rel.getAttribute('Target'), external: rel.getAttribute('TargetMode') === 'External'
            }));
            const partPath = target => target.startsWith('/') ? target.slice(1) : 'word/' + target.replace(/^\.\//, '');

            // 스타일: 제목 수준·코드·인용
            const styleInfo = new Map();
            const stylesDoc = xmlOf('word/styles.xml');
            if (stylesDoc) xAll(stylesDoc.documentElement, 'style').forEach(st => {
                const id = xAttr(st, 'styleId');
                const name = (xAttr(xFirst(st, 'name'), 'val') || '').toLowerCase();
                const outline = xAll(st, 'outlineLvl')[0];
                let level = null;
                const m = /^(?:heading|제목)\s*(\d)$/.exec(name) || /^heading(\d)$/i.exec(id || '');
                if (m) level = parseInt(m[1], 10);
                else if (outline) level = parseInt(xAttr(outline, 'val'), 10) + 1;
                if (name === 'title') level = 1;
                styleInfo.set(id, {
                    level: level && level <= 6 ? level : null,
                    code: /source code|verbatim|code|html preformatted/.test(name),
                    quote: /quote|block text|인용/.test(name)
                });
            });
            // 번호 매기기: numId → 수준별 번호 모양
            const numFormats = new Map();
            const numDoc = xmlOf('word/numbering.xml');
            if (numDoc) {
                const abstracts = new Map();
                xAll(numDoc.documentElement, 'abstractNum').forEach(an => {
                    const levels = new Map();
                    xKids(an, 'lvl').forEach(lvl => levels.set(xAttr(lvl, 'ilvl'), xAttr(xFirst(lvl, 'numFmt'), 'val') || 'bullet'));
                    abstracts.set(xAttr(an, 'abstractNumId'), levels);
                });
                xKids(numDoc.documentElement, 'num').forEach(num => {
                    numFormats.set(xAttr(num, 'numId'), abstracts.get(xAttr(xFirst(num, 'abstractNumId'), 'val')) || new Map());
                });
            }
            // 각주
            const footnoteText = new Map();
            const notes = [];
            const fnDoc = xmlOf('word/footnotes.xml');

            const on = el => el && !/^(0|false|off|none)$/i.test(xAttr(el, 'val') || 'true');
            function runsOf(parent, segments) {
                xKids(parent).forEach(el => {
                    const name = xLocal(el);
                    if (name === 'r') {
                        const rPr = xFirst(el, 'rPr');
                        const va = rPr && xFirst(rPr, 'vertAlign') ? xAttr(xFirst(rPr, 'vertAlign'), 'val') : '';
                        const fmt = {
                            bold: on(rPr && xFirst(rPr, 'b')), italic: on(rPr && xFirst(rPr, 'i')),
                            strike: on(rPr && (xFirst(rPr, 'strike') || xFirst(rPr, 'dstrike'))),
                            sup: va === 'superscript', sub: va === 'subscript'
                        };
                        xKids(el).forEach(child => {
                            const c = xLocal(child);
                            if (c === 't') segments.push({ text: child.textContent, fmt });
                            else if (c === 'tab') segments.push({ text: '\t', fmt });
                            else if (c === 'br' || c === 'cr') segments.push({ text: '\n', fmt });
                            else if (c === 'noBreakHyphen') segments.push({ text: '-', fmt });
                            else if (c === 'footnoteReference' && fnDoc) {
                                const id = xAttr(child, 'id');
                                const fn = xAll(fnDoc.documentElement, 'footnote').find(f => xAttr(f, 'id') === id);
                                if (fn) {
                                    const inner = [];
                                    xKids(fn, 'p').forEach(fp => { runsOf(fp, inner); inner.push({ text: ' ', fmt: {} }); });
                                    notes.push(mdInlineFromSegments(inner).trim());
                                    segments.push({ md: '[^' + notes.length + ']' });
                                }
                            } else if (c === 'drawing' || c === 'pict') {
                                const blip = xAll(child, 'blip')[0] || xAll(child, 'imagedata')[0];
                                const rid = blip && (xAttr(blip, 'embed') || xAttr(blip, 'id'));
                                const rel = rid && rels.get(rid);
                                const bytes = rel && files.get(partPath(rel.target));
                                if (bytes) segments.push({ md: '![그림](' + bytesToDataUrl(bytes, imageMime(rel.target, bytes)) + ')' });
                                else if (xAll(child, 'chart').length) segments.push({ text: '[차트]', fmt: {} });
                            }
                        });
                    } else if (name === 'hyperlink') {
                        const inner = [];
                        runsOf(el, inner);
                        const rel = rels.get(xAttr(el, 'id'));
                        const text = mdInlineFromSegments(inner);
                        segments.push({ md: rel && rel.external ? '[' + text + '](' + rel.target.replace(/[()\s]/g, encodeURIComponent) + ')' : text });
                    } else if (name === 'oMath') {
                        segments.push({ md: '\\(' + ommlToLatex(el).replace(/\s+/g, ' ').trim() + '\\)' });
                    } else if (name === 'oMathPara') {
                        segments.push({ md: '\n$$\n' + xKids(el, 'oMath').map(m => ommlToLatex(m).replace(/\s+/g, ' ').trim()).join(' \\\\ ') + '\n$$\n' });
                    } else if (/^(ins|smartTag|fldSimple|sdt|sdtContent|customXml)$/.test(name)) {
                        runsOf(name === 'sdt' ? xFirst(el, 'sdtContent') || el : el, segments);
                    }
                });
            }

            function tableBlock(tbl) {
                const cells = [];
                const open = [];   // 열마다 세로 병합 중인 셀
                xKids(tbl, 'tr').forEach((tr, r) => {
                    let col = 0;
                    const header = !!xAll(tr, 'tblHeader').length;
                    xKids(tr, 'tc').forEach(tc => {
                        const tcPr = xFirst(tc, 'tcPr');
                        const span = tcPr && xFirst(tcPr, 'gridSpan') ? parseInt(xAttr(xFirst(tcPr, 'gridSpan'), 'val'), 10) || 1 : 1;
                        const vMerge = tcPr && xFirst(tcPr, 'vMerge');
                        if (vMerge && xAttr(vMerge, 'val') !== 'restart' && open[col]) {
                            open[col].rowSpan++;
                        } else {
                            const segs = xKids(tc, 'p').map(p => {
                                const s = [];
                                runsOf(p, s);
                                // 머리행은 표 서식으로 굵으므로 굵게 표시를 뺀다
                                return header ? s.map(sg => sg.fmt ? Object.assign({}, sg, { fmt: Object.assign({}, sg.fmt, { bold: false }) }) : sg) : s;
                            });
                            const cell = {
                                row: r, col, rowSpan: 1, colSpan: span, header,
                                md: segs.map(s => mdInlineFromSegments(s).trim()).filter(Boolean).join('\n'),
                                text: segs.map(s => s.map(x => x.text || '').join('').trim()).filter(Boolean).join('\n')
                            };
                            cells.push(cell);
                            for (let k = 0; k < span; k++) open[col + k] = vMerge ? cell : null;
                        }
                        col += span;
                    });
                });
                return { md: mdTableFromCells(cells) };
            }

            const blocks = [];
            let codeBuffer = null;
            const flushCode = () => {
                if (codeBuffer) { blocks.push({ md: '```\n' + codeBuffer.join('\n') + '\n```' }); codeBuffer = null; }
            };
            function walkBody(parent) {
                xKids(parent).forEach(el => {
                    const name = xLocal(el);
                    if (name === 'sdt') { walkBody(xFirst(el, 'sdtContent') || el); return; }
                    if (name === 'tbl') { flushCode(); blocks.push(tableBlock(el)); return; }
                    if (name !== 'p') return;
                    const pPr = xFirst(el, 'pPr');
                    const styleId = pPr && xFirst(pPr, 'pStyle') ? xAttr(xFirst(pPr, 'pStyle'), 'val') : null;
                    const info = styleInfo.get(styleId) || {};
                    const segments = [];
                    runsOf(el, segments);
                    if (info.code) {
                        const text = segments.map(sg => sg.text != null ? sg.text : '').join('');
                        (codeBuffer = codeBuffer || []).push(...text.split('\n'));
                        return;
                    }
                    flushCode();
                    let md = mdInlineFromSegments(segments).replace(/^[ \t\u00A0]+/, '').replace(/\n[ \t]+/g, '\n');
                    if (!md.trim()) return;
                    const outline = pPr && xFirst(pPr, 'outlineLvl');
                    const level = info.level || (outline ? parseInt(xAttr(outline, 'val'), 10) + 1 : null);
                    const numPr = pPr && xFirst(pPr, 'numPr');
                    if (level && level <= 6) {
                        blocks.push({ md: '#'.repeat(level) + ' ' + md.replace(/\n/g, ' ').trim() });
                    } else if (numPr && xFirst(numPr, 'numId') && xAttr(xFirst(numPr, 'numId'), 'val') !== '0') {
                        const ilvl = xFirst(numPr, 'ilvl') ? xAttr(xFirst(numPr, 'ilvl'), 'val') : '0';
                        const fmt = (numFormats.get(xAttr(xFirst(numPr, 'numId'), 'val')) || new Map()).get(ilvl) || 'bullet';
                        const marker = fmt === 'bullet' || fmt === 'none' ? '- ' : '1. ';
                        blocks.push({ md: '   '.repeat(parseInt(ilvl, 10) || 0) + marker + md.replace(/\n/g, ' '), list: true });
                    } else if (info.quote) {
                        blocks.push({ md: md.split('\n').map(line => '> ' + line).join('\n') });
                    } else {
                        blocks.push({ md });
                    }
                });
            }
            walkBody(xFirst(doc.documentElement, 'body'));
            flushCode();
            return mdJoinBlocks(blocks, notes);
        }

        /**
         * 한글·Word 파일 열기 → 마크다운으로 변환해 에디터에 싣는다
         */
        async function importOfficeFile(file) {
            try {
                const files = await readZipEntries(await file.arrayBuffer());
                const isHwpx = /\.hwpx$/i.test(file.name);
                const markdown = isHwpx ? hwpxToMarkdown(files) : docxToMarkdown(files);
                editor.value = markdown;
                updatePreview();
                currentFilename = file.name.replace(/\.(hwpx|docx)$/i, '') + '.md';
                filenameDisplay.textContent = currentFilename;
                history = [];
                historyIndex = -1;
                saveToHistory();
                console.log('✅ ' + (isHwpx ? '한글' : 'Word') + ' 파일을 마크다운으로 변환:', file.name);
            } catch (error) {
                console.error('❌ 파일 변환 오류:', error);
                alert('파일을 마크다운으로 변환하는 중 오류가 발생했습니다:\n' + error.message);
            }
        }

        /**
         * 파일 열기 (.md·.markdown·.txt는 그대로, .hwpx·.docx는 마크다운으로 변환)
         */
        function openMarkdownFile(file) {
            if (!file) return;
            if (/\.(hwpx|docx)$/i.test(file.name)) { importOfficeFile(file); return; }
            if (/\.(hwp|doc)$/i.test(file.name)) {
                alert('구형 HWP·DOC 파일은 열 수 없습니다. 한/글·Word에서 .hwpx·.docx로 저장한 뒤 여세요.');
                return;
            }

            const reader = new FileReader();

            reader.onload = (e) => {
                try {
                    const content = e.target.result;

                    // 에디터에 내용 로드
                    editor.value = content;
                    updatePreview();

                    // 파일명 업데이트
                    currentFilename = file.name;
                    filenameDisplay.textContent = currentFilename;

                    // 히스토리 초기화 및 현재 상태 저장
                    history = [];
                    historyIndex = -1;
                    saveToHistory();

                    console.log('✅ 파일 열기 완료:', currentFilename);

                } catch (error) {
                    console.error('❌ 파일 읽기 오류:', error);
                    alert('파일을 읽는 중 오류가 발생했습니다:\n' + error.message);
                }
            };

            reader.onerror = () => {
                console.error('❌ 파일 읽기 실패');
                alert('파일을 읽을 수 없습니다.');
            };

            reader.readAsText(file);
        }

        /**
         * 마크다운 파일로 저장 (저장 경로 지정 지원)
         */
        async function saveMarkdownFile() {
            try {
                const content = editor.value;

                // File System Access API 지원 시 저장 경로 선택 대화상자 표시
                if (window.showSaveFilePicker) {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: currentFilename,
                        types: [{
                            description: 'Markdown Files',
                            accept: { 'text/markdown': ['.md', '.markdown'] }
                        }, {
                            description: 'Text Files',
                            accept: { 'text/plain': ['.txt'] }
                        }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(content);
                    await writable.close();
                    currentFilename = handle.name;
                    filenameDisplay.textContent = currentFilename;
                    console.log('✅ 마크다운 저장 완료:', currentFilename);
                } else {
                    // 폴백: 파일명 입력 후 다운로드 (file:// 등 File System Access API 미지원 환경)
                    const filename = prompt('저장할 파일명을 입력하세요:', currentFilename);
                    if (!filename) return; // 취소
                    currentFilename = filename.endsWith('.md') || filename.endsWith('.markdown') || filename.endsWith('.txt')
                        ? filename : filename + '.md';
                    filenameDisplay.textContent = currentFilename;
                    const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = currentFilename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    console.log('✅ 마크다운 저장 완료 (다운로드):', currentFilename);
                }

            } catch (error) {
                if (error.name === 'AbortError') return; // 사용자가 대화상자 취소
                console.error('❌ 파일 저장 오류:', error);
                alert('파일 저장 중 오류가 발생했습니다:\n' + error.message);
            }
        }

        /**
         * 드래그 앤 드롭 처리
         */
        function setupDragAndDrop() {
            // 드래그 오버 방지 (전체 창)
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                document.body.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            // 에디터 영역에 드래그 오버 효과
            ['dragenter', 'dragover'].forEach(eventName => {
                editorPanel.addEventListener(eventName, () => {
                    editorPanel.classList.add('drag-over');
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                editorPanel.addEventListener(eventName, () => {
                    editorPanel.classList.remove('drag-over');
                }, false);
            });

            // 파일 드롭 처리
            editorPanel.addEventListener('drop', handleDrop, false);

            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;

                if (files.length > 0) {
                    const file = files[0];

                    // 마크다운·텍스트 파일과 한글(.hwpx)·Word(.docx) 파일 허용
                    if (file.name.match(/\.(md|markdown|txt|hwpx|docx|hwp|doc)$/i)) {
                        openMarkdownFile(file);
                    } else {
                        alert('마크다운(.md, .markdown, .txt)·한글(.hwpx)·Word(.docx) 파일만 열 수 있습니다.');
                    }
                }
            }
        }

        // ============================================================
        // 이벤트 리스너 등록
        // ============================================================

        // 에디터 입력 시 실시간 미리보기 업데이트 및 히스토리 저장
        let inputTimeout;
        editor.addEventListener('input', () => {
            updatePreview();

            // 디바운싱: 500ms 후에 히스토리 저장
            clearTimeout(inputTimeout);
            inputTimeout = setTimeout(() => {
                saveToHistory();
            }, 500);
        });

        // 툴바 버튼 클릭 이벤트
        toolbarButtons.forEach(button => {
            button.addEventListener('click', () => {
                const action = button.getAttribute('data-action');
                insertMarkdown(action);
            });
        });

        // Undo/Redo 버튼
        undoBtn.addEventListener('click', undo);
        redoBtn.addEventListener('click', redo);

        // 파일 열기 버튼
        openFileBtn.addEventListener('click', () => {
            fileInput.click();
        });

        // 파일 선택 시
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                openMarkdownFile(file);
            }
            // 파일 입력 초기화 (같은 파일 재선택 가능하도록)
            fileInput.value = '';
        });

        // 마크다운 저장 버튼
        saveMarkdownBtn.addEventListener('click', saveMarkdownFile);

        // PDF 내보내기 버튼
        exportPdfBtn.addEventListener('click', exportToPDF);

        // Word 내보내기 버튼
        exportWordBtn.addEventListener('click', exportToWord);

        // 한글(HWPX) 내보내기 버튼 — 서술식(발간물)/개조식(정부 보고서)
        exportHwpxBtn.addEventListener('click', exportToHwpx);
        exportHwpxGovBtn.addEventListener('click', exportToHwpxGov);


        // 키보드 단축키
        editor.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                // Ctrl+Z: Undo
                if (e.key === 'z' && !e.shiftKey) {
                    e.preventDefault();
                    undo();
                }
                // Ctrl+Y or Ctrl+Shift+Z: Redo
                else if (e.key === 'y' || (e.key === 'z' && e.shiftKey)) {
                    e.preventDefault();
                    redo();
                }
                // Ctrl+B: Bold
                else if (e.key === 'b' || e.key === 'B') {
                    e.preventDefault();
                    insertMarkdown('bold');
                }
                // Ctrl+I: Italic
                else if (e.key === 'i' || e.key === 'I') {
                    e.preventDefault();
                    insertMarkdown('italic');
                }
            }
        });

        // 리사이저 드래그 및 키보드 조절 기능
        let isResizing = false;
        let isTocResizing = false;
        let wasNarrowLayout = window.matchMedia('(max-width: 767px)').matches;

        function isNarrowLayout() {
            return window.matchMedia('(max-width: 767px)').matches;
        }

        function applyDefaultPanelSizes() {
            const narrow = isNarrowLayout();
            editorPanel.style.flex = narrow ? '1 1 50%' : '1 1 0%';
            previewPanel.style.flex = narrow ? '1 1 50%' : '1 1 0%';
            resizer.setAttribute('aria-orientation', narrow ? 'horizontal' : 'vertical');
        }

        function applyDefaultTocSize() {
            const narrow = isNarrowLayout();
            if (narrow) {
                tocPanel.style.width = '100%';
                tocPanel.style.height = '30%';
                tocPanel.style.flex = '0 0 30%';
            } else {
                tocPanel.style.width = '250px';
                tocPanel.style.height = '';
                tocPanel.style.flex = '0 0 250px';
            }
            tocResizer.setAttribute('aria-orientation', narrow ? 'horizontal' : 'vertical');
        }

        function resizePanels(clientX, clientY) {
            const container = editorPanel.parentElement;
            const containerRect = container.getBoundingClientRect();
            const narrow = isNarrowLayout();
            const tocSize = isTocVisible ? (narrow ? tocPanel.offsetHeight : tocPanel.offsetWidth) : 0;
            const tocDividerSize = isTocVisible
                ? (narrow ? tocResizer.offsetHeight : tocResizer.offsetWidth)
                : 0;
            const availableSize = (narrow ? containerRect.height : containerRect.width) - tocSize - tocDividerSize;
            const editorSize = narrow
                ? clientY - containerRect.top
                : clientX - containerRect.left;
            const minSize = availableSize * 0.2;
            const maxSize = availableSize * 0.8;

            if (editorSize >= minSize && editorSize <= maxSize) {
                const previewSize = availableSize - editorSize - (narrow ? resizer.offsetHeight : resizer.offsetWidth);
                editorPanel.style.flex = `0 0 ${editorSize}px`;
                previewPanel.style.flex = `0 0 ${previewSize}px`;
            }
        }

        function resizeToc(clientX, clientY) {
            const containerRect = editorPanel.parentElement.getBoundingClientRect();
            const narrow = isNarrowLayout();
            const tocSize = narrow
                ? containerRect.bottom - clientY
                : containerRect.right - clientX;
            const totalSize = narrow ? containerRect.height : containerRect.width;
            const minSize = narrow ? 120 : 180;
            const maxSize = Math.min(narrow ? totalSize * 0.5 : totalSize * 0.45, narrow ? 420 : 520);

            if (tocSize >= minSize && tocSize <= maxSize) {
                if (narrow) {
                    tocPanel.style.height = `${tocSize}px`;
                    tocPanel.style.flex = `0 0 ${tocSize}px`;
                } else {
                    tocPanel.style.width = `${tocSize}px`;
                    tocPanel.style.flex = `0 0 ${tocSize}px`;
                }
            }
        }

        resizer.addEventListener('pointerdown', (e) => {
            isResizing = true;
            resizer.setPointerCapture(e.pointerId);
            document.body.style.cursor = isNarrowLayout() ? 'row-resize' : 'col-resize';
            document.body.style.userSelect = 'none';
        });

        resizer.addEventListener('pointermove', (e) => {
            if (!isResizing) return;
            resizePanels(e.clientX, e.clientY);
        });

        function stopResizing() {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            }
        }

        resizer.addEventListener('pointerup', stopResizing);
        resizer.addEventListener('pointercancel', stopResizing);

        tocResizer.addEventListener('pointerdown', (e) => {
            isTocResizing = true;
            tocResizer.setPointerCapture(e.pointerId);
            document.body.style.cursor = isNarrowLayout() ? 'row-resize' : 'col-resize';
            document.body.style.userSelect = 'none';
        });

        tocResizer.addEventListener('pointermove', (e) => {
            if (!isTocResizing) return;
            resizeToc(e.clientX, e.clientY);
        });

        function stopTocResizing() {
            if (isTocResizing) {
                isTocResizing = false;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            }
        }

        tocResizer.addEventListener('pointerup', stopTocResizing);
        tocResizer.addEventListener('pointercancel', stopTocResizing);

        resizer.addEventListener('keydown', (e) => {
            const narrow = isNarrowLayout();
            const decreaseKey = narrow ? 'ArrowUp' : 'ArrowLeft';
            const increaseKey = narrow ? 'ArrowDown' : 'ArrowRight';
            if (e.key !== decreaseKey && e.key !== increaseKey) return;

            e.preventDefault();
            const rect = resizer.getBoundingClientRect();
            const step = 24 * (e.key === decreaseKey ? -1 : 1);
            resizePanels(rect.left + step, rect.top + step);
        });

        tocResizer.addEventListener('keydown', (e) => {
            const narrow = isNarrowLayout();
            const increaseKey = narrow ? 'ArrowUp' : 'ArrowLeft';
            const decreaseKey = narrow ? 'ArrowDown' : 'ArrowRight';
            if (e.key !== increaseKey && e.key !== decreaseKey) return;

            e.preventDefault();
            const rect = tocResizer.getBoundingClientRect();
            const step = 24 * (e.key === increaseKey ? -1 : 1);
            resizeToc(rect.left + step, rect.top + step);
        });

        window.addEventListener('resize', () => {
            const narrow = isNarrowLayout();
            if (narrow !== wasNarrowLayout) {
                wasNarrowLayout = narrow;
                applyDefaultPanelSizes();
                applyDefaultTocSize();
            }
        });

        applyDefaultPanelSizes();
        applyDefaultTocSize();

        // 스크롤 동기화
        // 에디터 스크롤 -> 프리뷰 스크롤 동기화
        editor.addEventListener('scroll', () => {
            if (!isSyncEnabled || isSyncingScroll) return;

            isSyncingScroll = true;

            // 에디터의 스크롤 비율 계산
            const scrollPercentage = editor.scrollTop / (editor.scrollHeight - editor.clientHeight);

            // 프리뷰를 같은 비율로 스크롤
            preview.scrollTop = scrollPercentage * (preview.scrollHeight - preview.clientHeight);

            setTimeout(() => {
                isSyncingScroll = false;
            }, 10);
        });

        // 프리뷰 스크롤 -> 에디터 스크롤 동기화
        preview.addEventListener('scroll', () => {
            if (!isSyncEnabled || isSyncingScroll) return;

            isSyncingScroll = true;

            // 프리뷰의 스크롤 비율 계산
            const scrollPercentage = preview.scrollTop / (preview.scrollHeight - preview.clientHeight);

            // 에디터를 같은 비율로 스크롤
            editor.scrollTop = scrollPercentage * (editor.scrollHeight - editor.clientHeight);

            setTimeout(() => {
                isSyncingScroll = false;
            }, 10);
        });

        // 목차 패널 토글
        toggleTocBtn.addEventListener('click', () => {
            isTocVisible = !isTocVisible;

            if (isTocVisible) {
                // 패널 표시
                applyDefaultTocSize();
                tocResizer.style.display = 'block';
                tocPanel.style.display = 'flex';
                toggleTocBtn.classList.add('bg-blue-100');
            } else {
                // 패널 숨김
                tocResizer.style.display = 'none';
                tocPanel.style.display = 'none';
                toggleTocBtn.classList.remove('bg-blue-100');
            }
        });

        // 스크롤 동기화 토글
        toggleSyncBtn.addEventListener('click', () => {
            isSyncEnabled = !isSyncEnabled;
            if (isSyncEnabled) {
                toggleSyncBtn.classList.add('bg-green-100');
                toggleSyncBtn.classList.remove('bg-red-100');
            } else {
                toggleSyncBtn.classList.remove('bg-green-100');
                toggleSyncBtn.classList.add('bg-red-100');
            }
        });

        // ===== 찾기/바꾸기 기능 =====

        // 찾기 패널 열기
        findBtn.addEventListener('click', () => {
            findReplacePanel.style.display = 'block';
            replaceRow.style.display = 'none';
            findInput.focus();
            findInput.select();
        });

        // 바꾸기 패널 열기
        replaceBtn.addEventListener('click', () => {
            findReplacePanel.style.display = 'block';
            replaceRow.style.display = 'flex';
            findInput.focus();
            findInput.select();
        });

        // 표기·문체 검사 패널
        const lintPanel = document.getElementById('lintPanel');
        let lintTimeout;
        document.getElementById('lintBtn').addEventListener('click', () => {
            lintPanel.style.display = lintPanel.style.display === 'none' ? 'block' : 'none';
            refreshLintPanel();
        });
        document.getElementById('closeLintBtn').addEventListener('click', () => {
            lintPanel.style.display = 'none';
        });
        ['lintNotation', 'lintMunche', 'lintStrict'].forEach(id => {
            document.getElementById(id).addEventListener('change', refreshLintPanel);
        });
        editor.addEventListener('input', () => {
            if (lintPanel.style.display === 'none') return;
            clearTimeout(lintTimeout);
            lintTimeout = setTimeout(refreshLintPanel, 400);
        });

        // 패널 닫기
        closeFindBtn.addEventListener('click', () => {
            findReplacePanel.style.display = 'none';
            clearHighlights();
        });

        // 찾기 함수
        function findInEditor(searchText) {
            if (!searchText) {
                clearHighlights();
                findCount.textContent = '0개 찾음';
                return;
            }

            const text = editor.value;
            findMatches = [];
            let index = 0;

            // 모든 매치 찾기
            while ((index = text.indexOf(searchText, index)) !== -1) {
                findMatches.push(index);
                index += searchText.length;
            }

            // 카운트 업데이트
            if (findMatches.length > 0) {
                currentMatchIndex = 0;
                findCount.textContent = `${findMatches.length}개 찾음`;
                highlightCurrentMatch();
            } else {
                currentMatchIndex = -1;
                findCount.textContent = '0개 찾음';
            }
        }

        // 현재 매치 하이라이트
        function highlightCurrentMatch() {
            if (currentMatchIndex < 0 || currentMatchIndex >= findMatches.length) return;

            const matchPos = findMatches[currentMatchIndex];
            const searchText = findInput.value;

            // 커서 이동 및 선택
            editor.focus();
            editor.setSelectionRange(matchPos, matchPos + searchText.length);

            // 스크롤하여 보이기
            const lineHeight = parseInt(window.getComputedStyle(editor).lineHeight) || 20;
            const textBeforeMatch = editor.value.substring(0, matchPos);
            const lineNumber = (textBeforeMatch.match(/\n/g) || []).length;
            editor.scrollTop = lineNumber * lineHeight - editor.clientHeight / 2;

            // 카운트 업데이트
            findCount.textContent = `${currentMatchIndex + 1}/${findMatches.length}`;
        }

        // 하이라이트 제거
        function clearHighlights() {
            findMatches = [];
            currentMatchIndex = -1;
        }

        // 이전 찾기
        findPrevBtn.addEventListener('click', () => {
            if (findMatches.length === 0) return;
            currentMatchIndex = (currentMatchIndex - 1 + findMatches.length) % findMatches.length;
            highlightCurrentMatch();
        });

        // 다음 찾기
        findNextBtn.addEventListener('click', () => {
            if (findMatches.length === 0) return;
            currentMatchIndex = (currentMatchIndex + 1) % findMatches.length;
            highlightCurrentMatch();
        });

        // 찾기 입력 변경 시
        findInput.addEventListener('input', () => {
            findInEditor(findInput.value);
        });

        // Enter 키로 다음 찾기
        findInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (e.shiftKey) {
                    findPrevBtn.click();
                } else {
                    findNextBtn.click();
                }
            } else if (e.key === 'Escape') {
                closeFindBtn.click();
            }
        });

        // 바꾸기 입력에서 Enter
        replaceInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                replaceOneBtn.click();
            } else if (e.key === 'Escape') {
                closeFindBtn.click();
            }
        });

        // 하나 바꾸기
        replaceOneBtn.addEventListener('click', () => {
            if (currentMatchIndex < 0 || currentMatchIndex >= findMatches.length) return;

            const searchText = findInput.value;
            const replaceText = replaceInput.value;
            const matchPos = findMatches[currentMatchIndex];

            // 텍스트 바꾸기
            const text = editor.value;
            editor.value = text.substring(0, matchPos) + replaceText + text.substring(matchPos + searchText.length);

            // 히스토리에 저장
            saveToHistory();

            // 다시 찾기
            findInEditor(searchText);

            // 프리뷰 업데이트
            updatePreview();
        });

        // 모두 바꾸기
        replaceAllBtn.addEventListener('click', () => {
            if (findMatches.length === 0) return;

            const searchText = findInput.value;
            const replaceText = replaceInput.value;

            // 전체 텍스트에서 모두 바꾸기
            const text = editor.value;
            const newText = text.split(searchText).join(replaceText);

            if (text !== newText) {
                editor.value = newText;
                saveToHistory();
                updatePreview();

                // 결과 표시
                const count = findMatches.length;
                findCount.textContent = `${count}개 바꿈`;

                // 다시 찾기 (남은 항목 확인)
                setTimeout(() => {
                    findInEditor(searchText);
                }, 100);
            }
        });

        // 키보드 단축키
        document.addEventListener('keydown', (e) => {
            // Ctrl+F: 찾기
            if (e.ctrlKey && e.key === 'f') {
                e.preventDefault();
                findBtn.click();
            }
            // Ctrl+H: 바꾸기
            else if (e.ctrlKey && e.key === 'h') {
                e.preventDefault();
                replaceBtn.click();
            }
        });

        // ===== 찾기/바꾸기 기능 끝 =====

        // 페이지 로드 시 초기화
        window.addEventListener('DOMContentLoaded', initialize);

        // CDN 로드 실패 감지
        window.addEventListener('error', (e) => {
            if (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK') {
                console.error('❌ 외부 리소스 로드 실패:', e.target.src || e.target.href);
                alert('일부 라이브러리를 로드하는데 실패했습니다.\n인터넷 연결을 확인해주세요.');
            }
        }, true);

    </script>
</body>
</html>
